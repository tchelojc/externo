<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho De Deus | Carregando...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030508;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .container {
            text-align: center;
            color: #00e5ff;
            max-width: 480px;
            padding: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a1a2e;
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
        .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
        .btn-enter {
            display: inline-block;
            padding: 14px 30px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-enter:hover {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }
        .prompt-box {
            background: #0d1220;
            border: 1px solid #1a2035;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-align: left;
            display: none;
        }
        .prompt-box p { margin-bottom: 10px; }
        .prompt-box p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="title">👁️ Verificando acesso...</div>
        <div class="subtitle" id="status">Confirmando sua sessão...</div>
        
        <div class="prompt-box" id="promptBox">
            <p><strong>⚙️ Como funciona:</strong> o Olho De Deus lê as odds e os dados da partida/mercado em tempo real.</p>
            <p><strong>🧭 Como usar:</strong> acompanhe a Mesa GPS pra ver a leitura atual.</p>
            <p><strong>🔐 Seu acesso:</strong> saldo confirmado.</p>
        </div>
        
        <a href="#" class="btn-enter" id="btnEnter" style="display:none;" onclick="abrirPlataforma(event)">
            ▶ Entrar no Olho De Deus
        </a>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // CONFIGURAÇÃO
        // ═══════════════════════════════════════════════════════════
        const WORKER_URL = 'https://almafluxo.uk';
        const LOGIN_URL  = 'https://almafluxo.uk/olhodedeus';   // página de entrada/login do Olho De Deus

        // ─── A chave de sessão usada em TODO o ecossistema é 'almafluxo_usuario'.
        // O antigo 'olho_de_deus_usuario' não é mais gravado por ninguém, então
        // ler dele aqui garantia 100% de redirect pro login (loop).
        function lerUsuario() {
        for (const k of ['almafluxo_usuario', 'olho_de_deus_usuario']) {
            try {
            const s = localStorage.getItem(k);
            if (!s) continue;
            const u = JSON.parse(s);
            if (u && u.email && u.sessionToken) return u;
            } catch (e) {}
        }
        return null;
        }

        async function carregar() {
        const spinner   = document.getElementById('spinner');
        const title     = document.getElementById('title');
        const status    = document.getElementById('status');
        const promptBox = document.getElementById('promptBox');
        const btnEnter  = document.getElementById('btnEnter');

        const usuario = lerUsuario();
        if (!usuario) {
            window.location.href = LOGIN_URL;
            return;
        }

        try {
            // Valida acesso no servidor (mesma rota que o worker já expõe)
            status.textContent = 'Validando acesso...';
            const ctl = new AbortController();
            const tmo = setTimeout(() => ctl.abort(), 30000);
            const response = await fetch(`${WORKER_URL}/proxy/central`, {
            signal: ctl.signal,
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'validarSessionToken',   // mesma checagem do portão /app-olhodedeus e do /proxy/motor
                email: usuario.email,
                plataforma: 'olhodedeus',
                sessionToken: usuario.sessionToken
            })
            });

            clearTimeout(tmo);
            const data = await response.json();
            console.log('[OD] validarSessionToken →', response.status, data);

            // Considera liberado só se o servidor confirmar. Mantém também o
            // caso de master (às vezes o backend devolve só {ok:true}).
            if (!(data.ok === true || data.autenticado === true || data.status === 'success')) {
            throw new Error(data.error || 'Acesso negado');
            }

            spinner.style.display   = 'none';
            title.textContent       = '👁️ Bem-vindo ao Olho De Deus';
            status.textContent      = 'Acesso confirmado. Clique para entrar.';
            promptBox.style.display = 'block';
            btnEnter.style.display  = 'inline-block';
        } catch (e) {
            if (e && e.name === 'AbortError') {   // servidor lento (Apps Script frio): NÃO é sessão inválida, não manda pro login
                spinner.style.display = 'none';
                title.textContent = '⏳ O servidor demorou a responder';
                status.textContent = 'Sua sessão não foi recusada. Toque para tentar de novo.';
                btnEnter.textContent = '🔄 Tentar de novo';
                btnEnter.style.display = 'inline-block';
                btnEnter.onclick = ev => { ev.preventDefault(); location.reload(); };
                return;
            }
            window.location.href = `${LOGIN_URL}?erro=${encodeURIComponent(e.message)}`;
        }
        }

        // ─── Entrar: navega DIRETO para /app-olhodedeus/ (mesma página, sem iframe)
        // em vez de baixar o HTML via fetch e injetar com srcdoc.
        // MOTIVO: dentro de srcdoc, location.origin vira "null", o localStorage não
        // compartilha com almafluxo.uk em Firefox/Safari, e o BroadcastChannel não
        // conecta. Isso quebrava o login, o urlIrmao() e o motor de entropia.
        // Navegando direto, o linear roda como página real no domínio, e o worker
        // injeta window.ALMA_SESSION no <head> a partir da query string.
        function abrirPlataforma(event) {
        event.preventDefault();

        const btnEnter = document.getElementById('btnEnter');
        const status   = document.getElementById('status');

        btnEnter.textContent = '⏳ Carregando plataforma...';
        btnEnter.disabled    = true;
        status.textContent   = 'Redirecionando...';

        const usuario = lerUsuario();
        if (!usuario) {
            window.location.href = LOGIN_URL;
            return;
        }

        const qs = new URLSearchParams({
            email:        usuario.email,
            sessionToken: usuario.sessionToken,
            master:       usuario.master ? 'true' : 'false'
        }).toString();

        window.location.href = `${WORKER_URL}/app-olhodedeus/?${qs}`;
        }

        carregar();
    </script>
</body>
</html>
