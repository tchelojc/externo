<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho De Deus | Carregando...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030508;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .container {
            text-align: center;
            color: #00e5ff;
            max-width: 480px;
            padding: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a1a2e;
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
        .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
        .btn-enter {
            display: inline-block;
            padding: 14px 30px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-enter:hover {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }
        .prompt-box {
            background: #0d1220;
            border: 1px solid #1a2035;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-align: left;
            display: none;
        }
        .prompt-box p { margin-bottom: 10px; }
        .prompt-box p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="title">👁️ Verificando acesso...</div>
        <div class="subtitle" id="status">Confirmando sua sessão...</div>
        
        <div class="prompt-box" id="promptBox">
            <p><strong>⚙️ Como funciona:</strong> o Olho De Deus lê as odds e os dados da partida/mercado em tempo real.</p>
            <p><strong>🧭 Como usar:</strong> acompanhe a Mesa GPS pra ver a leitura atual.</p>
            <p><strong>🔐 Seu acesso:</strong> saldo confirmado.</p>
        </div>
        
        <a href="#" class="btn-enter" id="btnEnter" style="display:none;" onclick="abrirPlataforma(event)">
            ▶ Entrar no Olho De Deus
        </a>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // CONFIGURAÇÃO
        // ═══════════════════════════════════════════════════════════
        const WORKER_URL = 'https://almafluxo.uk';
        const LOGIN_URL = 'https://almafluxo.uk/olhodedeus?erro=sessao_nao_encontrada';
        const TOKEN_INTERNO = 'ALMA369UA';
        
        async function carregar() {
            const spinner = document.getElementById('spinner');
            const title = document.getElementById('title');
            const status = document.getElementById('status');
            const promptBox = document.getElementById('promptBox');
            const btnEnter = document.getElementById('btnEnter');
            
            try {
                // PASSO 1: Verifica sessão (URL primeiro, depois localStorage)
                let usuario = null;
                
                // Tentar pegar da URL primeiro
                const urlParams = new URLSearchParams(window.location.search);
                const emailURL = urlParams.get('email');
                const tokenURL = urlParams.get('sessionToken');
                
                if (emailURL && tokenURL) {
                    console.log('✅ [SESSÃO] Obtida da URL:', emailURL);
                    usuario = { email: emailURL, sessionToken: tokenURL };
                    localStorage.setItem('olho_de_deus_usuario', JSON.stringify(usuario));
                } else {
                    // Fallback: localStorage
                    const sessao = localStorage.getItem('olho_de_deus_usuario');
                    if (!sessao) {
                        console.error('❌ [SESSÃO] Nenhuma sessão encontrada');
                        window.location.href = LOGIN_URL;
                        return;
                    }
                    usuario = JSON.parse(sessao);
                    console.log('✅ [SESSÃO] Obtida do localStorage:', usuario.email);
                }
                
                // PASSO 2: Valida acesso via /proxy/central (que funciona)
                status.textContent = 'Validando acesso...';
                console.log('🔍 [VALIDAÇÃO] Verificando acesso para:', usuario.email);
                
                // ✅ CORREÇÃO: Usar /proxy/central (MESMO que funcionou no login)
                const response = await fetch(`${WORKER_URL}/proxy/central`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verificarAcesso',
                        email: usuario.email,
                        plataforma: 'olhodedeus',
                        sessionToken: usuario.sessionToken,
                        tk: TOKEN_INTERNO
                    })
                });
                
                console.log('📡 [VALIDAÇÃO] Status:', response.status);
                
                const textResponse = await response.text();
                console.log('📄 [VALIDAÇÃO] Resposta bruta:', textResponse.substring(0, 200));
                
                let data;
                try {
                    data = JSON.parse(textResponse);
                } catch (e) {
                    throw new Error('Resposta inválida do servidor');
                }
                
                if (!data.ok || !data.acessoPermitido) {
                    throw new Error(data.error || 'Acesso negado');
                }
                
                // PASSO 3: Mostra botão de entrada
                spinner.style.display = 'none';
                title.textContent = '👁️ Bem-vindo ao Olho De Deus';
                status.textContent = 'Acesso confirmado. Clique para entrar.';
                promptBox.style.display = 'block';
                btnEnter.style.display = 'inline-block';
                
            } catch (e) {
                console.error('❌ [VALIDAÇÃO] Erro:', e.message);
                window.location.href = LOGIN_URL;
            }
        }
        
        async function abrirPlataforma(event) {
            event.preventDefault();
            
            const btnEnter = document.getElementById('btnEnter');
            const status = document.getElementById('status');
            
            btnEnter.textContent = '⏳ Carregando plataforma...';
            btnEnter.disabled = true;
            status.textContent = 'Buscando conteúdo...';
            
            try {
                const sessao = localStorage.getItem('olho_de_deus_usuario');
                const usuario = JSON.parse(sessao);
                
                console.log('📡 [PLATAFORMA] Buscando HTML...');
                
                // ✅ CORREÇÃO: Buscar HTML via /proxy/central sem expor ID
                const response = await fetch(`${WORKER_URL}/proxy/central`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'buscarConteudoPlataforma',
                        plataforma: 'olhodedeus',
                        email: usuario.email,
                        sessionToken: usuario.sessionToken,
                        tk: TOKEN_INTERNO
                    })
                });
                
                console.log('📡 [PLATAFORMA] Status:', response.status);
                
                const textResponse = await response.text();
                console.log('📄 [PLATAFORMA] Tamanho:', textResponse.length);
                
                let data;
                try {
                    data = JSON.parse(textResponse);
                } catch (e) {
                    throw new Error('Resposta inválida');
                }
                
                if (data.ok && data.html) {
                    // Exibe o HTML no iframe
                    status.textContent = 'Plataforma carregada!';
                    btnEnter.textContent = '✅ Carregado';
                    btnEnter.disabled = true;
                    
                    const iframe = document.createElement('iframe');
                    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;background:#030508;';
                    iframe.srcdoc = data.html;
                    
                    document.getElementById('container').style.display = 'none';
                    document.body.appendChild(iframe);
                    
                    window.addEventListener('message', function(event) {
                        if (event.data === 'fechar-plataforma') {
                            iframe.remove();
                            document.getElementById('container').style.display = '';
                            btnEnter.textContent = '▶ Entrar no Olho De Deus';
                            btnEnter.disabled = false;
                        }
                    });
                } else {
                    throw new Error(data.error || 'Erro ao carregar conteúdo');
                }
                
            } catch (e) {
                console.error('❌ [PLATAFORMA] Erro:', e.message);
                btnEnter.textContent = '▶ Entrar no Olho De Deus';
                btnEnter.disabled = false;
                status.textContent = 'Erro ao carregar.';
                alert('Erro: ' + e.message);
            }
        }

        function exibirPlataforma(html, status, btnEnter) {
            status.textContent = 'Plataforma carregada!';
            btnEnter.textContent = '✅ Carregado';
            btnEnter.disabled = true;
            
            console.log('✅ [PLATAFORMA] Exibindo HTML no iframe');
            
            // Cria um iframe em tela cheia
            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;background:#030508;';
            iframe.srcdoc = html;  // ✅ Carrega o HTML DENTRO do iframe
            
            // Remove o container original
            document.getElementById('container').style.display = 'none';
            
            // Adiciona o iframe
            document.body.appendChild(iframe);
            
            // Listener para mensagens do iframe
            window.addEventListener('message', function(event) {
                if (event.data === 'fechar-plataforma') {
                    iframe.remove();
                    document.getElementById('container').style.display = '';
                    btnEnter.textContent = '▶ Entrar no Olho De Deus';
                    btnEnter.disabled = false;
                }
                if (event.data === 'voltar-login') {
                    window.location.href = LOGIN_URL;
                }
            });
        }
        
        carregar();
    </script>
</body>
</html>
