<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho De Deus | Carregando...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030508;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .container {
            text-align: center;
            color: #00e5ff;
            max-width: 480px;
            padding: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a1a2e;
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
        .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
        .btn-enter {
            display: inline-block;
            padding: 14px 30px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-enter:hover {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }
        .prompt-box {
            background: #0d1220;
            border: 1px solid #1a2035;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-align: left;
            display: none;
        }
        .prompt-box p { margin-bottom: 10px; }
        .prompt-box p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="title">👁️ Verificando acesso...</div>
        <div class="subtitle" id="status">Confirmando sua sessão...</div>
        
        <div class="prompt-box" id="promptBox">
            <p><strong>⚙️ Como funciona:</strong> o Olho De Deus lê as odds e os dados da partida/mercado em tempo real.</p>
            <p><strong>🧭 Como usar:</strong> acompanhe a Mesa GPS pra ver a leitura atual.</p>
            <p><strong>🔐 Seu acesso:</strong> saldo confirmado.</p>
        </div>
        
        <a href="#" class="btn-enter" id="btnEnter" style="display:none;" onclick="abrirPlataforma(event)">
            ▶ Entrar no Olho De Deus
        </a>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // CONFIGURAÇÃO
        // ═══════════════════════════════════════════════════════════
        const WORKER_URL = 'https://almafluxo.uk';
        const LOGIN_URL = 'https://almafluxo.uk/olhodedeus';
        
        async function carregar() {
            const spinner = document.getElementById('spinner');
            const title = document.getElementById('title');
            const status = document.getElementById('status');
            const promptBox = document.getElementById('promptBox');
            const btnEnter = document.getElementById('btnEnter');
            
            try {
                // PASSO 1: Verifica sessão no localStorage
                const sessao = localStorage.getItem('olho_de_deus_usuario');
                if (!sessao) {
                    window.location.href = LOGIN_URL;
                    return;
                }
                
                const usuario = JSON.parse(sessao);
                
                // PASSO 2: Valida acesso no servidor
                status.textContent = 'Validando acesso...';
                const response = await fetch(`${WORKER_URL}/proxy/central`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verificarAcesso',
                        email: usuario.email,
                        plataforma: 'olhodedeus',
                        sessionToken: usuario.sessionToken
                    })
                });
                
                const data = await response.json();
                
                if (!data.ok || !data.acessoPermitido) {
                    throw new Error(data.error || 'Acesso negado');
                }
                
                // PASSO 3: Mostra botão de entrada
                spinner.style.display = 'none';
                title.textContent = '👁️ Bem-vindo ao Olho De Deus';
                status.textContent = 'Acesso confirmado. Clique para entrar.';
                promptBox.style.display = 'block';
                btnEnter.style.display = 'inline-block';
                
            } catch (e) {
                window.location.href = `${LOGIN_URL}?erro=${encodeURIComponent(e.message)}`;
            }
        }
        
        async function abrirPlataforma(event) {
            event.preventDefault();
            
            const btnEnter = document.getElementById('btnEnter');
            const status = document.getElementById('status');
            
            btnEnter.textContent = '⏳ Carregando plataforma...';
            btnEnter.disabled = true;
            status.textContent = 'Buscando conteúdo...';
            
            try {
                const sessao = localStorage.getItem('olho_de_deus_usuario');
                const usuario = JSON.parse(sessao);
                
                // Busca o HTML do Drive via Worker
                const response = await fetch(`${WORKER_URL}/proxy/central`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'servirHTML',
                        arquivoId: '16hKYZNJvXkWfk3FrW0gPXWMz0XSx_bFH'
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Servidor retornou status ' + response.status);
                }
                
                const html = await response.text();
                
                if (html.includes('<!DOCTYPE') || html.includes('<html')) {
                    status.textContent = 'Plataforma carregada!';
                    
                    // 🔥 CORREÇÃO: Usar iframe em vez de document.write
                    // Cria um iframe em tela cheia
                    const iframe = document.createElement('iframe');
                    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;';
                    iframe.srcdoc = html;
                    
                    // Remove o container original
                    document.getElementById('container').style.display = 'none';
                    
                    // Adiciona o iframe
                    document.body.appendChild(iframe);
                    
                    // Listener para mensagens do iframe
                    window.addEventListener('message', function(event) {
                        if (event.data === 'fechar-plataforma') {
                            iframe.remove();
                            document.getElementById('container').style.display = '';
                        }
                        if (event.data === 'voltar-login') {
                            window.location.href = LOGIN_URL;
                        }
                    });
                } else {
                    throw new Error('Conteúdo inválido retornado');
                }
                
            } catch (e) {
                btnEnter.textContent = '▶ Entrar no Olho De Deus';
                btnEnter.disabled = false;
                alert('Erro ao carregar plataforma: ' + e.message);
            }
        }
        
        carregar();
    </script>
</body>
</html>
