<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ALMAFLUXO · Curso</title>
<style>
:root{color-scheme:dark;--bg:#030508;--card:#0a1d3a;--bd:#27c8ff;--tx:#eaf6ff;--mut:#9fb6d4;--ok:#5be39a;--er:#ff8a8a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,sans-serif;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0}
.mut{color:var(--mut);font-size:15px}
.card{background:var(--card);border:1px solid #1d4a73;border-radius:14px;padding:14px;margin:12px 0}
button,input{font:inherit;color:var(--tx)}
button{background:#0d2a52;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
button:active,button.on{background:#1f7bff}
button:disabled{opacity:.45}
input{width:100%;background:#06122c;border:1px solid #1d4a73;border-radius:10px;padding:12px;margin:6px 0}
.hide{display:none}
#st{min-height:22px;font-size:15px}
.ok{color:var(--ok)}.er{color:var(--er)}
#app{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
#lista{display:flex;flex-direction:column;gap:8px}
#lista button{text-align:left}
#lista small{display:block;color:var(--mut)}
#mod{width:100%;height:600px;border:1px solid #1d4a73;border-radius:14px;background:#050b18}
@media(max-width:760px){#app{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>ALMAFLUXO · Curso</h1>
<div class="mut" id="sub">Conectando…</div>

<div id="login" class="card hide">
  <div>Entre na sua conta ALMAFLUXO para acessar o curso.</div>
  <input id="em" type="email" autocomplete="username" placeholder="E-mail">
  <input id="sn" type="password" autocomplete="current-password" placeholder="Senha">
  <button id="bEntrar" type="button" style="width:100%">Entrar</button>
  <div class="mut" style="margin-top:8px">Ainda não tem cadastro? Crie a sua conta no <a href="/" style="color:#7fd6ff">ALMAFLUXO</a> e volte aqui.</div>
</div>

<div id="app" class="hide">
  <nav id="lista" aria-label="Módulos"></nav>
  <section><iframe id="mod" sandbox="allow-scripts" title="Módulo do curso"></iframe></section>
</div>
<div id="st" class="mut" role="status"></div>

<!-- Estilo do módulo (fica dentro do quadro isolado) -->
<style id="runtime-css" type="text/plain">
:root{color-scheme:dark;--card:#0a1d3a;--bd:#27c8ff;--tx:#eaf6ff;--mut:#9fb6d4;--ok:#5be39a;--er:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#050b18;color:var(--tx);font:17px/1.5 system-ui,sans-serif}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 6px;font-size:18px}
.mut{color:var(--mut);font-size:15px}
.frase{font-size:19px;border-left:4px solid var(--bd);padding:6px 12px;margin:10px 0;background:#0a1d3a88;border-radius:0 10px 10px 0}
.card{background:var(--card);border:1px solid #1d4a73;border-radius:14px;padding:14px;margin:12px 0}
.barra{height:10px;background:#06122c;border:1px solid #1d4a73;border-radius:999px;overflow:hidden;margin:8px 0}
.barra i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
button{font:inherit;color:var(--tx);background:#0d2a52;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
button.on{background:#1f7bff}
.feito{display:flex;gap:10px;align-items:center;margin-top:10px;cursor:pointer}
.feito input{width:24px;height:24px}
ol,ul{margin:6px 0 6px 20px;padding:0}
pre{background:#06122c;border:1px solid #1d4a73;border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:14px/1.45 ui-monospace,Consolas,monospace;margin:8px 0}
.rot{font-weight:700;color:var(--bd);margin-top:10px}
.bad{color:var(--er)}
.cena{position:relative;width:100%;height:420px;border:1px solid #1d4a73;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#10204a 0%,#070d24 48%,#02040c 100%)}
.cena canvas{display:block;width:100%;height:100%;touch-action:none}
.botoes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.aviso{background:#3a2a0a;border:1px solid #ffd17a;color:#ffd17a;border-radius:10px;padding:10px;margin:10px 0}
</style>

<!-- Executor dos módulos: roda DENTRO do quadro isolado (sandbox), sem acesso à sua conta -->
<script id="runtime-src" type="text/plain">
(function () {
  'use strict';
  var raiz = document.getElementById('raiz');
  var D = null, PROG = {}, barra = null, rotuloProg = null, caixas = [];

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function enviar(o) { o.af = 'curso'; parent.postMessage(o, '*'); }
  function altura() { enviar({ tipo: 'altura', h: document.documentElement.scrollHeight + 8 }); }

  /* ───────── Ligação com o Flow (assíncrona, via página do curso) ─────────
     Cada peça do guia vira um bloco do Flow. O Flow devolve o estado de cada peça:
     fora (não está no Flow) · configurando · pronta · pendente (faltam campos). */
  var FLOW = { on: false, t: 0, nos: {}, rotulo: null, mapa: null }, VIS = null, TIMER_FLOW = null;
  var KINDS = { github: 'GitHub', worker: 'Cloudflare Worker', apps: 'Apps Script', drive: 'Google Drive', streamlit: 'Servidor / Streamlit', html: 'Página HTML' };
  var ROT = { fora: 'ainda não está no Flow', configurando: 'no Flow, aguardando sua configuração', pronta: 'configurada no Flow', pendente: 'no Flow, faltam campos obrigatórios' };
  var REGRAS = [['github', /github|reposit/], ['apps', /apps? ?script|google script/], ['worker', /worker|cloudflare|proxy/], ['drive', /drive|pasta/], ['streamlit', /streamlit|python|servidor|porta/], ['html', /html|p[aá]gina|site|navegador/]];
  function tipoFlow(n) {
    if (n.flow && KINDS[n.flow.kind]) return n.flow.kind;
    var textos = [((n.id || '') + ' ' + (n.nome || '')).toLowerCase(), String(n.info || '').toLowerCase()];
    for (var k = 0; k < textos.length; k++) for (var i = 0; i < REGRAS.length; i++) if (REGRAS[i][1].test(textos[k])) return REGRAS[i][0];
    return 'html';
  }
  function limites(mapa) {
    var xs = [], ys = [];
    (mapa.nos || []).forEach(function (n) { var p = n.pos || [0, 0, 0]; xs.push(p[0]); ys.push(-p[1] + p[2] * 0.3); });
    return { x0: Math.min.apply(null, xs), x1: Math.max.apply(null, xs), y0: Math.min.apply(null, ys), y1: Math.max.apply(null, ys) };
  }
  function pacoteNo(n, kind, lim) {
    var p = n.pos || [0, 0, 0], f = (n.flow && n.flow.fields) || {};
    var sx = (lim.x1 - lim.x0) || 1, sy = (lim.y1 - lim.y0) || 1;
    return { ref: n.id, kind: kind, title: n.nome || n.id, fields: f, notes: (n.info || '') + (n.precisa ? '\nVocê precisa: ' + n.precisa : ''),
      x: Math.round(140 + (p[0] - lim.x0) / sx * 820), y: Math.round(140 + ((-p[1] + p[2] * 0.3) - lim.y0) / sy * 340) };
  }
  function pedirFlow(mapa, ids, kindUnico, focar) {
    var set = {}; ids.forEach(function (i) { set[i] = 1; });
    var lim = limites(mapa);
    var nos = (mapa.nos || []).filter(function (n) { return set[n.id]; }).map(function (n) { return pacoteNo(n, kindUnico && ids.length === 1 ? kindUnico : tipoFlow(n), lim); });
    var lig = (mapa.ligacoes || []).filter(function (l) { return set[l[0]] || set[l[1]]; });
    enviar({ tipo: 'flow', acao: 'aplicar', modulo: D && D.titulo || '', nos: nos, ligacoes: lig, focar: focar || '' });
  }
  function atualizarRotulo(extra) {
    if (!FLOW.rotulo) return;
    var n = 0, p = 0; ((FLOW.mapa && FLOW.mapa.nos) || []).forEach(function (x) { var e = FLOW.nos[x.id]; if (e) { n++; if (e === 'pronta') p++; } });
    FLOW.rotulo.textContent = (FLOW.on ? 'Flow conectado' : 'Flow desconectado (abra o Flow para configurar)') + (n ? ' · ' + p + ' de ' + n + ' peças desta lista configuradas' : '') + (n && p === ((FLOW.mapa && FLOW.mapa.nos) || []).length ? ' · seu universo está aceso' : '') + (extra ? ' · ' + extra : '');
  }
  function receberFlow(d) {
    FLOW.on = !!d.conectado; FLOW.t = Date.now(); FLOW.nos = d.nos && typeof d.nos === 'object' ? d.nos : {};
    if (VIS && VIS.estado) VIS.estado(FLOW.nos);
    atualizarRotulo(typeof d.msg === 'string' ? d.msg.slice(0, 120) : '');
  }
  function barraFlow(host, painel, mapa) {
    FLOW.mapa = mapa;
    var b = el('div', 'card'); b.style.margin = '10px 0 0';
    b.appendChild(el('h3', null, 'Ligar ao Flow'));
    FLOW.rotulo = el('div', 'mut'); b.appendChild(FLOW.rotulo);
    var bt = el('div', 'botoes');
    var a = el('button', null, 'Montar todas as peças no Flow');
    a.addEventListener('click', function () { pedirFlow(mapa, (mapa.nos || []).map(function (n) { return n.id; }), null, ''); enviar({ tipo: 'flow', acao: 'abrir' }); });
    var o = el('button', null, 'Abrir o Flow');
    o.addEventListener('click', function () { enviar({ tipo: 'flow', acao: 'abrir' }); });
    bt.appendChild(a); bt.appendChild(o); b.appendChild(bt);
    host.insertBefore(b, painel);
    atualizarRotulo();
    enviar({ tipo: 'flow', acao: 'ping' });
    if (!TIMER_FLOW) TIMER_FLOW = setInterval(function () {
      enviar({ tipo: 'flow', acao: 'ping' });
      if (FLOW.on && Date.now() - FLOW.t > 15000) { FLOW.on = false; atualizarRotulo(); }
    }, 6000);
  }
  function acoesNo(painel, no, mapa) {
    var est = FLOW.nos[no.id] || 'fora';
    var info = el('div', 'mut', 'No Flow: ' + ROT[est]); info.style.margin = '8px 0 4px'; painel.appendChild(info);
    var linha = el('div', 'botoes');
    var sel = document.createElement('select'); sel.setAttribute('aria-label', 'Tipo de bloco no Flow');
    sel.style.cssText = 'background:#06122c;color:#eaf6ff;border:1px solid #1d4a73;border-radius:8px;padding:8px;font:inherit';
    Object.keys(KINDS).forEach(function (k) { var op = document.createElement('option'); op.value = k; op.textContent = KINDS[k]; sel.appendChild(op); });
    sel.value = tipoFlow(no); linha.appendChild(sel);
    var b = el('button', null, est === 'fora' ? 'Configurar esta peça no Flow' : 'Abrir esta peça no Flow');
    b.addEventListener('click', function () { pedirFlow(mapa, [no.id], sel.value, no.id); enviar({ tipo: 'flow', acao: 'abrir' }); });
    linha.appendChild(b); painel.appendChild(linha);
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.af === 'curso' && d.tipo === 'init') { PROG = d.progresso || {}; marcar(); }
    else if (d && d.af === 'curso' && d.tipo === 'flow-estado' && e.source === parent) receberFlow(d);
  });

  function marcar() {
    var feitos = 0;
    caixas.forEach(function (c, i) { c.checked = !!PROG[i]; if (c.checked) feitos++; });
    if (barra) barra.style.width = (caixas.length ? Math.round(feitos * 100 / caixas.length) : 0) + '%';
    if (rotuloProg) rotuloProg.textContent = feitos + ' de ' + caixas.length + ' passos feitos';
  }

  function lista(tag, itens) {
    var l = el(tag);
    (itens || []).forEach(function (t) { l.appendChild(el('li', null, t)); });
    return l;
  }

  function render() {
    raiz.textContent = '';
    raiz.appendChild(el('h2', null, D.titulo || 'Módulo'));
    if (D.emConstrucao) raiz.appendChild(el('div', 'aviso', 'Módulo em construção: o esqueleto já está aqui; o conteúdo completo entra na próxima versão.'));
    if (D.frase) raiz.appendChild(el('div', 'frase', '“' + D.frase + '”'));
    if (D.trajeto) { var tj = el('div', 'card'); tj.appendChild(el('h3', null, 'O trajeto')); tj.appendChild(el('div', null, D.trajeto)); raiz.appendChild(tj); }
    if (D.mapa) { var cm = el('div', 'card'); cm.appendChild(el('h3', null, D.mapa.titulo || 'Guia interativo')); cm.appendChild(el('div', 'mut', 'Este é o seu universo. Arraste para girar e entrar nele; toque numa estrela para ver o que ela é e acendê-la no Flow.')); cena(cm, D.mapa); raiz.appendChild(cm); }
    if (D.loki || window.AF_MODULO === '3') raiz.appendChild(lokiCena(D.loki || JSON.parse(JSON.stringify(LOKI_PADRAO))));

    var pr = el('div', 'card');
    rotuloProg = el('div', 'mut');
    var b = el('div', 'barra'); barra = el('i'); b.appendChild(barra);
    pr.appendChild(rotuloProg); pr.appendChild(b); raiz.appendChild(pr);

    caixas = [];
    (D.passos || []).forEach(function (p, i) {
      var c = el('div', 'card');
      c.appendChild(el('h3', null, (i + 1) + '. ' + (p.titulo || 'Passo')));
      if (p.porque) { c.appendChild(el('div', 'rot', 'Por quê')); c.appendChild(el('div', null, p.porque)); }
      if (p.fazer && p.fazer.length) { c.appendChild(el('div', 'rot', 'Faça')); c.appendChild(lista('ol', p.fazer)); }
      if (p.codigo) { c.appendChild(el('div', 'rot', p.rotuloCodigo || 'Código')); c.appendChild(bloco(p.codigo)); }
      if (p.testar) { c.appendChild(el('div', 'rot', 'Teste')); c.appendChild(el('div', null, p.testar)); }
      if (p.erros && p.erros.length) {
        c.appendChild(el('div', 'rot bad', 'Se der erro'));
        var ul = el('ul');
        p.erros.forEach(function (x) { var li = el('li'); li.appendChild(el('b', null, x.sintoma + ': ')); li.appendChild(document.createTextNode(x.causa)); ul.appendChild(li); });
        c.appendChild(ul);
      }
      if (p.prompt) { c.appendChild(el('div', 'rot', 'Prompt pronto (copie, troque o que está entre [colchetes] e cole na IA)')); c.appendChild(bloco(p.prompt)); }
      var lab = el('label', 'feito'), cx = el('input'); cx.type = 'checkbox';
      cx.addEventListener('change', function () { PROG[i] = cx.checked; marcar(); enviar({ tipo: 'progresso', passo: i, feito: cx.checked }); });
      lab.appendChild(cx); lab.appendChild(el('span', null, 'Fiz e o teste passou'));
      c.appendChild(lab); caixas.push(cx); raiz.appendChild(c);
    });
    marcar();
    if (D.proximo) { var pm = el('div', 'card'); pm.appendChild(el('h3', null, 'Próximo')); pm.appendChild(el('div', null, D.proximo)); raiz.appendChild(pm); }
    altura();
  }

  function bloco(texto) {
    var w = el('div');
    w.appendChild(el('pre', null, texto));
    var bt = el('button', null, 'Copiar');
    bt.addEventListener('click', function () { enviar({ tipo: 'copiar', texto: texto }); bt.textContent = 'Copiado!'; setTimeout(function () { bt.textContent = 'Copiar'; }, 1500); });
    w.appendChild(bt);
    return w;
  }

  /* ───────── Guia interativo: simulação de um pedido percorrendo as peças ───────── */
  // Descobre até onde o "pacote" chega. onde = "no" (falha na peça) ou "a>b" (falha no caminho entre duas peças).
  function percurso(mapa, falha) {
    var rota = mapa.rota || [];
    if (!falha) return { nos: rota.slice(), parou: null };
    var onde = String(falha.onde || '');
    if (onde.indexOf('>') > 0) {
      var a = onde.split('>')[0], i = rota.indexOf(a);
      return { nos: i >= 0 ? rota.slice(0, i + 1) : rota.slice(0, 1), parou: onde, entre: true };
    }
    var j = rota.indexOf(onde);
    return { nos: j >= 0 ? rota.slice(0, j + 1) : rota.slice(0, 1), parou: onde, entre: false };
  }

  function cena(host, mapa) {
    var painel = el('div', 'card'); painel.style.margin = '10px 0 0';
    var botoes = el('div', 'botoes');
    var area = el('div', 'cena');
    var nomeNo = {};
    (mapa.nos || []).forEach(function (n) { nomeNo[n.id] = n; });
    host.appendChild(area); host.appendChild(botoes); host.appendChild(painel);

    function escrever(titulo, linhas) {
      painel.textContent = '';
      painel.appendChild(el('h3', null, titulo));
      (linhas || []).forEach(function (l) { if (!l) return; var d = el('div'); var b = el('b', null, l[0] + ' '); d.appendChild(b); d.appendChild(document.createTextNode(l[1])); d.style.margin = '4px 0'; painel.appendChild(d); });
    }
    escrever('Pronto', [['', 'Escolha “Tudo funcionando” ou um defeito para ver o que acontece com o pedido.']]);

    var vis = montar3D(area, mapa, nomeNo, function (no) {
      escrever(no.nome, [['O que é:', no.info || ''], ['Você precisa:', no.precisa || '']]);
      acoesNo(painel, no, mapa);
    });
    VIS = vis; barraFlow(host, painel, mapa);

    function tocar(falha, btn) {
      Array.prototype.forEach.call(botoes.children, function (x) { x.classList.remove('on'); });
      btn.classList.add('on');
      var pc = percurso(mapa, falha);
      if (vis) vis.animar(pc, !!falha);
      var caminho = pc.nos.map(function (n) { return nomeNo[n] ? nomeNo[n].nome : n; }).join(' → ');
      if (!falha) {
        escrever('Tudo funcionando', [!vis ? ['Caminho:', caminho + (pc.nos.length ? ' → e de volta' : '')] : null, ['', 'O pedido saiu da página, passou por cada peça e voltou com a resposta (200).']]);
        return;
      }
      var onde = pc.entre ? 'no caminho ' + falha.onde.replace('>', ' → ') : (nomeNo[falha.onde] ? nomeNo[falha.onde].nome : falha.onde);
      escrever(falha.nome, [
        !vis ? ['Caminho:', caminho + '  ✗ parou ' + onde] : null,
        ['Parou em:', onde], ['Você vê:', falha.sintoma], ['Causa:', falha.causa], ['Conserto:', falha.conserto]
      ]);
    }
    var b0 = el('button', null, 'Tudo funcionando'); b0.addEventListener('click', function () { tocar(null, b0); }); botoes.appendChild(b0);
    (mapa.falhas || []).forEach(function (f) { var b = el('button', null, f.nome); b.addEventListener('click', function () { tocar(f, b); }); botoes.appendChild(b); });
    if (!vis) area.appendChild(el('div', 'mut', 'O 3D não está disponível neste aparelho. O guia continua funcionando em texto, logo abaixo.'));
    if (!vis) area.style.height = 'auto', area.style.padding = '12px';
  }

  /* ───────── Linhas do tempo (estilo Loki) · módulo 3 ─────────
     4 argolas (peças) e várias linhas de luz (rotas). Onde a linha se parte, a comunicação quebrou.
     Dados em D.loki = { titulo, aneis:[{id,nome,cor}], linhas:[{id,nome,cor,rota,estado:'ok'|'erro'|'obsoleta',explica,erro:{trecho,sintoma,causa,conserto,prompt}}] } */
  var LOKI_PADRAO = {
    titulo: 'As linhas do tempo do seu sistema',
    aneis: [{ id: 'pagina', nome: 'Página', cor: '#27c8ff' }, { id: 'worker', nome: 'Worker', cor: '#b36bff' }, { id: 'apps', nome: 'Apps Script', cor: '#f5b942' }, { id: 'drive', nome: 'Drive', cor: '#5be39a' }],
    linhas: [
      { id: 'ler', nome: 'Ler dados', cor: '#27c8ff', rota: ['pagina', 'worker', 'apps', 'drive'], estado: 'ok', explica: 'O caminho saudável: o pedido sai da página, passa pelo Worker, o Apps Script abre o Drive e a resposta volta pelo mesmo caminho.' },
      { id: 'login', nome: 'Login', cor: '#ff7ad9', rota: ['pagina', 'worker', 'apps'], estado: 'erro',
        erro: { trecho: 'pagina>worker', sintoma: 'No console do navegador: "blocked by CORS policy".', causa: 'O Worker não devolveu a permissão (cabeçalho CORS) para o endereço da sua página, então o navegador bloqueou a resposta.', conserto: 'No Worker, responda ao pedido OPTIONS e devolva Access-Control-Allow-Origin com o endereço da sua página.',
          prompt: 'Minha página chama meu Worker da Cloudflare e o console mostra "blocked by CORS policy". Me mostre como responder ao OPTIONS e devolver os cabeçalhos CORS no Worker, e explique cada linha de forma simples.' } },
      { id: 'rota', nome: 'Rota nova', cor: '#f5b942', rota: ['pagina', 'worker', 'apps', 'drive'], estado: 'erro',
        erro: { trecho: 'pagina>worker', sintoma: 'A resposta é {"ok":false,"error":"Rota não encontrada."}.', causa: 'Você criou a rota no código novo, mas o Worker que está no ar ainda é a versão antiga, sem essa rota.', conserto: 'Cole o código novo no Worker e clique em Implantar. Depois teste de novo.',
          prompt: 'Meu Worker responde "Rota não encontrada" para /api/minharota, mas a rota existe no código que escrevi. Quais são as causas mais comuns (implantação, caminho, método) e como eu confiro cada uma?' } },
      { id: 'salvar', nome: 'Salvar', cor: '#5be39a', rota: ['pagina', 'worker', 'apps', 'drive'], estado: 'erro',
        erro: { trecho: 'worker>apps', sintoma: 'O Worker devolve erro 404 ou uma página HTML em vez de dados.', causa: 'A implantação do Apps Script foi refeita e o endereço (/exec) mudou; o Worker continua chamando o endereço antigo.', conserto: 'Copie o endereço da implantação atual do Apps Script e atualize a variável do Worker.',

      gal[i * 3] = Math.cos(ang) * rr; gal[i * 3 + 1] = (Math.random() - 0.5) * 0.6 * (1 - t * 0.5); gal[i * 3 + 2] = Math.sin(ang) * rr;
      cm.copy(cA).lerp(cB, t); galC[i * 3] = cm.r; galC[i * 3 + 1] = cm.g; galC[i * 3 + 2] = cm.b;
    }
    var gGeo = new T.BufferGeometry(); gGeo.setAttribute('position', new T.BufferAttribute(gal, 3)); gGeo.setAttribute('color', new T.BufferAttribute(galC, 3));
    g.add(new T.Points(gGeo, new T.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, sizeAttenuation: true })));
    var nucleo = glow(0x7fd6ff, 5.5, 0.5); g.add(nucleo);
    var centro = glow(0xffffff, 1.6, 0.85); g.add(centro);

    // As peças: estrelas com halo e anel
    lista.forEach(function (n) {
      var cor = new T.Color(n.cor || '#27c8ff'); cores[n.id] = cor;
      var m = new T.Mesh(new T.SphereGeometry(0.5, 28, 28), new T.MeshStandardMaterial({ color: cor, emissive: cor, emissiveIntensity: 0.55, roughness: 0.4, metalness: 0.1 }));
      m.position.copy(pos[n.id]); m.userData.id = n.id; g.add(m); malhas.push(m);
      var h = glow(cor, 3.2, 0.7); h.position.copy(pos[n.id]); h.userData.base = 3.2; g.add(h); halos[n.id] = h;
      var anel = new T.Mesh(new T.RingGeometry(0.85, 0.9, 48), new T.MeshBasicMaterial({ color: cor, transparent: true, opacity: 0.35, side: T.DoubleSide, depthWrite: false }));
      anel.position.copy(pos[n.id]); anel.rotation.x = Math.PI / 2.3; g.add(anel);
      var r = rotulo(n.nome); r.position.set(pos[n.id].x, pos[n.id].y + 1.15, pos[n.id].z); g.add(r);
    });
    // As ligações: arcos de luz, com pulsos que correm por elas quando o Flow está conectado
    (mapa.ligacoes || []).forEach(function (l) {
      if (!pos[l[0]] || !pos[l[1]]) return;
      var A = pos[l[0]], B = pos[l[1]], meio = A.clone().add(B).multiplyScalar(0.5), dist = A.distanceTo(B);
      meio.y += 0.5 + dist * 0.12;
      var curva = new T.QuadraticBezierCurve3(A.clone(), meio, B.clone()); curvas[l[0] + '>' + l[1]] = curva;
      var ln = new T.Line(new T.BufferGeometry().setFromPoints(curva.getPoints(36)), new T.LineBasicMaterial({ color: 0x3a8fd0, transparent: true, opacity: 0.8 })); g.add(ln);
      var pm = glow(0x7fd6ff, 0.55, 0.95); pm.visible = false; g.add(pm);
      linhas.push({ ln: ln, a: l[0], b: l[1] }); pulsos.push({ m: pm, c: curva, ia: l[0], ib: l[1], k: pulsos.length });
    });
    function trecho(a, b) {
      var c = curvas[a + '>' + b], inv = false;
      if (!c) { c = curvas[b + '>' + a]; inv = true; }
      if (!c) return [pos[a].clone(), pos[b].clone()];
      var p = c.getPoints(14); return inv ? p.reverse() : p;
    }
    var pacote = new T.Mesh(new T.SphereGeometry(0.2, 16, 16), new T.MeshBasicMaterial({ color: 0x5be39a }));
    pacote.visible = false; g.add(pacote);
    var anim = null;

    function animar(pc, comFalha) {
      aplicarEstado();
      var ids = pc.nos.filter(function (id) { return pos[id]; });
      if (!ids.length) return;
      var pts = [];
      ids.forEach(function (id, i) { if (i === 0) pts.push(pos[id].clone()); else pts = pts.concat(trecho(ids[i - 1], id).slice(1)); });
      var falhou = !!comFalha, destinoFalha = null;
      if (falhou && pc.entre) {
        var prox = nextAfter(pc), ultimo = pts[pts.length - 1];
        destinoFalha = prox ? ultimo.clone().lerp(prox, 0.5) : ultimo.clone();
        pts.push(destinoFalha);
      } else if (!falhou) {
        pts = pts.concat(pts.slice(0, -1).reverse());
      }
      pacote.material.color.set(0x5be39a); pacote.visible = true; pacote.position.copy(pts[0]);
      anim = { pts: pts, seg: 0, t: 0, falhou: falhou, pc: pc };
    }
    function nextAfter(pc) { var rota = mapa.rota || [], i = rota.indexOf(pc.nos[pc.nos.length - 1]); return rota[i + 1] ? pos[rota[i + 1]] : null; }

    var COR_EST = { configurando: 0xf5b942, pronta: 0x5be39a, pendente: 0xff8a5a };
    function aplicarEstado() {
      malhas.forEach(function (m) {
        var id = m.userData.id, c = COR_EST[est[id]], h = halos[id];
        if (c != null) { m.material.color.setHex(c); m.material.emissive.setHex(c); h.material.color.setHex(c); }
        else { m.material.color.copy(cores[id]); m.material.emissive.copy(cores[id]); h.material.color.copy(cores[id]); }
        h.userData.base = est[id] === 'pronta' ? 4.4 : (est[id] ? 3.7 : 3.2);
      });
      linhas.forEach(function (l) { l.ln.material.color.setHex(est[l.a] && est[l.b] ? 0x5be39a : 0x3a8fd0); });
    }
    function definirEstado(nos) { est = nos || {}; aplicarEstado(); }

    var arrastando = false, mexeu = 0, ux = 0, uy = 0, ultimoToque = 0, ray = new T.Raycaster(), pt = new T.Vector2();
    function quadro() {
      var agora = Date.now();
      pulsos.forEach(function (p) {
        var ligado = FLOW.on && (est[p.ia] || est[p.ib]); p.m.visible = !!ligado;
        if (!ligado) return;
        p.m.position.copy(p.c.getPoint(((agora / 1700) + p.k * 0.23) % 1));
        p.m.material.color.setHex(est[p.ia] === 'pronta' && est[p.ib] === 'pronta' ? 0x5be39a : 0xf5b942);
      });
      if (!calmo) {
        var i = 0;
        Object.keys(halos).forEach(function (id) { var h = halos[id], s = h.userData.base * (1 + 0.07 * Math.sin(agora / 700 + (i++) * 1.7)); h.scale.set(s, s, 1); });
        var sn = 5.5 * (1 + 0.05 * Math.sin(agora / 1100)); nucleo.scale.set(sn, sn, 1);
        estrelasLonge.rotation.y += 0.0002; estrelasPerto.rotation.y -= 0.0003;
        if (!arrastando && agora - ultimoToque > 2500) g.rotation.y += 0.0012;
      }
      if (anim) {
        var a = anim;
        if (a.seg < a.pts.length - 1) {
          var d = a.pts[a.seg].distanceTo(a.pts[a.seg + 1]) || 0.01;
          a.t += 0.07 / d;
          pacote.position.copy(a.pts[a.seg]).lerp(a.pts[a.seg + 1], Math.min(a.t, 1));
          if (a.t >= 1) { a.t = 0; a.seg++; }
        } else if (a.falhou && !a.marcado) {
          a.marcado = true; pacote.material.color.set(0xff5a5a);
          if (!a.pc.entre) malhas.forEach(function (m) { if (m.userData.id === a.pc.parou) { m.material.color.set(0xff5a5a); m.material.emissive.set(0xff3030); halos[m.userData.id].material.color.set(0xff5a5a); } });
        }
      }
      renderer.render(sc, cam);
      requestAnimationFrame(quadro);
    }
    quadro();

    var cv = renderer.domElement;
    cv.addEventListener('pointerdown', function (e) { arrastando = true; mexeu = 0; ux = e.clientX; uy = e.clientY; ultimoToque = Date.now(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
    cv.addEventListener('pointermove', function (e) {
      if (!arrastando) return;
      var dx = e.clientX - ux, dy = e.clientY - uy; ux = e.clientX; uy = e.clientY; mexeu += Math.abs(dx) + Math.abs(dy); ultimoToque = Date.now();
      g.rotation.y += dx * 0.01; g.rotation.x = Math.max(-1, Math.min(1, g.rotation.x + dy * 0.005));
    });
    cv.addEventListener('pointerup', function (e) {
      arrastando = false; ultimoToque = Date.now();
      if (mexeu > 6) return;
      var r = cv.getBoundingClientRect();
      pt.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(pt, cam);
      var hit = ray.intersectObjects(malhas)[0];
      if (hit && nomeNo[hit.object.userData.id]) aoTocar(nomeNo[hit.object.userData.id]);
    });
    window.addEventListener('resize', function () { var w = area.clientWidth || W; renderer.setSize(w, H); cam.aspect = w / H; cam.updateProjectionMatrix(); });
    return { animar: animar, estado: definirEstado };
  }

  window.AFCurso = {
    percurso: percurso,
    modulo: function (d) { D = d || {}; render(); enviar({ tipo: 'pronto' }); }
  };
})();
</script>

<script>
(function () {
  'use strict';
  var API = '/proxy/curso';
  var $ = function (id) { return document.getElementById(id); };
  var usuario = null, indice = null, atual = null, prog = {};

  function msg(t, cls) { var e = $('st'); e.textContent = t || ''; e.className = cls || 'mut'; }
  function post(url, c) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(c) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'Resposta inválida.' }; }); })
      .catch(function () { return { ok: false, error: 'Sem conexão.' }; });
  }
  function lerUsuario() {
    try { var u = JSON.parse(localStorage.getItem('almafluxo_usuario') || 'null'); return u && u.email && u.sessionToken ? u : null; } catch (e) { return null; }
  }
  function chaveProg() { return 'af_curso_prog_' + (usuario ? usuario.email : ''); }
  function lerProg() { try { return JSON.parse(localStorage.getItem(chaveProg()) || '{}') || {}; } catch (e) { return {}; } }
  function salvarProg() { try { localStorage.setItem(chaveProg(), JSON.stringify(prog)); } catch (e) {} }

  function mostrarLogin(t) {
    $('login').classList.remove('hide'); $('app').classList.add('hide');
    $('sub').textContent = t || 'Faça login para continuar.';
  }

  function iniciar() {
    usuario = lerUsuario();
    if (!usuario) { mostrarLogin(); return; }
    prog = lerProg();
    $('sub').textContent = 'Carregando o curso…';
    post(API, { action: 'indice', email: usuario.email, sessionToken: usuario.sessionToken }).then(function (r) {
      if (r.ok && r.indice) {
        indice = r.indice;
        $('login').classList.add('hide'); $('app').classList.remove('hide');
        $('sub').textContent = (indice.curso || 'Curso') + ' · ' + usuario.email;
        desenharLista();
        var ult = null; try { ult = localStorage.getItem('af_curso_ultimo_' + usuario.email); } catch (e) {}
        var ids = (indice.modulos || []).map(function (m) { return m.id; });
        abrir(ids.indexOf(ult) >= 0 ? ult : ids[0]);
        msg('');
      } else if (r.precisaLogin) {
        try { localStorage.removeItem('almafluxo_usuario'); } catch (e) {}
        mostrarLogin('Sua sessão expirou. Entre de novo.');
      } else {
        $('sub').textContent = r.error || 'Não foi possível carregar o curso.';
      }
    });
  }

  function desenharLista() {
    var nav = $('lista'); nav.replaceChildren();
    (indice.modulos || []).forEach(function (m) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.id = m.id;
      var feitos = 0, mp = prog[m.id] || {}; Object.keys(mp).forEach(function (k) { if (mp[k]) feitos++; });
      b.textContent = 'Módulo ' + m.id + ' · ' + m.titulo + (feitos ? '  (' + feitos + ' ✓)' : '');
      if (m.resumo) { var s = document.createElement('small'); s.textContent = m.resumo; b.appendChild(s); }
      if (m.id === atual) b.classList.add('on');
      b.addEventListener('click', function () { abrir(m.id); });
      nav.appendChild(b);
    });
  }

  function montarDoc(codigo, idMod) {
    var seguro = String(codigo).replace(/<\/script/gi, '<\\/script');
    return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' +
      $('runtime-css').textContent + '</style></head><body><div id="raiz">Carregando…</div>' +
      '<script>window.AF_MODULO=' + JSON.stringify(String(idMod || '')) + ';<\/script>' +
      '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>' +
      '<script>' + $('runtime-src').textContent + '<\/script>' +
      '<script>' + seguro + '<\/script></body></html>';
  }

  function abrir(id) {
    if (!id || !usuario) return;
    atual = id; desenharLista();
    try { localStorage.setItem('af_curso_ultimo_' + usuario.email, id); } catch (e) {}
    msg('Abrindo o módulo…');
    post(API, { action: 'modulo', id: id, email: usuario.email, sessionToken: usuario.sessionToken }).then(function (r) {
      if (r.ok && typeof r.codigo === 'string') {
        var f = $('mod'); f.style.height = '600px';
        f.srcdoc = montarDoc(r.codigo, id);
        msg('');
      } else if (r.precisaLogin) {
        try { localStorage.removeItem('almafluxo_usuario'); } catch (e) {}
        mostrarLogin('Sua sessão expirou. Entre de novo.');
      } else {
        msg(r.error || 'Não foi possível abrir o módulo.', 'er');
      }
    });
  }

  /* ───────── Ponte curso ⇄ Flow (assíncrona) ─────────
     Ao vivo: BroadcastChannel (mesma origem). Reserva: localStorage (fila de pedidos e último estado).
     O módulo roda isolado; só esta página conversa com o Flow. */
  var KFILA = 'ALMAFLUXO_FLOW_CURSO', KEST = 'ALMAFLUXO_FLOW_CURSO_ESTADO', FLOW_URL = '/flow', CANAL = null;
  var KINDS_OK = { github: 1, worker: 1, apps: 1, drive: 1, streamlit: 1, html: 1 };
  function paraMod(o) { var f = $('mod'); try { f.contentWindow.postMessage(Object.assign({ af: 'curso', tipo: 'flow-estado' }, o), '*'); } catch (x) {} }
  function estadoSalvo() { try { var s = JSON.parse(localStorage.getItem(KEST) || 'null'); return s && s.nos && typeof s.nos === 'object' ? s.nos : null; } catch (x) { return null; } }
  function limpar(s, n) { return String(s == null ? '' : s).slice(0, n); }
  try {
    CANAL = new BroadcastChannel('almafluxo-flow-curso');
    CANAL.onmessage = function (e) {
      var m = e.data; if (!m || m.v !== 1) return;
      if (m.tipo === 'flow:estado' || m.tipo === 'flow:pong' || m.tipo === 'flow:aplicado') paraMod({ nos: m.nos || {}, conectado: true, msg: m.resumo || '' });
    };
  } catch (x) { CANAL = null; }
  addEventListener('storage', function (e) { if (e.key === KEST) { var s = estadoSalvo(); if (s) paraMod({ nos: s, conectado: true }); } });
  function sanitizar(d) {
    var nos = (Array.isArray(d.nos) ? d.nos : []).slice(0, 40).map(function (n) {
      var f = {}; if (n && n.fields && typeof n.fields === 'object') Object.keys(n.fields).slice(0, 8).forEach(function (k) { f[limpar(k, 30)] = limpar(n.fields[k], 200); });
      return { ref: limpar(n && n.ref, 60), kind: n && KINDS_OK[n.kind] ? n.kind : 'html', title: limpar(n && n.title, 80), fields: f, notes: limpar(n && n.notes, 500), x: Number(n && n.x) || 0, y: Number(n && n.y) || 0 };
    }).filter(function (n) { return n.ref; });
    var lig = (Array.isArray(d.ligacoes) ? d.ligacoes : []).slice(0, 80).filter(function (l) { return Array.isArray(l) && l.length >= 2; }).map(function (l) { return [limpar(l[0], 60), limpar(l[1], 60)]; });
    return { v: 1, tipo: 'curso:aplicar', id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), modulo: limpar(d.modulo, 80), focar: limpar(d.focar, 60), nos: nos, ligacoes: lig };
  }
  function ponteFlow(d) {
    if (d.acao === 'abrir') {
      var w = null; try { w = window.open(FLOW_URL, 'almafluxo_flow'); } catch (x) {}
      if (!w) msg('Seu navegador bloqueou a nova aba. Abra ' + location.origin + FLOW_URL + ' e volte aqui.', 'er');
    } else if (d.acao === 'ping') {
      if (CANAL) CANAL.postMessage({ v: 1, tipo: 'curso:ping' });
      var s = estadoSalvo(); if (s) paraMod({ nos: s, conectado: false });
    } else if (d.acao === 'aplicar') {
      var m = sanitizar(d); if (!m.nos.length) return;
      try { localStorage.setItem(KFILA, JSON.stringify(m)); } catch (x) {}
      if (CANAL) CANAL.postMessage(m);
      msg('Peça enviada ao Flow.'); setTimeout(function () { msg(''); }, 2500);
    }
  }

  addEventListener('message', function (e) {
    var f = $('mod');
    if (!f || e.source !== f.contentWindow) return;
    var d = e.data;
    if (!d || d.af !== 'curso') return;
    if (d.tipo === 'altura') {
      var h = Math.max(320, Math.min(Number(d.h) || 0, 20000));
      f.style.height = h + 'px';
    } else if (d.tipo === 'pronto') {
      f.contentWindow.postMessage({ af: 'curso', tipo: 'init', progresso: prog[atual] || {} }, '*');
    } else if (d.tipo === 'progresso') {
      prog[atual] = prog[atual] || {};
      prog[atual][Number(d.passo)] = !!d.feito;
      salvarProg(); desenharLista();
    } else if (d.tipo === 'flow') {
      ponteFlow(d);
    } else if (d.tipo === 'copiar' && typeof d.texto === 'string') {
      var t = d.texto.slice(0, 8000);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function () {});
      else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); }
    }
  });

  $('bEntrar').onclick = function () {
    var email = $('em').value.trim().toLowerCase(), senha = $('sn').value;
    if (!/^\S+@\S+\.\S+$/.test(email) || !senha) { msg('Digite e-mail e senha.', 'er'); return; }
    $('bEntrar').disabled = true; msg('Entrando…');
    post('/proxy/central', { action: 'login', email: email, senha: senha }).then(function (d) {
      $('bEntrar').disabled = false;
      var u = d.usuario || d, tok = d.token || d.sessionToken || u.sessionToken;
      if (!(d.ok || d.success || tok) || !tok) { msg(d.error || d.message || 'Login não aceito.', 'er'); return; }
      try { localStorage.setItem('almafluxo_usuario', JSON.stringify({ nome: u.nome || email.split('@')[0], email: email, balance: u.balance != null ? u.balance : (u.saldo != null ? u.saldo : 0), sessionToken: tok })); } catch (e) {}
      $('sn').value = ''; msg(''); iniciar();
    });
  };

  iniciar();
})();
</script>
