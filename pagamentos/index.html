<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMAFLUXO — Pagamentos</title>
    <style>
        :root {
            --bg: #0a0a0f; --gold: #d4a843;
            --text: #e0e0e0; --text-secondary: #a0a0b0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .loading-container { text-align: center; padding: 40px; }
        .logo {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, var(--gold), #f0d078);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px; margin-bottom: 20px;
        }
        .spinner {
            width: 48px; height: 48px; border: 3px solid rgba(212,168,67,0.2);
            border-top-color: var(--gold); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Container inline (igual ao atendimento.html) */
        #drivePageContainer {
            position: fixed; inset: 0; z-index: 5000; background: #0a0a0a;
            display: none; flex-direction: column;
        }
        #drivePageContainer.active { display: flex; }
        #driveInlineWrapper {
            flex: 1; overflow-y: auto; background: #0a0a0a;
            width: 100%; height: 100%; display: flex;
            align-items: flex-start; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }
        #driveInlineContent {
            width: 100%; max-width: 680px; margin: 0 auto;
            background: transparent; position: relative; color: #ece8f8;
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div class="logo">ALMAFLUXO</div>
        <div class="spinner"></div>
        <p style="color:#a0a0b0">Carregando sistema de pagamentos...</p>
    </div>

    <!-- Container inline (igual ao atendimento.html) -->
    <div class="drive-page-container" id="drivePageContainer">
        <div id="driveInlineWrapper">
            <div id="driveInlineContent"></div>
        </div>
    </div>

    <script>
        // "central" existe no SCRIPT_MAP do worker — "pagamentos" não existe, por isso caía no fallback.
        const PROXY_CLOUDFLARE = 'https://almafluxo.uk/proxy/central';
        let carregado = false;

        async function carregarPagamentosHTML() {
            if (carregado) return;
            
            try {
                console.log('📄 Buscando pagamentos.html via proxy...');
                
                const response = await fetch(PROXY_CLOUDFLARE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'pagamentos' })
                });
                
                // O Central_gs.js devolve HTML puro (ContentService.MimeType.HTML) para esta ação,
                // não um objeto { status, html }. O worker reencaminha o corpo como veio.
                const html = await response.text();
                console.log('📄 Tamanho recebido:', html.length);
                
                if (response.ok && html && html.length > 100 && !html.trim().startsWith('{')) {
                    carregado = true;
                    renderizarHTML(html);
                } else {
                    throw new Error('HTML não encontrado — resposta: ' + html.substring(0, 200));
                }
                
            } catch (e) {
                console.error('❌ Erro:', e.message);
                document.getElementById('loadingContainer').innerHTML = `
                    <div class="logo">ALMAFLUXO</div>
                    <p style="color:#e74c3c">Não foi possível carregar.</p>
                    <button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;background:#d4a843;color:#1a1a1a;border:none;border-radius:10px;font-weight:600;cursor:pointer">🔄 Tentar novamente</button>
                `;
            }
        }

        function renderizarHTML(htmlContent) {
            const loading = document.getElementById('loadingContainer');
            const container = document.getElementById('drivePageContainer');
            const inlineDiv = document.getElementById('driveInlineContent');
            
            loading.style.display = 'none';
            container.classList.add('active');
            
            // Limpa o HTML
            let htmlLimpo = htmlContent
                .replace(/\\"/g, '"')
                .replace(/\\'/g, "'")
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '')
                .replace(/\\t/g, '');
            
            // Insere o HTML
            inlineDiv.innerHTML = htmlLimpo;
            
            // Reexecuta scripts
            const scripts = inlineDiv.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                newScript.textContent = script.textContent;
                script.remove();
                document.body.appendChild(newScript);
                setTimeout(() => { if (newScript.parentNode) newScript.remove(); }, 100);
            });
            
            console.log('✅ Página de pagamentos renderizada!');
        }

        carregarPagamentosHTML();
    </script>
</body>
</html>
