<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/pagamentos">
    <title>Redirecionando...</title>
    <style>
        body { 
            background: #0a0a0f; 
            color: #d4a843; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            font-family: system-ui;
            flex-direction: column;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212,168,67,0.2);
            border-top-color: #d4a843;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div style="font-size: 1.5rem; font-weight: 700;">ALMAFLUXO</div>
    <div style="color: #a0a0b0; margin-top: 8px;">Carregando sistema de pagamentos...</div>
    <script>
        // Fallback caso o meta refresh não funcione
        setTimeout(() => {
            window.location.href = '/pagamentos';
        }, 100);
    </script>
</body>
</html>
