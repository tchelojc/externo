<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ALMAFLUXO - Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            color: #d4a843; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #12121a;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(212,168,67,0.2);
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #d4a843, #f0d078);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212,168,67,0.2);
            border-top-color: #d4a843;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .log-area {
            background: #0a0a0f;
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: #a0a0b0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #1a1a2e;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a2e;
            font-family: 'Courier New', monospace;
        }
        .log-entry .time {
            color: #666;
            margin-right: 10px;
        }
        .log-entry .ok { color: #2ecc71; }
        .log-entry .error { color: #e74c3c; }
        .log-entry .info { color: #3498db; }
        .log-entry .warn { color: #f39c12; }
        
        .status-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }
        .status-box.loading { background: rgba(52,152,219,0.1); color: #3498db; border: 1px solid rgba(52,152,219,0.2); }
        .status-box.success { background: rgba(46,204,113,0.1); color: #2ecc71; border: 1px solid rgba(46,204,113,0.2); }
        .status-box.error { background: rgba(231,76,60,0.1); color: #e74c3c; border: 1px solid rgba(231,76,60,0.2); }
        .status-box.redirect { background: rgba(212,168,67,0.1); color: #d4a843; border: 1px solid rgba(212,168,67,0.2); }
        
        .btn {
            padding: 10px 20px;
            background: #d4a843;
            color: #0a0a0f;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn:hover { background: #c8963e; }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .btn-danger:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">✦ ALMAFLUXO</div>
        <div class="spinner" id="spinner"></div>
        
        <div class="status-box loading" id="statusBox">
            ⏳ Inicializando...
        </div>
        
        <div class="log-area" id="logArea">
            <div class="log-entry"><span class="time">[INIT]</span> <span class="info">📄 Página carregada</span></div>
        </div>
        
        <button class="btn" id="btnRedirecionar" onclick="forcarRedirecionamento()">
            🔄 Forçar Redirecionamento para /pagamentos
        </button>
        <button class="btn btn-danger" id="btnParar" onclick="pararLoop()" style="display:none;">
            🛑 PARAR LOOP (Forçar Parada)
        </button>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // CONFIGURAÇÃO DE DEBUG
        // ═══════════════════════════════════════════════════════════
        let tentativas = 0;
        const MAX_TENTATIVAS = 3;
        let loopAtivo = true;
        let timeoutId = null;

        // ═══════════════════════════════════════════════════════════
        // LOGS
        // ═══════════════════════════════════════════════════════════
        function adicionarLog(mensagem, tipo = 'info') {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            const classe = tipo === 'ok' ? 'ok' : tipo === 'error' ? 'error' : tipo === 'warn' ? 'warn' : 'info';
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="${classe}">${mensagem}</span>`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function atualizarStatus(mensagem, tipo = 'loading') {
            const box = document.getElementById('statusBox');
            box.textContent = mensagem;
            box.className = `status-box ${tipo}`;
        }

        // ═══════════════════════════════════════════════════════════
        // DETECTAR LOOP
        // ═══════════════════════════════════════════════════════════
        function detectarLoop() {
            tentativas++;
            adicionarLog(`🔄 Tentativa #${tentativas} de redirecionamento`, 'warn');
            
            if (tentativas > MAX_TENTATIVAS) {
                adicionarLog(`🚨 LOOP DETECTADO! ${tentativas} tentativas consecutivas`, 'error');
                atualizarStatus(`🚨 LOOP DETECTADO! ${tentativas} tentativas`, 'error');
                document.getElementById('btnParar').style.display = 'block';
                document.getElementById('spinner').style.display = 'none';
                return true;
            }
            return false;
        }

        // ═══════════════════════════════════════════════════════════
        // REDIRECIONAMENTO CONTROLADO
        // ═══════════════════════════════════════════════════════════
        function redirecionarPara(destino) {
            if (!loopAtivo) {
                adicionarLog('🛑 Loop desativado manualmente. Nenhum redirecionamento será feito.', 'error');
                return;
            }

            if (detectarLoop()) {
                return;
            }

            adicionarLog(`➡️ Redirecionando para: ${destino}`, 'ok');
            atualizarStatus(`🔄 Redirecionando para ${destino}...`, 'redirect');
            
            // Mostra a URL atual e destino
            adicionarLog(`📍 URL atual: ${window.location.href}`, 'info');
            adicionarLog(`🎯 Destino: ${destino}`, 'info');
            
            // Executa o redirecionamento
            try {
                window.location.href = destino;
            } catch (e) {
                adicionarLog(`❌ Erro ao redirecionar: ${e.message}`, 'error');
                atualizarStatus(`❌ Erro: ${e.message}`, 'error');
            }
        }

        // ═══════════════════════════════════════════════════════════
        // FORÇAR REDIRECIONAMENTO (Botão)
        // ═══════════════════════════════════════════════════════════
        function forcarRedirecionamento() {
            adicionarLog('👆 Usuário clicou em "Forçar Redirecionamento"', 'info');
            tentativas = 0; // Reset contador
            redirecionarPara('/pagamentos');
        }

        // ═══════════════════════════════════════════════════════════
        // PARAR LOOP (Botão de Emergência)
        // ═══════════════════════════════════════════════════════════
        function pararLoop() {
            loopAtivo = false;
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
            document.getElementById('btnParar').style.display = 'none';
            document.getElementById('spinner').style.display = 'none';
            atualizarStatus('🛑 LOOP PARADO MANUALMENTE', 'error');
            adicionarLog('🛑 Loop interrompido pelo usuário', 'error');
            adicionarLog('💡 Clique em "Forçar Redirecionamento" para tentar novamente', 'info');
        }

        // ═══════════════════════════════════════════════════════════
        // TESTAR ACESSO AO /pagamentos (Diagnóstico)
        // ═══════════════════════════════════════════════════════════
        async function testarAcessoPagamentos() {
            try {
                adicionarLog('🔍 Testando acesso a /pagamentos...', 'info');
                const response = await fetch('/pagamentos', { 
                    method: 'HEAD',
                    signal: AbortSignal.timeout(5000)
                });
                
                if (response.ok) {
                    adicionarLog(`✅ /pagamentos respondeu com status ${response.status}`, 'ok');
                    return true;
                } else {
                    adicionarLog(`⚠️ /pagamentos respondeu com status ${response.status}`, 'warn');
                    return false;
                }
            } catch (e) {
                adicionarLog(`❌ /pagamentos INACESSÍVEL: ${e.message}`, 'error');
                return false;
            }
        }

        // ═══════════════════════════════════════════════════════════
        // INICIALIZAÇÃO
        // ═══════════════════════════════════════════════════════════
        async function init() {
            adicionarLog('🚀 Inicializando página de debug', 'info');
            adicionarLog(`📍 URL atual: ${window.location.href}`, 'info');
            adicionarLog(`📋 Protocolo: ${window.location.protocol}`, 'info');
            adicionarLog(`🏠 Host: ${window.location.host}`, 'info');
            adicionarLog(`📂 Path: ${window.location.pathname}`, 'info');
            
            // Verifica se já está em /pagamentos
            if (window.location.pathname === '/pagamentos' || window.location.pathname === '/pagamentos/') {
                adicionarLog('✅ JÁ ESTAMOS EM /pagamentos! Não precisa redirecionar.', 'ok');
                atualizarStatus('✅ Já estamos na página de pagamentos', 'success');
                document.getElementById('spinner').style.display = 'none';
                return;
            }

            // Testa se /pagamentos está acessível
            const acessivel = await testarAcessoPagamentos();
            
            if (acessivel) {
                adicionarLog('✅ /pagamentos está acessível. Redirecionando...', 'ok');
                atualizarStatus('🔄 Redirecionando para pagamentos...', 'redirect');
                
                // Aguarda 1 segundo para o usuário ver os logs
                setTimeout(() => {
                    redirecionarPara('/pagamentos');
                }, 1000);
            } else {
                adicionarLog('⚠️ /pagamentos NÃO está acessível diretamente.', 'warn');
                adicionarLog('💡 Tentando redirecionamento via fallback...', 'info');
                atualizarStatus('⚠️ Tentando redirecionamento...', 'loading');
                
                // Tenta redirecionar mesmo assim
                setTimeout(() => {
                    redirecionarPara('/pagamentos');
                }, 1500);
            }
        }

        // ═══════════════════════════════════════════════════════════
        // INICIAR
        // ═══════════════════════════════════════════════════════════
        // Previne execução múltipla
        if (!window._debugInit) {
            window._debugInit = true;
            
            // Adiciona logs iniciais
            adicionarLog('📦 Versão: 1.0.0 (Debug)', 'info');
            adicionarLog(`🔄 Tentativas: ${tentativas}/${MAX_TENTATIVAS}`, 'info');
            
            // Inicia após 500ms para garantir que tudo foi carregado
            setTimeout(init, 500);
        } else {
            adicionarLog('⚠️ Página já inicializada anteriormente', 'warn');
        }

        // ═══════════════════════════════════════════════════════════
        // EXPOR FUNÇÕES PARA O CONSOLE (Debug)
        // ═══════════════════════════════════════════════════════════
        window.debug = {
            adicionarLog,
            atualizarStatus,
            forcarRedirecionamento,
            pararLoop,
            testarAcessoPagamentos,
            tentativas: () => tentativas,
            loopAtivo: () => loopAtivo,
            url: window.location.href
        };

        console.log('🔍 ALMAFLUXO DEBUG ATIVO!');
        console.log('📋 Use window.debug para inspecionar:');
        console.log('  - debug.tentativas()');
        console.log('  - debug.loopAtivo()');
        console.log('  - debug.url');
        console.log('  - debug.forcarRedirecionamento()');
        console.log('  - debug.pararLoop()');
        console.log('  - debug.testarAcessoPagamentos()');
    </script>
</body>
</html>
