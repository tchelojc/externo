<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMAFLUXO — Pagamentos</title>
    <style>
        :root { --bg: #0a0a0f; --gold: #d4a843; --text: #e0e0e0; --text-secondary: #a0a0b0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
        }
        .loading-container {
            text-align: center; padding: 40px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .logo {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, var(--gold), #f0d078);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px; margin-bottom: 20px;
        }
        .spinner {
            width: 48px; height: 48px; border: 3px solid rgba(212,168,67,0.2);
            border-top-color: var(--gold); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-retry {
            margin-top: 16px; padding: 12px 24px; background: #d4a843; color: #1a1a1a;
            border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem;
        }
        .detalhe { margin-top: 12px; color: #6f6f80; font-size: .75rem; max-width: 420px; word-break: break-word; }

        /* Container inline (mesmo padrão do atendimento.html) */
        #drivePageContainer {
            position: fixed; inset: 0; z-index: 5000; background: #0a0a0a;
            display: none; flex-direction: column;
        }
        #drivePageContainer.active { display: flex; }
        #driveInlineWrapper {
            flex: 1; overflow-y: auto; background: #0a0a0a;
            width: 100%; height: 100%; display: flex;
            align-items: flex-start; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }
        #driveInlineContent {
            width: 100%; max-width: 680px; margin: 0 auto;
            background: transparent; position: relative; color: #ece8f8;
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div class="logo">ALMAFLUXO</div>
        <div class="spinner"></div>
        <p style="color:#a0a0b0" id="loadingMsg">Carregando sistema de pagamentos...</p>
    </div>

    <div class="drive-page-container" id="drivePageContainer">
        <div id="driveInlineWrapper">
            <div id="driveInlineContent"></div>
        </div>
    </div>

    <script>
        // O Central devolve o HTML puro da página de pagamentos (arquivo do Drive) para a ação "pagamentos".
        const PROXY_CLOUDFLARE = 'https://almafluxo.uk/proxy/central';
        let carregado = false;

        function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function buscarHTML() {
            let ultimoErro = null;
            for (let tentativa = 1; tentativa <= 2; tentativa++) {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), 25000);
                try {
                    const response = await fetch(PROXY_CLOUDFLARE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'pagamentos' }),
                        signal: ctl.signal
                    });
                    const html = await response.text();
                    clearTimeout(t);
                    if (response.ok && html && html.length > 100 && !html.trim().startsWith('{')) return html;
                    ultimoErro = new Error('Resposta inesperada (' + response.status + '): ' + html.substring(0, 160));
                } catch (e) {
                    clearTimeout(t);
                    ultimoErro = e.name === 'AbortError' ? new Error('Tempo esgotado ao buscar a página.') : e;
                }
                if (tentativa < 2) { document.getElementById('loadingMsg').textContent = 'Tentando novamente...'; await esperar(1200); }
            }
            throw ultimoErro;
        }

        // Só "desescapa" se o servidor tiver mandado o HTML como texto escapado (não é o caso normal).
        function normalizar(html) {
            if (/^\s*<(!doctype|html|head|body|div|style|meta)/i.test(html)) return html;
            return html.replace(/\\"/g, '"').replace(/\\'/g, "'").replace(/\\n/g, '\n').replace(/\\r/g, '').replace(/\\t/g, '');
        }

        function carregarScriptExterno(origem) {
            return new Promise(resolve => {
                const s = document.createElement('script');
                for (const a of origem.attributes) s.setAttribute(a.name, a.value);
                const assincrono = origem.hasAttribute('async') || origem.hasAttribute('defer');
                s.onload = () => resolve(true);
                s.onerror = () => { console.warn('Falha ao carregar script:', origem.src); resolve(false); };
                document.head.appendChild(s);
                if (assincrono) resolve(true);   // não trava a página esperando (ex.: Google Sign-In)
            });
        }

        async function renderizarHTML(htmlBruto) {
            const doc = new DOMParser().parseFromString(normalizar(htmlBruto), 'text/html');
            const inline = document.getElementById('driveInlineContent');

            // 1) estilos e links de estilo do <head> da página carregada
            doc.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => document.head.appendChild(n.cloneNode(true)));
            if (doc.title) document.title = doc.title;

            // 2) scripts em ordem original (head + body), removidos do conteúdo
            const scripts = Array.from(doc.querySelectorAll('script'));
            scripts.forEach(s => s.remove());
            inline.innerHTML = doc.body.innerHTML;

            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('drivePageContainer').classList.add('active');

            // 3) executa: externos (aguarda, exceto async/defer) e inline, nesta ordem
            for (const s of scripts) {
                if (s.src) {
                    await carregarScriptExterno(s);
                } else {
                    const n = document.createElement('script');
                    n.textContent = s.textContent;
                    document.body.appendChild(n);
                    n.remove();
                }
            }

            // 4) a página original usa DOMContentLoaded, que aqui já passou: dispara manualmente
            document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true, cancelable: true }));
            console.log('✅ Página de pagamentos renderizada.');
        }

        function mostrarErro(e) {
            document.getElementById('loadingContainer').innerHTML =
                '<div class="logo">ALMAFLUXO</div>' +
                '<p style="color:#e74c3c">Não foi possível carregar a página de pagamentos.</p>' +
                '<button class="btn-retry" onclick="location.reload()">🔄 Tentar novamente</button>' +
                '<div class="detalhe"></div>';
            document.querySelector('#loadingContainer .detalhe').textContent = e && e.message ? e.message : String(e);
        }

        async function iniciar() {
            if (carregado) return;
            try {
                const html = await buscarHTML();
                carregado = true;
                await renderizarHTML(html);
            } catch (e) {
                console.error('❌ Erro:', e);
                if (!carregado) mostrarErro(e);
            }
        }
        iniciar();
    </script>
</body>
</html>
