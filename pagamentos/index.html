<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMAFLUXO — Pagamentos</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --gold: #d4a843;
            --gold-light: #f0d078;
            --text: #e0e0e0;
            --text-secondary: #a0a0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(212,168,67,0.08) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 100%, rgba(108,92,231,0.05) 0%, transparent 60%);
        }

        .loading-container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(212,168,67,0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Container para o conteúdo inline */
        #pagamentosContent {
            width: 100%;
            min-height: 100vh;
            display: none;
        }

        #pagamentosContent.active {
            display: block;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .error-container.show {
            display: block;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .error-text {
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .retry-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--gold), #c8963e);
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .retry-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(212,168,67,0.3);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--gold);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 2000;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-container" id="loadingContainer">
        <div class="logo">ALMAFLUXO</div>
        <div class="spinner"></div>
        <div class="loading-text">Carregando sistema de pagamentos...</div>
    </div>

    <!-- Container do conteúdo inline -->
    <div id="pagamentosContent"></div>

    <!-- Erro -->
    <div class="error-container" id="errorContainer">
        <div class="error-icon">⚠️</div>
        <div class="error-text" id="errorText">Não foi possível carregar a página de pagamentos.</div>
        <button class="retry-btn" onclick="recarregarPagina()">🔄 Tentar novamente</button>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════
        // CONFIGURAÇÃO
        // ═══════════════════════════════════════════════════════
        
        // 🔥 Sessão persistente (igual ao atendimento.html)
        let sessionId = localStorage.getItem('almafluxo_session_id');
        if (!sessionId) {
            sessionId = "user_" + Date.now();
            localStorage.setItem('almafluxo_session_id', sessionId);
        }

        // 🔥 Proxy Cloudflare para buscar o HTML do Drive
        const PROXY_CLOUDFLARE = "https://almafluxo.uk/proxy/r5fit";
        
        // 🔥 Central da Economia ALMA
        const CENTRAL_URL = "https://almafluxo.uk/economy";
        
        // ═══════════════════════════════════════════════════════
        // INICIALIZAÇÃO
        // ═══════════════════════════════════════════════════════
        
        document.addEventListener('DOMContentLoaded', () => {
            carregarPagamentosHTML();
        });

        async function carregarPagamentosHTML() {
            const loading = document.getElementById('loadingContainer');
            const content = document.getElementById('pagamentosContent');
            const error = document.getElementById('errorContainer');

            loading.style.display = 'block';
            content.classList.remove('active');
            error.classList.remove('show');

            try {
                console.log('📄 Buscando pagamentos.html do Google Drive...');
                
                // 🔥 Busca o HTML via Cloudflare Worker (que busca do Drive)
                const response = await fetch('https://almafluxo.uk/pagamentos/', {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/html',
                        'User-Agent': 'Mozilla/5.0'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const contentType = response.headers.get('Content-Type') || '';
                
                if (contentType.includes('text/html')) {
                    const htmlContent = await response.text();
                    
                    // Verifica se o conteúdo é realmente HTML válido
                    if (htmlContent.includes('<!DOCTYPE') || htmlContent.includes('<html') || htmlContent.includes('ALMAFLUXO')) {
                        console.log('✅ HTML recebido com sucesso!', htmlContent.length, 'caracteres');
                        renderizarHTML(htmlContent);
                        return;
                    }
                }

                // Se chegou aqui, tenta fallback direto do Drive
                console.log('⚠️ Tentando fallback direto do Google Drive...');
                await carregarFallbackDrive();

            } catch (e) {
                console.error('❌ Erro ao carregar:', e.message);
                
                // Tenta fallback
                try {
                    await carregarFallbackDrive();
                } catch (e2) {
                    mostrarErro(e.message);
                }
            }
        }

        async function carregarFallbackDrive() {
            const arquivoId = "1CXLScS5zt1DOdGGNo2U1CsLZUMJXtNMV";
            
            // Tenta múltiplas URLs de exportação do Google Drive
            const urls = [
                `https://drive.google.com/uc?export=download&id=${arquivoId}`,
                `https://docs.google.com/uc?export=download&id=${arquivoId}`,
                `https://drive.google.com/file/d/${arquivoId}/view`
            ];

            for (const url of urls) {
                try {
                    console.log('🔄 Tentando:', url);
                    const resp = await fetch(url, {
                        headers: { 'User-Agent': 'Mozilla/5.0' }
                    });
                    
                    if (resp.ok) {
                        const text = await resp.text();
                        if (text.includes('<!DOCTYPE') || text.includes('<html')) {
                            console.log('✅ HTML obtido via fallback!');
                            renderizarHTML(text);
                            return;
                        }
                    }
                } catch (e) {
                    console.log('⚠️ Falha em:', url);
                }
            }

            throw new Error('Não foi possível obter o HTML de nenhuma fonte.');
        }

        function renderizarHTML(htmlContent) {
            const loading = document.getElementById('loadingContainer');
            const content = document.getElementById('pagamentosContent');
            const error = document.getElementById('errorContainer');

            loading.style.display = 'none';
            error.classList.remove('show');

            // 🔥 Limpa o HTML (remove escapes)
            let htmlLimpo = htmlContent
                .replace(/\\"/g, '"')
                .replace(/\\'/g, "'")
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '')
                .replace(/\\t/g, '');

            // 🔥 Se o HTML veio dentro de uma página do Google Drive,
            // extrai apenas o conteúdo relevante
            if (htmlLimpo.includes('drive-viewer') || htmlLimpo.includes('ndfHFb-c4YZDc')) {
                console.log('⚠️ HTML veio dentro do viewer do Google Drive, tentando extrair...');
                // Tenta extrair o conteúdo real
                const match = htmlLimpo.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                if (match) {
                    htmlLimpo = match[1];
                }
            }

            // 🔥 Insere o HTML no container
            content.innerHTML = htmlLimpo;
            content.classList.add('active');
            document.body.style.display = 'block';

            // 🔥 Reexecuta scripts inline
            const scripts = content.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                newScript.textContent = script.textContent
                    .replace(/const API_BASE = .*?;/, `const API_BASE = '${CENTRAL_URL}';`)
                    .replace(/let usuarioLogado = null;/g, '// usuarioLogado já declarado');
                script.remove();
                document.body.appendChild(newScript);
                setTimeout(() => {
                    if (newScript.parentNode) newScript.remove();
                }, 100);
            });

            // 🔥 Dispara evento DOMContentLoaded para inicializar componentes
            setTimeout(() => {
                document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true, cancelable: true }));
            }, 50);

            console.log('✅ Página de pagamentos renderizada com sucesso!');
            mostrarToast('Sistema de pagamentos carregado! 💎');
        }

        function mostrarErro(mensagem) {
            const loading = document.getElementById('loadingContainer');
            const error = document.getElementById('errorContainer');
            
            loading.style.display = 'none';
            error.classList.add('show');
            document.getElementById('errorText').textContent = 
                'Não foi possível carregar a página de pagamentos.\n\nDetalhes: ' + mensagem;
        }

        function recarregarPagina() {
            carregarPagamentosHTML();
        }

        function mostrarToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        console.log('🚀 ALMAFLUXO - Página de Pagamentos iniciada');
        console.log('📋 Session ID:', sessionId);
        console.log('💎 Central URL:', CENTRAL_URL);
    </script>
</body>
</html>
