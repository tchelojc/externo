<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMAFLUXO - Pagamentos</title>
    
    <!-- Redirecionamento imediato para o Cloudflare Worker -->
    <meta http-equiv="refresh" content="0; url=https://almafluxo.uk/economy/comprar">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(212,168,67,0.08) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 100%, rgba(108,92,231,0.05) 0%, transparent 60%);
        }
        
        .container {
            padding: 40px;
            max-width: 500px;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4a843, #f0d078);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(212,168,67,0.2);
            border-top-color: #d4a843;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        p {
            color: #a0a0b0;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #d4a843, #c8963e);
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(212,168,67,0.3);
        }
    </style>
    
    <script>
        // Redirecionamento via JavaScript (fallback caso meta refresh não funcione)
        setTimeout(function() {
            window.location.href = "https://almafluxo.uk/economy/comprar";
        }, 500);
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">ALMAFLUXO</div>
        <div class="loader"></div>
        <p>Redirecionando para a página de pagamentos...</p>
        <p style="font-size: 0.75rem; color: #666;">Economia ALMA — Pagamento & Cadastro</p>
        <a href="https://almafluxo.uk/economy/comprar" class="btn">
            💎 Ir para Pagamentos
        </a>
    </div>
</body>
</html>
