<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍻 Boteco IA | Carregando...</title>
    <style>
        :root {
            --preto: #1a1210;
            --marrom-escuro: #2d1f1a;
            --dourado: #d4a574;
            --dourado-claro: #e8c9a0;
            --creme: #f0e6d8;
            --cinza: #8a7a6a;
            --vermelho: #cc0000;
            --verde: #2d7a3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1210 0%, #2d1f1a 50%, #1a1210 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            color: var(--creme);
            max-width: 480px;
            width: 100%;
            background: linear-gradient(180deg, #2d1f1a 0%, #1a1210 100%);
            border: 3px solid var(--dourado);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(212, 165, 116, 0.4), inset 0 0 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(212, 165, 116, 0.2);
            border-top-color: var(--dourado);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dourado);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--dourado-claro);
            margin-bottom: 25px;
        }

        .btn-enter {
            display: inline-block;
            padding: 14px 30px;
            background: var(--dourado);
            color: #1a1210;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-enter:hover {
            box-shadow: 0 0 30px rgba(212, 165, 116, 0.4);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="title">🍻 Verificando acesso...</div>
        <div class="subtitle" id="status">Confirmando sua sessão...</div>
        <a href="#" class="btn-enter" id="btnEnter" style="display:none;" onclick="abrirBoteco(event)">▶ Entrar no Boteco IA</a>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // CONFIGURAÇÃO
        // ═══════════════════════════════════════════════════════════
        const WORKER_URL = 'https://almafluxo.uk';
        const ROTA_OBTER_HTML = '/proxy/boteco/interface';
        const LOGIN_URL = 'https://almafluxo.uk/botecoIA';

        async function carregar() {
            const spinner = document.getElementById('spinner');
            const title = document.getElementById('title');
            const status = document.getElementById('status');
            const btnEnter = document.getElementById('btnEnter');

            try {
                // Verifica cookies
                const cookies = document.cookie.split(';').reduce((acc, c) => {
                    const [k, v] = c.trim().split('=');
                    if (k && v) acc[k] = v;
                    return acc;
                }, {});

                const token = cookies.boteco_token || '';
                const email = cookies.boteco_email || '';

                if (!token || !email) {
                    window.location.href = LOGIN_URL;
                    return;
                }

                // Valida sessão chamando a rota do Worker
                status.textContent = 'Validando acesso...';
                const response = await fetch(`${WORKER_URL}${ROTA_OBTER_HTML}`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Sessão inválida');
                }

                // Sessão válida
                spinner.style.display = 'none';
                title.textContent = '🍻 Bem-vindo ao Boteco IA';
                status.textContent = 'Acesso confirmado. Clique para entrar.';
                btnEnter.style.display = 'inline-block';

            } catch (e) {
                window.location.href = `${LOGIN_URL}?erro=${encodeURIComponent(e.message)}`;
            }
        }

        async function abrirBoteco(event) {
            event.preventDefault();
            const btnEnter = document.getElementById('btnEnter');
            const status = document.getElementById('status');

            btnEnter.textContent = '⏳ Carregando boteco...';
            btnEnter.disabled = true;
            status.textContent = 'Buscando conteúdo...';

            try {
                const response = await fetch(`${WORKER_URL}${ROTA_OBTER_HTML}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Servidor retornou status ' + response.status);
                }

                const html = await response.text();

                if (html.includes('<!DOCTYPE') || html.includes('<html')) {
                    status.textContent = 'Boteco carregado!';

                    const iframe = document.createElement('iframe');
                    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;background:#1a1210;';
                    iframe.srcdoc = html;

                    document.getElementById('container').style.display = 'none';
                    document.body.appendChild(iframe);

                    window.addEventListener('message', function(event) {
                        if (event.data === 'voltar-login') {
                            window.location.href = LOGIN_URL;
                        }
                    });
                } else {
                    throw new Error('Conteúdo inválido retornado');
                }

            } catch (e) {
                btnEnter.textContent = '▶ Entrar no Boteco IA';
                btnEnter.disabled = false;
                alert('Erro ao carregar plataforma: ' + e.message);
            }
        }

        carregar();
    </script>
</body>
</html>
