<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍻 Boteco IA | Liberando acesso...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1210;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .container {
            text-align: center;
            color: #d4a574;
            max-width: 480px;
            padding: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #2d1f1a;
            border-top-color: #d4a574;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
        .subtitle { font-size: 0.9rem; color: #8a7a6a; margin-bottom: 20px; }
        .btn-enter {
            display: inline-block;
            padding: 14px 30px;
            background: #d4a574;
            color: #1a1210;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-enter:hover {
            box-shadow: 0 0 30px rgba(212, 165, 116, 0.4);
            transform: scale(1.05);
        }
        .erro-box {
            background: #2d1f1a;
            border: 1px solid #cc0000;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            font-size: 0.88rem;
            color: #f0e6d8;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="title">🍻 Verificando acesso...</div>
        <div class="subtitle" id="status">Confirmando sua sessão...</div>

        <div class="erro-box" id="erroBox">
            <p id="erroMensagem">Não foi possível validar seu acesso.</p>
        </div>

        <a href="#" class="btn-enter" id="btnEnter" style="display:none;" onclick="entrarNoBoteco(event)">
            ▶ Entrar no Boteco IA
        </a>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // CONFIGURAÇÃO
        // ═══════════════════════════════════════════════════════════
        const WORKER_URL = 'https://almafluxo.uk';
        const LOGIN_URL = 'https://tchelojc.github.io/botecoIA/'; // página de login/cadastro

        async function carregar() {
            const spinner = document.getElementById('spinner');
            const title = document.getElementById('title');
            const status = document.getElementById('status');
            const erroBox = document.getElementById('erroBox');
            const btnEnter = document.getElementById('btnEnter');

            try {
                // PASSO 1: Verifica sessão no localStorage
                const email = localStorage.getItem('boteco_email');
                const token = localStorage.getItem('boteco_token_usuario');

                if (!email || !token) {
                    // Sem sessão → redireciona para login/cadastro
                    window.location.href = LOGIN_URL;
                    return;
                }

                // PASSO 2: Valida sessão chamando o Worker
                status.textContent = 'Validando token...';
                const response = await fetch(`${WORKER_URL}/proxy/boteco`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'obterConversaAtiva', 
                        email, 
                        token_usuario: token 
                    })
                });

                const data = await response.json();

                if (data.status === 'error' || (response.status !== 200 && response.status !== 201)) {
                    throw new Error(data.message || 'Token inválido ou expirado');
                }

                // PASSO 3: Acesso validado → mostra botão
                spinner.style.display = 'none';
                title.textContent = '🍻 Acesso liberado!';
                status.textContent = 'Clique no botão para entrar no Boteco IA.';
                erroBox.style.display = 'none';
                btnEnter.style.display = 'inline-block';

            } catch (e) {
                spinner.style.display = 'none';
                title.textContent = '❌ Acesso negado';
                status.textContent = 'Sua sessão expirou ou é inválida.';
                erroBox.style.display = 'block';
                document.getElementById('erroMensagem').textContent = e.message;

                // Limpa a sessão inválida
                localStorage.removeItem('boteco_token_usuario');
                localStorage.removeItem('boteco_email');
                localStorage.removeItem('boteco_usuario');

                // Opcional: redirecionar após alguns segundos
                setTimeout(() => {
                    window.location.href = LOGIN_URL + '?erro=' + encodeURIComponent(e.message);
                }, 3000);
            }
        }

        async function entrarNoBoteco(event) {
            event.preventDefault();

            const btnEnter = document.getElementById('btnEnter');
            const status = document.getElementById('status');

            btnEnter.textContent = '⏳ Abrindo mesa...';
            btnEnter.disabled = true;
            status.textContent = 'Carregando o Boteco IA...';

            // Redireciona para o index.html real (que já está logado via localStorage)
            window.location.href = 'https://tchelojc.github.io/botecoIA/';
        }

        carregar();
    </script>
</body>
</html>
