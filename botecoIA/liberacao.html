<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍻 Boteco IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1210;
            color: #f0e6d8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #2d1f1a;
            border-radius: 20px;
            padding: 40px;
            border: 2px solid #d4a574;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
        }
        .spinner {
            border: 4px solid #4a3a30;
            border-top: 4px solid #d4a574;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .title {
            font-size: 2rem;
            color: #d4a574;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #8a7a6a;
            margin-bottom: 20px;
        }
        .btn-enter {
            display: inline-block;
            padding: 12px 30px;
            background: #d4a574;
            color: #1a1210;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-enter:hover {
            background: #e8c9a0;
            transform: scale(1.05);
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .login-form label {
            font-weight: bold;
            color: #d4a574;
        }
        .login-form input {
            padding: 12px;
            background: #1a1210;
            border: 2px solid #4a3a30;
            border-radius: 8px;
            color: #f0e6d8;
            font-size: 1rem;
        }
        .login-form input:focus {
            outline: none;
            border-color: #d4a574;
        }
        .login-form button {
            padding: 12px;
            background: #d4a574;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            color: #1a1210;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-form button:hover {
            background: #e8c9a0;
        }
        .error-msg {
            color: #e74c3c;
            background: #2d1f1a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e74c3c;
            display: none;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 9999;
            background: #1a1210;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="title">🍻 Boteco IA</div>
        <div class="subtitle" id="status">Verificando acesso...</div>

        <!-- Área de login (oculta por padrão) -->
        <div id="loginSection" style="display: none;">
            <p style="color: #8a7a6a; margin-bottom: 15px;">Faça login para acessar o Boteco.</p>
            <form class="login-form" id="loginForm">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
                <div class="error-msg" id="errorMsg"></div>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <a href="#" class="btn-enter" id="btnEnter" style="display:none;" onclick="abrirBoteco(event)">▶ Entrar no Boteco IA</a>
    </div>

    <script>
        const ROTA_OBTER_HTML = 'https://almafluxo.uk/proxy/boteco/interface';
        const ROTA_LOGIN      = 'https://almafluxo.uk/proxy/boteco';

        const spinner      = document.getElementById('spinner');
        const title        = document.getElementById('title');
        const status       = document.getElementById('status');
        const btnEnter     = document.getElementById('btnEnter');
        const loginSection = document.getElementById('loginSection');
        const loginForm    = document.getElementById('loginForm');
        const errorMsg     = document.getElementById('errorMsg');

        // ── Mostrar formulário de login ──
        function mostrarLogin(mensagemErro) {
            spinner.style.display = 'none';
            title.textContent = '🔒 Login necessário';
            status.textContent = mensagemErro || 'Por favor, faça login.';
            loginSection.style.display = 'block';
            btnEnter.style.display = 'none';
            if (mensagemErro) {
                errorMsg.textContent = mensagemErro;
                errorMsg.style.display = 'block';
            }
        }

        // ── Exibe o HTML do Boteco em iframe fullscreen ──
        function exibirHTML(html) {
            const iframe = document.createElement('iframe');
            iframe.srcdoc = html;
            document.body.innerHTML = '';
            document.body.appendChild(iframe);
        }

        // ── Captura token/email vindos via URL do index.html ──
        // 🔥 CORRIGIDO: este é o ponto que estava faltando.
        // Se o index.html está em outro domínio, o cookie não viaja.
        // A URL viaja. Aqui gravamos os cookies no domínio do Worker (almafluxo.uk),
        // que é o mesmo domínio onde o /proxy/boteco/interface roda.
        function capturarTokenDaURL() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const email = params.get('email');

            if (token && email) {
                // Grava cookies no domínio atual (almafluxo.uk)
                document.cookie = 'boteco_token=' + encodeURIComponent(token) + '; path=/; max-age=43200; SameSite=Lax';
                document.cookie = 'boteco_email=' + encodeURIComponent(email) + '; path=/; max-age=43200; SameSite=Lax';

                // Guarda no localStorage também (reuso)
                try {
                    localStorage.setItem('sessionToken', token);
                    localStorage.setItem('usuarioEmail', email);
                } catch (e) {}

                // Limpa a URL (não deixa token exposto no histórico)
                const urlLimpa = window.location.pathname;
                window.history.replaceState({}, '', urlLimpa);

                return true;
            }
            return false;
        }

        // ── Carrega o HTML do Boteco via Worker ──
        async function carregarBoteco() {
            try {
                const response = await fetch(ROTA_OBTER_HTML, {
                    method: 'GET',
                    credentials: 'include'   // envia cookies (agora do domínio certo)
                });

                const text = await response.text();

                if (response.status === 401) {
                    mostrarLogin('Sessão expirada ou inválida. Faça login novamente.');
                    return;
                }

                // Tenta interpretar como JSON primeiro
                try {
                    const json = JSON.parse(text);
                    if (json.html && (json.html.includes('<!DOCTYPE') || json.html.includes('<html'))) {
                        exibirHTML(json.html);
                        return;
                    } else if (json.error || json.message) {
                        throw new Error(json.error || json.message);
                    }
                } catch (e) {
                    // Se não for JSON, continua com texto puro
                }

                // Verifica se é HTML direto
                if (text.includes('<!DOCTYPE') || text.includes('<html')) {
                    exibirHTML(text);
                } else {
                    throw new Error('Conteúdo inválido retornado');
                }

            } catch (e) {
                mostrarLogin(e.message);
            }
        }

        // ── Fluxo inicial ──
        async function verificarAcesso() {
            // 1. Se veio token via URL (do index.html), grava cookie e recarrega limpo
            const tinhaToken = capturarTokenDaURL();
            if (tinhaToken) {
                spinner.style.display = 'block';
                status.textContent = 'Validando sessão...';
                // Recarrega sem query string — agora o cookie está no domínio certo
                setTimeout(() => { window.location.reload(); }, 100);
                return;
            }

            // 2. Tenta carregar direto (cookie já no domínio almafluxo.uk)
            await carregarBoteco();
        }

        // ── Login na página de liberação (fallback se alguém chegar direto) ──
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();

            if (!email || !senha) {
                errorMsg.textContent = 'Preencha todos os campos.';
                errorMsg.style.display = 'block';
                return;
            }

            const btn = loginForm.querySelector('button');
            btn.disabled = true;
            btn.textContent = '⏳ Entrando...';
            status.textContent = 'Autenticando...';

            try {
                const resp = await fetch(ROTA_LOGIN, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', sistema: 'boteco', email, senha }),
                    credentials: 'include'
                });

                const data = await resp.json();
                const resultado = data.result || data;

                if (resultado.autenticado && resultado.token) {
                    document.cookie = 'boteco_token=' + encodeURIComponent(resultado.token) + '; path=/; max-age=43200; SameSite=Lax';
                    document.cookie = 'boteco_email=' + encodeURIComponent(email) + '; path=/; max-age=43200; SameSite=Lax';
                    try {
                        localStorage.setItem('sessionToken', resultado.token);
                        localStorage.setItem('usuarioEmail', email);
                    } catch (e) {}
                    window.location.reload();
                } else {
                    errorMsg.textContent = resultado.mensagem || 'Falha no login. Verifique suas credenciais.';
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    status.textContent = 'Tente novamente.';
                }
            } catch (err) {
                errorMsg.textContent = 'Erro de conexão: ' + err.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
                status.textContent = 'Erro ao conectar.';
            }
        });

        // ── Inicializar ──
        verificarAcesso();
    </script>
</body>
</html>
