<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍻 Liberado - Boteco IA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1210;
            color: #f0e6d8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(212, 165, 116, 0.2);
            border-top-color: #d4a574;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #e8c9a0; }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Carregando Boteco IA...</p>
    </div>

    <script>
        // URL da rota do Worker que retorna o HTML do boneco.html
        const WORKER_HTML_URL = 'https://almafluxo.uk/api/boteco/boneco-html';

        async function carregarInterface() {
            try {
                const resp = await fetch(WORKER_HTML_URL, {
                    credentials: 'include'  // envia os cookies automaticamente
                });

                if (!resp.ok) {
                    // Se não autenticado, redireciona para o login
                    window.location.href = 'https://almafluxo.uk/botecoIA';
                    return;
                }

                const html = await resp.text();
                // Substitui o conteúdo da página pelo HTML recebido
                document.open();
                document.write(html);
                document.close();
            } catch (erro) {
                document.getElementById('loader').innerHTML = 
                    '<p style="color:red;">Erro ao carregar a interface. <a href="https://almafluxo.uk/botecoIA">Voltar ao login</a></p>';
            }
        }

        carregarInterface();
    </script>
</body>
</html>
