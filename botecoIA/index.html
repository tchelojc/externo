<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍻 Boteco IA - Login</title>
    <style>
        :root {
            --preto: #1a1210;
            --marrom-escuro: #2d1f1a;
            --dourado: #d4a574;
            --dourado-claro: #e8c9a0;
            --vermelho: #cc0000;
            --verde: #2d7a3e;
            --creme: #f0e6d8;
            --cinza: #8a7a6a;
            --border: #5a4435;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1210 0%, #2d1f1a 50%, #1a1210 100%);
            color: var(--creme);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                rgba(74, 58, 48, 0.1) 0px,
                rgba(74, 58, 48, 0.1) 2px,
                transparent 2px,
                transparent 20px
            );
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: linear-gradient(180deg, #2d1f1a 0%, #1a1210 100%);
            border: 3px solid var(--dourado);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 50px rgba(212, 165, 116, 0.4), inset 0 0 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 2.2em;
            color: var(--dourado);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            letter-spacing: 1px;
        }

        .logo p {
            color: var(--dourado-claro);
            font-style: italic;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--dourado);
            font-weight: bold;
            font-size: 0.9em;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #1a1210;
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--creme);
            font-size: 1em;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--dourado);
            box-shadow: 0 0 15px rgba(212, 165, 116, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--dourado);
            color: #1a1210;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--dourado-claro);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 165, 116, 0.5);
        }

        .mensagem {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            min-height: 20px;
        }

        .mensagem.erro { color: var(--vermelho); }
        .mensagem.sucesso { color: var(--verde); }

        .alternar-form {
            text-align: center;
            margin-top: 15px;
        }

        .alternar-form a {
            color: var(--dourado);
            cursor: pointer;
            text-decoration: none;
        }

        .alternar-form a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🍻 Boteco IA</h1>
            <p>Entre para conversar com as máquinas</p>
        </div>

        <!-- Formulário de Login -->
        <div id="formLogin">
            <div class="form-group">
                <label for="emailLogin">E-mail</label>
                <input type="email" id="emailLogin" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" placeholder="Sua senha" onkeydown="if(event.key==='Enter')fazerLogin()" required>
            </div>
            <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
            <div class="alternar-form">
                <a onclick="mostrarCadastro()">Não tem conta? Cadastre-se</a>
            </div>
        </div>

        <!-- Formulário de Cadastro -->
        <div id="formCadastro" style="display:none;">
            <div class="form-group">
                <label for="nomeCadastro">Nome</label>
                <input type="text" id="nomeCadastro" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label for="emailCadastro">E-mail</label>
                <input type="email" id="emailCadastro" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="senhaCadastro">Senha</label>
                <input type="password" id="senhaCadastro" placeholder="Crie uma senha">
            </div>
            <button class="btn-primary" onclick="fazerCadastro()">Criar conta</button>
            <div class="alternar-form">
                <a onclick="mostrarLogin()">Já tenho conta</a>
            </div>
        </div>

        <div class="mensagem" id="mensagem"></div>
    </div>

    <script>
        // A rota do Worker é a única exposta; nada de URLs internas.
        const API_URL = 'https://almafluxo.uk/proxy/boteco';
        // Após login, o Worker valida a sessão e serve a interface (boneco.html).
        const REDIRECT_URL = 'https://almafluxo.uk/botecoIA';

        function mostrarCadastro() {
            document.getElementById('formLogin').style.display = 'none';
            document.getElementById('formCadastro').style.display = 'block';
            limparMensagem();
        }

        function mostrarLogin() {
            document.getElementById('formLogin').style.display = 'block';
            document.getElementById('formCadastro').style.display = 'none';
            limparMensagem();
        }

        function mostrarMensagem(texto, tipo) {
            const el = document.getElementById('mensagem');
            el.textContent = texto;
            el.className = 'mensagem ' + tipo;
        }

        function limparMensagem() {
            document.getElementById('mensagem').textContent = '';
            document.getElementById('mensagem').className = 'mensagem';
        }

        async function fazerLogin() {
            const email = document.getElementById('emailLogin').value.trim().toLowerCase();
            const senha = document.getElementById('senhaLogin').value;

            if (!email || !senha) {
                mostrarMensagem('Preencha e-mail e senha.', 'erro');
                return;
            }

            mostrarMensagem('⏳ Entrando...', '');

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', email, senha })
                });
                const data = await resp.json();

                if (data.result && data.result.autenticado) {
                    // Salva token e e-mail em cookies (HttpOnly não é possível via JS, mas é suficiente)
                    document.cookie = `boteco_token=${data.result.token}; path=/; max-age=43200; SameSite=Lax`;
                    document.cookie = `boteco_email=${email}; path=/; max-age=43200; SameSite=Lax`;

                    mostrarMensagem('✅ Login realizado! Redirecionando...', 'sucesso');
                    setTimeout(() => {
                        window.location.href = REDIRECT_URL;
                    }, 1000);
                } else {
                    const msg = (data.result && data.result.mensagem) || 'Erro no login.';
                    mostrarMensagem('❌ ' + msg, 'erro');
                }
            } catch (erro) {
                mostrarMensagem('⚠️ Erro de conexão. Tente novamente.', 'erro');
            }
        }

        async function fazerCadastro() {
            const nome = document.getElementById('nomeCadastro').value.trim();
            const email = document.getElementById('emailCadastro').value.trim().toLowerCase();
            const senha = document.getElementById('senhaCadastro').value;

            if (!nome || !email || !senha) {
                mostrarMensagem('Preencha todos os campos.', 'erro');
                return;
            }

            if (senha.length < 4) {
                mostrarMensagem('A senha deve ter pelo menos 4 caracteres.', 'erro');
                return;
            }

            mostrarMensagem('⏳ Criando conta...', '');

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'cadastro', nome, email, senha })
                });
                const data = await resp.json();

                if (data.result && data.result.sucesso) {
                    mostrarMensagem('✅ Cadastro criado! Faça login.', 'sucesso');
                    mostrarLogin();
                    document.getElementById('emailLogin').value = email;
                    document.getElementById('senhaLogin').value = senha;
                } else {
                    const msg = (data.result && data.result.mensagem) || 'Erro no cadastro.';
                    mostrarMensagem('❌ ' + msg, 'erro');
                }
            } catch (erro) {
                mostrarMensagem('⚠️ Erro de conexão. Tente novamente.', 'erro');
            }
        }
    </script>
</body>
</html>
