
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03060d">
<title>ALMAFLUXO · Canais</title>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
 background:#03060d;
 color:#eaf6ff;
 font-family:system-ui,Segoe UI,Arial,sans-serif;
}
#app{
 min-height:100vh;
 padding:24px;
 display:grid;
 place-items:center;
}
.box{width:min(900px,100%);margin:auto}
header{text-align:center;margin-bottom:28px}
h1{font-size:clamp(25px,5vw,38px);margin:0 0 8px}
p{color:#b8cbe6;line-height:1.5}
#status{text-align:center;color:#8eb8ed}
#lista{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:14px;
}
.canal{
 padding:20px;
 background:#0a1d3a;
 border:1px solid #164b80;
 border-radius:16px;
}
.canal h2{font-size:20px;margin:0 0 8px}
.canal p{margin:0 0 16px}
.btn{
 display:inline-block;
 font:inherit;
 color:#eaf6ff;
 background:#1f7bff;
 border:1px solid #27c8ff;
 border-radius:12px;
 padding:12px 18px;
 text-decoration:none;
 cursor:pointer;
}
.btn.sec{background:#0a1d3a}
.btn:focus{outline:3px solid #ffd17a}
.acoes{display:flex;gap:10px;flex-wrap:wrap}
iframe{width:100%;aspect-ratio:16/9;border:0;background:#000}
input{
 width:min(420px,100%);
 padding:13px;
 border-radius:10px;
 border:1px solid #27c8ff;
 background:#0a1d3a;
 color:#fff;
 font:inherit;
}
#player{margin-top:20px}
.escondido{display:none!important}
</style>
</head>

<body>
<main id="app">
 <section class="box">
  <header>
   <h1>ALMAFLUXO · Canais</h1>
   <p>Escolha o canal que deseja acessar.</p>
  </header>

  <div id="status">Carregando canais...</div>
  <div id="lista"></div>
  <div id="player"></div>
 </section>
</main>

<script>
(()=> {
'use strict';

const BASE='/conversa/instalacao/';
const URL_JSON=BASE+'distribuicao/canais.json';
const URL_CANAL=BASE+'canal';

const $=id=>document.getElementById(id);
const status=$('status');
const lista=$('lista');
const player=$('player');

let canais=[];

function usuarioLogado(){
 try{
  return !!JSON.parse(
   localStorage.getItem('almafluxo_usuario')||'null'
  );
 }catch(e){
  return false;
 }
}

function limpar(){
 lista.replaceChildren();
 player.replaceChildren();
}

function texto(valor,alternativo=''){
 return typeof valor==='string'&&valor.trim()
  ? valor.trim()
  : alternativo;
}

function criarBotao(nome,url){
 const a=document.createElement('a');
 a.className='btn';
 a.textContent=nome;
 a.href=url;
 return a;
}

function abrirPaginaCanal(ch){
 const id=texto(ch.id);
 if(!id)return;

 location.assign(
  URL_CANAL+'?id='+encodeURIComponent(id)
 );
}

function abrirDestino(ch){
 const destino=texto(ch.url)||texto(ch.rota);

 if(!destino){
  status.textContent='Este canal ainda não possui endereço configurado.';
  return;
 }

 if(ch.login&&!usuarioLogado()){
  location.assign(BASE);
  return;
 }

 let url;

 try{
  url=new URL(destino,location.origin);
 }catch(e){
  status.textContent='Endereço do canal inválido.';
  return;
 }

 if(!['https:','http:'].includes(url.protocol)){
  status.textContent='Protocolo de endereço não permitido.';
  return;
 }

 location.assign(url.href);
}

function youtubeId(valor){
 const v=String(valor||'').trim();

 if(/^[\w-]{6,}$/.test(v))return v;

 try{
  const u=new URL(v);
  if(u.hostname==='youtu.be'){
   return u.pathname.split('/').filter(Boolean)[0]||null;
  }

  if(u.searchParams.get('v'))return u.searchParams.get('v');

  const m=u.pathname.match(/\/(?:embed|shorts)\/([\w-]+)/);
  return m?m[1]:null;
 }catch(e){
  return null;
 }
}

function tocarYoutube(fonte){
 const area=document.createElement('div');
 const idLista=texto(fonte.lista);
 const idVideo=youtubeId(fonte.video);

 let src='';

 if(idLista){
  src='https://www.youtube-nocookie.com/embed/videoseries?list='+
   encodeURIComponent(idLista)+'&autoplay=1';
 }else if(idVideo){
  src='https://www.youtube-nocookie.com/embed/'+
   encodeURIComponent(idVideo)+'?autoplay=1';
 }

 if(!src)return false;

 const iframe=document.createElement('iframe');
 iframe.src=src;
 iframe.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
 iframe.allowFullscreen=true;
 iframe.title='Reprodução do canal YouTube';

 area.appendChild(iframe);
 player.replaceChildren(area);
 return true;
}

function mostrarYoutube(ch){
 const fontes=Array.isArray(ch.fontes)?ch.fontes:[];

 if(fontes.length){
  if(tocarYoutube(fontes[0])){
   status.textContent=ch.nome;
   return;
  }
 }

 const titulo=document.createElement('h2');
 titulo.textContent=ch.nome;

 const explicacao=document.createElement('p');
 explicacao.textContent='Informe um link de vídeo ou playlist do YouTube.';

 const input=document.createElement('input');
 input.placeholder='Cole o link do YouTube';
 input.setAttribute('aria-label','Link do YouTube');

 const botao=document.createElement('button');
 botao.className='btn';
 botao.textContent='Assistir';

 botao.onclick=()=>{
  const valor=input.value.trim();
  const listaId=(()=> {
   try{return new URL(valor).searchParams.get('list')}catch(e){return null}
  })();

  const video=youtubeId(valor);

  if(listaId){
   tocarYoutube({lista:listaId});
  }else if(video){
   tocarYoutube({video});
  }else{
   explicacao.textContent='Link do YouTube inválido.';
  }
 };

 player.replaceChildren(titulo,explicacao,input,botao);
 status.textContent='';
}

function mostrarDetalhe(ch){
 limpar();

 const titulo=document.createElement('h2');
 titulo.textContent=ch.nome;

 const descricao=document.createElement('p');
 descricao.textContent='Acessar '+ch.nome+'.';

 const voltar=criarBotao('Todos os canais',URL_CANAL);
 voltar.className='btn sec';

 const abrir=document.createElement('button');
 abrir.className='btn';
 abrir.textContent='Abrir '+ch.nome;
 abrir.onclick=()=>abrirDestino(ch);

 const acoes=document.createElement('div');
 acoes.className='acoes';
 acoes.append(abrir,voltar);

 player.append(titulo,descricao,acoes);

 if(ch.login&&!usuarioLogado()){
  abrir.disabled=true;
  abrir.textContent='Acesso exige login';
  status.textContent='Entre na sua conta ALMAFLUXO para acessar este canal.';
 }
}


function renderizar(){
 limpar();

 const params=new URLSearchParams(location.search);
 const id=params.get('id');

 if(id){
  const ch=canais.find(x=>String(x.id)===id);

  if(!ch){
   status.textContent='Canal não encontrado.';
   return;
  }

  document.title='ALMAFLUXO · '+texto(ch.nome,'Canal');

  if(ch.login&&!usuarioLogado()){
   status.textContent='Este canal exige uma conta ALMAFLUXO.';
   player.append(
    criarBotao('Entrar / criar conta',BASE)
   );
   return;
  }

  // Canais de acesso direto, incluindo Entrevista.
  if(ch.direto===true){
   abrirDestino(ch);
   return;
  }

  // YouTube possui reprodução própria neste índice.
  if(ch.tipo==='youtube'){
   mostrarYoutube(ch);
   return;
  }

  // Outros tipos permanecem com sua tela de acesso.
  mostrarDetalhe(ch);
  return;
 }

 document.title='ALMAFLUXO · Canais';

 status.textContent=canais.length
  ? canais.length+' canais disponíveis'
  : 'Nenhum canal disponível.';

 canais.forEach(ch=>{
  const card=document.createElement('article');
  card.className='canal';

  const nome=document.createElement('h2');
  nome.textContent=texto(ch.nome,'Canal');

  const tipo=document.createElement('p');

  const descricao=texto(ch.descricao);

  tipo.textContent=descricao||(
   ch.tipo==='video'?'Canal de vídeo':
   ch.tipo==='youtube'?'Canal YouTube':
   ch.tipo==='social'?'Rede social':
   'Canal ALMAFLUXO'
  );

  const destinoDireto=ch.direto===true;

  const botao=criarBotao(
   'Abrir canal',
   destinoDireto
    ? (texto(ch.url)||texto(ch.rota)||'#')
    : URL_CANAL+'?id='+encodeURIComponent(ch.id)
  );

  // O redirecionamento passa pela validação de endereço
  // e pelo controle de login já existente.
  if(destinoDireto){
   botao.addEventListener('click',e=>{
    e.preventDefault();
    abrirDestino(ch);
   });
  }

  card.append(nome,tipo,botao);
  lista.appendChild(card);
 });
}

async function iniciar(){
 try{
  const r=await fetch(URL_JSON,{
   method:'GET',
   cache:'no-store'
  });

  if(!r.ok){
   throw new Error('JSON respondeu HTTP '+r.status);
  }

  const dados=await r.json();

  if(!dados||!Array.isArray(dados.canais)){
   throw new Error('Estrutura canais[] não encontrada no JSON.');
  }

  canais=dados.canais.filter(ch=>
   ch&&typeof ch.id==='string'&&ch.id.trim()
  );

  if(!canais.length){
   throw new Error('Nenhum canal válido encontrado.');
  }

  renderizar();

 }catch(e){
  console.error('[ALMAFLUXO CANAIS]',e);
  status.textContent='Não foi possível carregar os canais: '+e.message;
 }
}

iniciar();

})();
</script>
</body>
</html>
