<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060d">
<title>ALMAFLUXO · Canal</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#03060d;color:#eaf6ff;font-family:system-ui,Segoe UI,Arial,sans-serif}
#c{min-height:100%;height:100%;display:grid;place-items:center;text-align:center;padding:24px}
iframe{width:100%;height:100%;min-height:100%;border:0;background:#000}
.box{width:min(560px,100%)}
h1{margin:0 0 10px;font-size:clamp(22px,4vw,34px)}
p{color:#b8cbe6;line-height:1.5}
a.btn,button.btn{display:inline-block;font:inherit;color:#eaf6ff;background:#1f7bff;border:1px solid #27c8ff;border-radius:12px;padding:14px 22px;margin:8px;text-decoration:none;cursor:pointer}
a.btn:focus,button.btn:focus{outline:3px solid #ffd17a}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid #27c8ff;background:#0a1d3a;color:#fff;width:min(420px,90vw)}
.small{font-size:12px;color:#8298b8;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="c"><div class="box"><p>Carregando canal…</p></div></div>

<script>
'use strict';

/*
  ÍNDICE DO CANAL ALMAFLUXO
  - Não consulta /distribuicao/canais.json no domínio principal, pois essa rota
    está respondendo HTTP 503 no Worker.
  - Tenta a cópia RAW do repositório e, se ela falhar, usa a lista local.
  - A lista local permite abrir os canais mesmo com o JSON indisponível.
*/

const RAW_INSTALACAO =
  'https://raw.githubusercontent.com/tchelojc/externo/alma/conversa/instalacao/';

const PADRAO = {
  espera_conversa_s: 45,
  canais: [
    {id:'conversa',numero:1,nome:'Conversa',tipo:'totem',rota:'/conversa',alias:['/conversa/totem1'],login:false},
    {id:'entrevista',numero:2,nome:'Entrevista',tipo:'video',rota:'/conversa/entrevista',direto:true,login:false},
    {id:'youtube',numero:3,nome:'YouTube',tipo:'youtube',rota:'/conversa/youtube',login:false,fontes:[]},
    {id:'instagram',numero:4,nome:'Instagram',tipo:'externo',rota:'/conversa/instagram',url:'https://www.instagram.com/',login:true},
    {id:'tiktok',numero:5,nome:'TikTok',tipo:'externo',rota:'/conversa/tiktok',url:'https://www.tiktok.com/',login:true},
    {id:'facebook',numero:6,nome:'Facebook',tipo:'externo',rota:'/conversa/facebook',url:'https://www.facebook.com/',login:true},
    {id:'linkedin',numero:7,nome:'LinkedIn',tipo:'externo',rota:'/conversa/linkedin',url:'https://www.linkedin.com/',login:true},
    {id:'twitter',numero:8,nome:'X (Twitter)',tipo:'externo',rota:'/conversa/twitter',url:'https://x.com/',login:true}
  ]
};

const el = document.getElementById('c');

function mostrar(titulo, mensagem, botoes, detalhe) {
  el.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'box';

  const h = document.createElement('h1');
  h.textContent = titulo;
  box.appendChild(h);

  if (mensagem) {
    const p = document.createElement('p');
    p.textContent = mensagem;
    box.appendChild(p);
  }

  (botoes || []).forEach(item => {
    if (item.href) {
      const a = document.createElement('a');
      a.className = 'btn';
      a.href = item.href;
      a.textContent = item.texto;
      box.appendChild(a);
    } else {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = item.texto;
      b.addEventListener('click', item.acao);
      box.appendChild(b);
    }
  });

  if (detalhe) {
    const small = document.createElement('p');
    small.className = 'small';
    small.textContent = detalhe;
    box.appendChild(small);
  }

  el.appendChild(box);
}

async function carregarCanais() {
  const url = RAW_INSTALACAO + 'distribuicao/canais.json';

  try {
    const resposta = await fetch(url, {
      method: 'GET',
      mode: 'cors',
      cache: 'no-store'
    });

    if (!resposta.ok) throw new Error('HTTP ' + resposta.status);

    const dados = await resposta.json();
    if (!dados || !Array.isArray(dados.canais) || !dados.canais.length) {
      throw new Error('Estrutura canais[] inválida');
    }

    return dados;
  } catch (erro) {
    // A indisponibilidade do JSON não pode impedir a abertura dos canais.
    return {
      espera_conversa_s: PADRAO.espera_conversa_s,
      canais: PADRAO.canais,
      origem: 'local-fallback',
      erro: String(erro && erro.message || erro)
    };
  }
}

function obterIdDaRota(canais) {
  const params = new URLSearchParams(location.search);
  const parametros = ['id','canal','ch','channel','numero','n'];

  for (const nome of parametros) {
    const valor = params.get(nome);
    if (valor) return valor.trim().toLowerCase();
  }

  const segmentos = decodeURIComponent(location.pathname)
    .split('/')
    .filter(Boolean);

  // Ignora "conversa", "instalacao" e "canal" para suportar
  // tanto /conversa/youtube quanto /conversa/instalacao/canal?id=youtube.
  const candidatos = [];
  for (const segmento of segmentos) {
    const s = segmento.toLowerCase().replace(/\.html?$/,'');
    if (!['conversa','instalacao','canal','index'].includes(s)) {
      candidatos.push(s);
      candidatos.push(s.replace(/\d+$/,''));
      candidatos.push(s.replace(/^canal[-_]/,''));
    }
  }

  for (const candidato of candidatos.reverse()) {
    const encontrado = canais.find(ch => {
      if (!ch) return false;
      const id = String(ch.id || '').toLowerCase();
      const numero = ch.numero == null ? '' : String(ch.numero);
      const rota = String(ch.rota || '').replace(/\/$/,'').toLowerCase();
      const aliases = Array.isArray(ch.alias) ? ch.alias : [];
      return candidato === id ||
        candidato === numero ||
        candidato === rota.split('/').pop() ||
        aliases.some(a => String(a).replace(/\/$/,'').toLowerCase() === '/' + candidato);
    });
    if (encontrado) return String(encontrado.id).toLowerCase();
  }

  return '';
}

function usuarioLogado() {
  try {
    const u = JSON.parse(localStorage.getItem('almafluxo_usuario') || 'null');
    return !!u;
  } catch (_) {
    return false;
  }
}

function conversaJaVista() {
  try {
    return !!sessionStorage.getItem('af_conversa_vista');
  } catch (_) {
    return false;
  }
}

function registrarProximo(ch, dados) {
  try {
    const estado = JSON.parse(localStorage.getItem('almafluxo_instalador') || '{}');
    estado.proximo = ch.rota;
    estado.ultimaAbertura = Date.now();
    estado.esperaTotem = dados.espera_conversa_s || 45;
    localStorage.setItem('almafluxo_instalador', JSON.stringify(estado));
  } catch (_) {}
}

function abrirYouTube(ch) {
  const fontes = Array.isArray(ch.fontes) ? ch.fontes : [];

  const extrair = valor => {
    const texto = String(valor || '').trim();
    const m = texto.match(/(?:list=|v=|youtu\.be\/|embed\/)([\w-]{6,})/);
    return m ? m[1] : (/^[\w-]{6,}$/.test(texto) ? texto : null);
  };

  const reproduzir = fonte => {
    const iframe = document.createElement('iframe');
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    iframe.allowFullscreen = true;
    iframe.src = fonte.lista
      ? 'https://www.youtube-nocookie.com/embed/videoseries?list=' + encodeURIComponent(fonte.lista) + '&autoplay=1'
      : 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(fonte.video) + '?autoplay=1';
    el.innerHTML = '';
    el.appendChild(iframe);
  };

  if (fontes.length) {
    const primeira = fontes[0];
    if (primeira && (primeira.lista || primeira.video)) {
      reproduzir(primeira);
      return;
    }
  }

  el.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'box';

  const h = document.createElement('h1');
  h.textContent = 'YouTube';
  box.appendChild(h);

  const p = document.createElement('p');
  p.textContent = 'Cole o link de um vídeo ou playlist para assistir.';
  box.appendChild(p);

  const input = document.createElement('input');
  input.id = 'youtube-url';
  input.placeholder = 'https://www.youtube.com/watch?v=…';
  input.setAttribute('aria-label','Link do YouTube');
  box.appendChild(input);

  const botao = document.createElement('button');
  botao.className = 'btn';
  botao.type = 'button';
  botao.textContent = 'Assistir';
  botao.addEventListener('click', () => {
    const valor = input.value.trim();
    const lista = valor.match(/list=([\w-]+)/);
    const video = extrair(valor);

    if (lista) reproduzir({lista:lista[1]});
    else if (video) reproduzir({video});
    else mostrar('Link não reconhecido','Informe um link válido de vídeo ou playlist do YouTube.',[
      {texto:'Voltar',href:'/conversa/'}
    ]);
  });
  box.appendChild(botao);
  el.appendChild(box);
}

async function iniciar() {
  const dados = await carregarCanais();
  const canais = dados.canais || [];
  const id = obterIdDaRota(canais);

  if (!id) {
    mostrar('Identificação do canal ausente',
      'A página abriu, mas não recebeu o identificador do canal na URL.',
      [{texto:'Voltar ao totem',href:'/conversa/'}],
      'Rota recebida: ' + location.pathname + location.search);
    return;
  }

  const ch = canais.find(item => item && String(item.id).toLowerCase() === id);

  if (!ch) {
    mostrar('Canal não localizado na configuração',
      'O identificador recebido não corresponde aos canais disponíveis.',
      [{texto:'Voltar ao totem',href:'/conversa/'}],
      'Identificador: ' + id + ' · Origem da lista: ' + (dados.origem || 'canais.json'));
    return;
  }

  if (ch.login && !usuarioLogado()) {
    mostrar(ch.nome,
      'Este canal exige uma conta ALMAFLUXO.',
      [{texto:'Entrar / criar conta',href:'/conversa/instalacao'}]);
    return;
  }

  document.title = 'ALMAFLUXO · ' + ch.nome;

  // Canais marcados como diretos seguem para a rota configurada.
  // A comparação evita redirecionamento infinito quando já estamos nela.
  if (ch.direto === true && ch.rota) {
    const destino = new URL(ch.rota, location.origin);
    if (destino.pathname.replace(/\/$/,'') !== location.pathname.replace(/\/$/,'')) {
      location.replace(destino.href);
      return;
    }
  }

  // Mantém o fluxo original: primeiro passa pelo totem uma vez por sessão.
  if (!conversaJaVista() && ch.tipo !== 'video') {
    registrarProximo(ch, dados);
    location.replace('/conversa/');
    return;
  }

  if (ch.tipo === 'youtube') {
    abrirYouTube(ch);
    return;
  }

  if (ch.tipo === 'video') {
    mostrar(ch.nome,
      'Este canal abre diretamente pela rota de vídeo configurada.',
      [{texto:'Abrir entrevista',href:ch.rota || '/conversa/entrevista'},
       {texto:'Voltar ao totem',href:'/conversa/'}]);
    return;
  }

  if (ch.tipo === 'totem') {
    if (location.pathname.replace(/\/$/,'') !== '/conversa') {
      location.replace(ch.rota || '/conversa/');
      return;
    }
    mostrar(ch.nome,'O canal principal ALMAFLUXO está disponível.',
      [{texto:'Abrir totem',href:'/conversa/'}]);
    return;
  }

  const url = ch.url;
  if (!url) {
    mostrar(ch.nome,'Este canal ainda não possui um endereço externo configurado.',
      [{texto:'Voltar ao totem',href:'/conversa/'}]);
    return;
  }

  mostrar(ch.nome,
    ch.nome + ' abre em uma nova janela. O login é feito no próprio site e a sessão é mantida pelo navegador.',
    [
      {texto:'Abrir ' + ch.nome,acao:() => window.open(url,'_blank','noopener,noreferrer')},
      {texto:'Voltar ao totem',href:'/conversa/'}
    ]);
}

iniciar().catch(erro => {
  mostrar('Erro ao abrir canal',
    'Ocorreu uma falha inesperada ao carregar este canal.',
    [{texto:'Voltar ao totem',href:'/conversa/'}],
    String(erro && erro.message || erro));
});
</script>
</body>
</html>
