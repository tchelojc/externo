<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALMAFLUXO · Entrevista</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#eaf6ff;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
video{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;pointer-events:none}
video.on{opacity:1;pointer-events:auto}
#msg{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:5;background:#000c}
#msg.off{display:none}
#msg .box{max-width:560px}
#msg h1{margin:0 0 10px;font-size:clamp(22px,4vw,34px)}
#msg p{color:#b8cbe6;line-height:1.5;margin:0 0 12px}
button{font:inherit;color:#eaf6ff;background:#0a1d3a;border:1px solid #27c8ff;border-radius:10px;padding:12px 18px;cursor:pointer}
button.p{background:#1f7bff}
button:focus{outline:3px solid #ffd17a}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 16px 16px;background:linear-gradient(transparent,#000d);display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
#info{flex:1 1 200px;font-size:15px;color:#cfe3ff}
#prog{flex:1 1 100%;height:6px;background:#254365;border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:#27c8ff}
#lista{position:fixed;z-index:6;left:12px;bottom:84px;max-height:60vh;overflow:auto;min-width:240px;background:#06122cf5;border:1px solid #27c8ff;border-radius:12px;padding:8px;display:none}
#lista button{display:block;width:100%;text-align:left;margin:3px 0}
#lista button.at{background:#1f7bff}
#espera{position:fixed;top:12px;left:12px;z-index:4;font-size:14px;color:#cfe3ff;background:#0a1d3acc;border:1px solid #27c8ff;border-radius:8px;padding:6px 10px;display:none}
</style>
</head>
<body>
<video id="a" playsinline preload="auto"></video>
<video id="b" playsinline preload="auto"></video>
<div id="espera">Carregando…</div>
<div id="msg"><div class="box"><h1>Entrevista</h1><p id="mt">Procurando as partes da entrevista…</p><div id="ma"></div></div></div>
<div id="lista" role="listbox" aria-label="Partes da entrevista"></div>
<div id="bar" class="hide">
 <div id="prog"><i id="pg"></i></div>
 <button id="bAnt" type="button" aria-label="Parte anterior">⏮ Parte</button>
 <button id="bMenos" type="button" aria-label="Voltar 10 segundos">−10 s</button>
 <button id="bPlay" type="button" class="p" aria-label="Pausar ou continuar">⏯</button>
 <button id="bMais" type="button" aria-label="Avançar 10 segundos">+10 s</button>
 <button id="bProx" type="button" aria-label="Próxima parte">Parte ⏭</button>
 <button id="bLista" type="button" aria-label="Lista de partes">☰ Partes</button>
 <button id="bTela" type="button" aria-label="Tela cheia">⛶</button>
 <div id="info"></div>
</div>
<script>
(()=>{'use strict';
const BASE='/entrevista/',CH='af_entrevista_pos';
const A=document.getElementById('a'),B=document.getElementById('b');
const $=id=>document.getElementById(id);
let partes=[],i=0,ativo=A,reserva=B,titulo='Entrevista',ultimoSalvo=0,tBar=null;

const url=k=>(k>=0&&k<partes.length)?BASE+partes[k].arquivo:'';
const msg=(t,acoes)=>{$('msg').classList.remove('off');$('mt').textContent=t;const m=$('ma');m.replaceChildren();(acoes||[]).forEach(([r,f,p])=>{const b=document.createElement('button');b.type='button';b.textContent=r;if(p)b.className='p';b.onclick=f;m.appendChild(b);m.append(' ')});const f=m.querySelector('button');if(f)f.focus()};
const fecharMsg=()=>$('msg').classList.add('off');

async function existe(u){try{const r=await fetch(u,{method:'HEAD',cache:'no-store'});return r.ok}catch(e){return false}}

async function carregarLista(){
 try{
  const r=await fetch(BASE+'lista.json',{cache:'no-store'});
  if(r.ok){
   const j=await r.json();
   if(j&&typeof j.titulo==='string'&&j.titulo.trim())titulo=j.titulo.trim();
   if(j&&Array.isArray(j.partes)&&j.partes.length){
    const L=j.partes.map((p,k)=>typeof p==='string'?{arquivo:p,titulo:'Parte '+(k+1)}:{arquivo:String((p&&p.arquivo)||''),titulo:String((p&&p.titulo)||('Parte '+(k+1)))})
     .filter(p=>/^[\w.-]+\.(mp4|webm)$/.test(p.arquivo));
    if(L.length)return L;
   }
  }
 }catch(e){}
 // Sem lista.json: procura parte-01.mp4, parte-02.mp4, ... até a primeira que faltar.
 const out=[];
 for(let n=1;n<=99;n++){
  const f='parte-'+String(n).padStart(2,'0')+'.mp4';
  $('mt').textContent='Procurando as partes… ('+n+')';
  if(!await existe(BASE+f))break;
  out.push({arquivo:f,titulo:'Parte '+n});
 }
 return out;
}

const salvar=(forcar)=>{const v=ativo,agora=Date.now();if(!forcar&&agora-ultimoSalvo<3000)return;ultimoSalvo=agora;try{localStorage.setItem(CH,JSON.stringify({i,t:Math.floor(v.currentTime||0)}))}catch(e){}};
const lerPos=()=>{try{const p=JSON.parse(localStorage.getItem(CH)||'null');if(p&&Number.isInteger(p.i)&&p.i>=0&&p.i<partes.length)return p}catch(e){}return null};

function mostrar(v){A.classList.toggle('on',v===A);B.classList.toggle('on',v===B)}
function preparar(){
 const n=url(i+1);
 if(n&&reserva.dataset.src!==n){reserva.dataset.src=n;reserva.src=n;reserva.load()}
 if(!n){reserva.removeAttribute('src');reserva.dataset.src=''}
}
function atualizarUI(){
 $('info').textContent=titulo+' · '+(partes[i]?partes[i].titulo:'')+' ('+(i+1)+'/'+partes.length+')';
 document.querySelectorAll('#lista button').forEach((b,k)=>b.classList.toggle('at',k===i));
}

function abrir(k,t){
 if(k<0||k>=partes.length)return;
 const alvo=url(k);
 ativo.pause();
 i=k;
 if(reserva.dataset.src===alvo&&reserva.readyState>0){const x=ativo;ativo=reserva;reserva=x}
 else{ativo.dataset.src=alvo;ativo.src=alvo;ativo.load()}
 if(t){const v=ativo;const f=()=>{try{v.currentTime=t}catch(e){}};if(v.readyState>0)f();else v.addEventListener('loadedmetadata',f,{once:true})}
 mostrar(ativo);
 ativo.muted=false;
 const p=ativo.play();
 if(p&&p.catch)p.catch(()=>msg('Toque para começar a assistir.',[['▶ Assistir',()=>{fecharMsg();ativo.play().catch(()=>{})},true]]));
 preparar();atualizarUI();salvar(true);
}
const proxima=()=>{if(i+1<partes.length)abrir(i+1,0);else fim()};
const anterior=()=>{if(ativo.currentTime>5)ativo.currentTime=0;else abrir(Math.max(0,i-1),0)};
function fim(){try{localStorage.removeItem(CH)}catch(e){}msg('Fim da entrevista.',[['↺ Rever do início',()=>{fecharMsg();abrir(0,0)},true]])}
const alternar=()=>{if(ativo.paused)ativo.play().catch(()=>{});else ativo.pause()};
const pular=s=>{try{ativo.currentTime=Math.max(0,Math.min((ativo.duration||1e9),ativo.currentTime+s))}catch(e){}};

function montarLista(){
 const L=$('lista');L.replaceChildren();
 partes.forEach((p,k)=>{const b=document.createElement('button');b.type='button';b.textContent=(k+1)+' · '+p.titulo;b.onclick=()=>{L.style.display='none';abrir(k,0)};L.appendChild(b)});
}

function eventosVideo(v){
 v.addEventListener('ended',()=>{if(v===ativo)proxima()});
 v.addEventListener('timeupdate',()=>{if(v!==ativo)return;const d=v.duration;$('pg').style.width=(d?Math.min(100,v.currentTime/d*100):0)+'%';salvar(false)});
 v.addEventListener('waiting',()=>{if(v===ativo)$('espera').style.display='block'});
 const ok=()=>{if(v===ativo)$('espera').style.display='none'};
 v.addEventListener('playing',ok);v.addEventListener('canplay',ok);
 v.addEventListener('error',()=>{
  if(v!==ativo||!v.getAttribute('src'))return;
  msg('Não foi possível reproduzir "'+(partes[i]?partes[i].titulo:'')+'". Confira se o arquivo foi enviado ao GitHub e se é MP4 (H.264).',[
   ['Tentar de novo',()=>{fecharMsg();abrir(i,0)},true],
   ['Pular para a próxima',()=>{fecharMsg();proxima()}]
  ]);
 });
}

function barra(){const b=$('bar');b.classList.remove('hide');clearTimeout(tBar);tBar=setTimeout(()=>{if(!ativo.paused)b.classList.add('hide')},4500)}

async function iniciar(){
 eventosVideo(A);eventosVideo(B);
 partes=await carregarLista();
 if(!partes.length){
  msg('Nenhuma parte encontrada. Envie os vídeos ao GitHub na pasta da entrevista com os nomes parte-01.mp4, parte-02.mp4… (ou crie o lista.json).',[['Procurar de novo',()=>location.reload(),true]]);
  return;
 }
 montarLista();
 $('bPlay').onclick=alternar;$('bMais').onclick=()=>pular(10);$('bMenos').onclick=()=>pular(-10);
 $('bProx').onclick=proxima;$('bAnt').onclick=anterior;
 $('bLista').onclick=()=>{const L=$('lista');L.style.display=L.style.display==='block'?'none':'block'};
 $('bTela').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{})};
 ['pointermove','pointerdown','keydown'].forEach(e=>addEventListener(e,barra));
 addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||''))return;
  const k=e.key;
  if(k===' '||k==='MediaPlayPause'||(k==='Enter'&&e.target===document.body)){e.preventDefault();alternar()}
  else if(k==='ArrowRight'){e.preventDefault();pular(10)}
  else if(k==='ArrowLeft'){e.preventDefault();pular(-10)}
  else if(k==='ArrowDown'||k==='n'){e.preventDefault();proxima()}
  else if(k==='ArrowUp'||k==='p'){e.preventDefault();anterior()}
  else if(k==='f'){$('bTela').click()}
 });
 addEventListener('beforeunload',()=>salvar(true));
 const p=lerPos();
 fecharMsg();
 abrir(p?p.i:0,p?p.t:0);
 barra();
}
iniciar();
})();
</script>
<script src="/core/canais.js"></script>
</body>
</html>
