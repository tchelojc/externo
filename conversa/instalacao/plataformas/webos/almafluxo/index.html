<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ALMAFLUXO</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#07111d;color:#eff7ff;font-family:Arial,sans-serif}
#m{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:28px}</style></head>
<body><div id="m">Abrindo ALMAFLUXO...</div>
<script>
// App hospedado: abre o totem publicado. Sem rede, avisa em vez de tela preta.
function ir(){ location.replace('https://almafluxo.uk/conversa'); }
if (navigator.onLine === false) {
  document.getElementById('m').innerHTML = 'Sem conexao com a internet.<br><small>Conecte a TV a rede e abra o app de novo.</small>';
  window.addEventListener('online', ir);
} else { setTimeout(ir, 300); }
</script></body></html>
