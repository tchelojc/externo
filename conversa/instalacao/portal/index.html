<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03060d"><title>ALMAFLUXO</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#03060d;color:#eaf6ff;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#0c2340 0,#03060d 62%)}
main{display:grid;justify-items:center;gap:clamp(22px,5vh,48px)}
.orb{width:min(52vmin,420px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#fff 0,#b4f3ff 6%,#2fa6e6 26%,#17408a 58%,#050e22 78%);box-shadow:0 0 90px #2fb4ff55,inset -30px -40px 80px #02081c;animation:p 5s ease-in-out infinite}
.orb span{font-weight:800;letter-spacing:.28em;font-size:clamp(14px,3.4vmin,28px);text-indent:.28em;text-shadow:0 2px 18px #021028}
@keyframes p{50%{transform:scale(1.035);box-shadow:0 0 130px #35c6ff77,inset -30px -40px 80px #02081c}}
a{color:#eaf6ff;text-decoration:none;letter-spacing:.38em;text-indent:.38em;font-size:clamp(13px,2.4vmin,20px);padding:14px 38px;border:1px solid #3d7aa8;border-radius:40px;background:#0b1d33aa}
a:focus,a:hover{outline:3px solid #ffd17a;outline-offset:4px;background:#12304f}@media(prefers-reduced-motion:reduce){.orb{animation:none}}</style></head>
<body><main><div class="orb" aria-hidden="true"><span>ALMAFLUXO</span></div><a id="e" href="/conversa/instalacao" autofocus>ENTRA</a></main>
<script>
try {
  var s = JSON.parse(localStorage.almafluxo_instalador || '{}');
  setTimeout(function () {
    location.href = '/conversa/instalacao';
  }, s.instalado ? 3000 : 9000);
} catch (e) {}
</script></body></html>
