<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karaokê Fluxo — Acesso</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(circle at 20% 30%,#0a0f1a,#030507);
  font-family:"Segoe UI","Courier New",monospace;
  min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px
}
.container{
  background:rgba(10,20,30,.9);backdrop-filter:blur(14px);
  border-radius:32px;border:1px solid rgba(0,255,255,.35);
  box-shadow:0 20px 48px rgba(0,0,0,.55),0 0 24px rgba(0,255,255,.18);
  padding:2rem;width:100%;max-width:440px;text-align:center
}
#containerEmail, #containerSenha { display:none; }
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;flex-wrap:wrap;gap:.5rem}
.title{font-size:1.2rem;background:linear-gradient(135deg,#0ff,#0f0);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.subtitulo{color:#8cc;font-size:.85rem;margin-bottom:1.4rem;line-height:1.5}
.cd-info{font-size:.8rem;color:#4cc;display:flex;gap:.5rem;align-items:center}
.cd-info .value{font-family:monospace;font-weight:bold;color:#0f0}
input[type=text], input[type=email]{
  background:#0a121c;border:2px solid #2a6a6a;border-radius:48px;
  padding:12px 20px;width:100%;color:#0ff;font-size:1rem;
  font-family:monospace;text-align:center;letter-spacing:1px;
  outline:none;transition:.2s;margin-bottom:12px
}
input:focus{border-color:#0ff;box-shadow:0 0 18px rgba(0,255,255,.2)}
button{
  background:linear-gradient(95deg,#0a2a2a,#0a3a3a);border:none;
  border-radius:48px;padding:12px 24px;width:100%;font-size:1rem;
  font-weight:bold;color:#0ff;cursor:pointer;transition:.2s;
  margin-bottom:8px
}
button:hover{background:linear-gradient(95deg,#0c3c3c,#0e5e5e);color:#fff;box-shadow:0 0 14px rgba(0,255,255,.3);transform:scale(1.02)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-auto{
  background:linear-gradient(95deg,#1a3a1a,#0a5a2a);
  border:1px solid rgba(0,255,0,.2);
  color:#0f0;
  font-size:.85rem;
  padding:10px 20px;
}
.btn-auto:hover{
  background:linear-gradient(95deg,#2a4a2a,#1a6a3a);
  box-shadow:0 0 14px rgba(0,255,0,.2);
}
.erro{color:#f66;margin-top:10px;font-size:.8rem;display:none;padding:8px 14px;background:#1a0505;border-radius:10px;border:1px solid #5a1a1a}
.sucesso{color:#0f0;margin-top:10px;font-size:.8rem;display:none;padding:8px 14px;background:#030f06;border-radius:10px;border:1px solid #0f5a3a}
footer{margin-top:1.4rem;font-size:.7rem;color:#2a6a6a}
.loader{display:inline-block;width:14px;height:14px;border:2px solid #0ff;border-top:2px solid transparent;border-radius:50%;animation:spin .8s linear infinite;margin-left:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ═══ TELA 1 — só o e-mail, sem burocracia ═══ -->
<div id="containerEmail" class="container">
  <div class="top-bar">
    <div class="title">🎤 KARAOKÊ FLUXO</div>
  </div>
  <p class="subtitulo">Digite seu e-mail para liberar 1 hora de acesso. sem cadastro complicado.</p>
  <input type="email" id="emailAcesso" placeholder="seu@email.com" autocomplete="email">
  <button id="btnLiberarAcesso">🎬 LIBERAR ACESSO (1h)</button>
  <div class="erro" id="erroEmail"></div>
  <div class="sucesso" id="sucessoEmail"></div>
  <footer>© ALMAFLUXO · Karaokê Fluxo · 3·6·9</footer>
</div>

<!-- ═══ TELA 2 — senha do período (com atalho de um clique) ═══ -->
<div id="containerSenha" class="container">
  <div class="top-bar">
    <div class="title">⚡ SEU ACESSO ESTÁ LIBERADO</div>
    <div class="cd-info" id="cdInfo">
      <span>🕒</span><span class="value" id="countdown">--:--:--</span>
    </div>
  </div>
  <p class="subtitulo">Digite a senha do período para entrar no Karaokê Fluxo.</p>
  <input type="text" id="senha" placeholder="SENHA DO PERÍODO" autocomplete="off" maxlength="20">

  <!-- NOVO: botão de atalho que preenche e envia a senha fixa -->
  <button class="btn-auto" id="btnAcessoAutomatico">⚡ ACESSAR COM SENHA PADRÃO (B2-G7-G7-H8)</button>

  <button id="btnDesbloquear">🔓 ENTRAR NO KARAOKÊ</button>
  <div class="erro" id="erroSenha"></div>
  <footer>© ALMAFLUXO · Karaokê Fluxo · 3·6·9 · Protegido via APPSCRIPT</footer>
</div>

<script>
// ═══════════════ CONFIGURAÇÃO ═══════════════
const _TK = "ALMA369UA";
const URL_BACKEND = "https://script.google.com/macros/s/AKfycbzcFPQlX22EYFaptdgFPL-wH1jFrqR8uYiPlQSZfohWadc3Z9ginNiicPd7eh6-mNi1/exec";
const TIMEOUT_MS = 15000;

let isProcessing = false;
let emailUsuario = "";
const tipoAcesso = "temporario";

const containerEmail = document.getElementById("containerEmail");
const containerSenha = document.getElementById("containerSenha");
const erroEmail = document.getElementById("erroEmail");
const sucessoEmail = document.getElementById("sucessoEmail");
const erroSenha = document.getElementById("erroSenha");

containerEmail.style.display = "block";

// ═══════════ HELPERS ═══════════
function mostrarErro(el, msg) {
    el.textContent = "❌ " + msg;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 6000);
}
function mostrarSucesso(el, msg) {
    el.textContent = "✅ " + msg;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 8000);
}
function pad(n) { return String(n).padStart(2, "0"); }

// ═══════════ FINGERPRINT ═══════════
async function fingerprint() {
    const data = [
        navigator.userAgent, navigator.language,
        screen.width, screen.height, screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || "?", navigator.deviceMemory || "?",
        navigator.platform || "?"
    ];
    const enc = new TextEncoder();
    const h = await crypto.subtle.digest("SHA-256", enc.encode(data.join("|")));
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,"0")).join("");
}

// ═══════════ PASSO 1 — CADASTRA E-MAIL ═══════════
async function cadastrarEmailTemporarioBackend(email) {
    const fp = await fingerprint();
    const resp = await fetch(URL_BACKEND, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
            action: "cadastrarEmailTemporario",
            email,
            nome: "",
            cupom: "",
            fingerprint: fp,
            tk: _TK
        })
    });
    return await resp.json();
}

document.getElementById("btnLiberarAcesso").onclick = async () => {
    if (isProcessing) return;
    const email = document.getElementById("emailAcesso").value.trim().toLowerCase();
    if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
        mostrarErro(erroEmail, "Informe um e-mail válido.");
        return;
    }

    isProcessing = true;
    const btn = document.getElementById("btnLiberarAcesso");
    btn.disabled = true;
    btn.innerHTML = '🎬 LIBERANDO... <span class="loader"></span>';

    try {
        const resp = await cadastrarEmailTemporarioBackend(email);
        if (!resp.ok) {
            throw new Error(resp.error || "Não foi possível liberar o acesso agora.");
        }
        emailUsuario = email;
        mostrarSucesso(sucessoEmail, "Acesso liberado por 1 hora! Avançando...");
        setTimeout(() => {
            containerEmail.style.display = "none";
            containerSenha.style.display = "block";
            iniciarContagem();
            document.getElementById("senha").focus();
        }, 900);
    } catch (e) {
        mostrarErro(erroEmail, e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '🎬 LIBERAR ACESSO (1h)';
        isProcessing = false;
    }
};

document.getElementById("emailAcesso").addEventListener("keypress", e => {
    if (e.key === "Enter") document.getElementById("btnLiberarAcesso").click();
});

// ═══════════ CONTAGEM REGRESSIVA ═══════════
function iniciarContagem() {
    atualizarContagem();
    setInterval(atualizarContagem, 1000);
}
function atualizarContagem() {
    const agora = new Date();
    const amanha = new Date(Date.UTC(agora.getUTCFullYear(), agora.getUTCMonth(), agora.getUTCDate() + 1));
    const ms = amanha - agora;
    const el = document.getElementById("countdown");
    if (el) {
        const s = Math.floor(ms / 1000);
        el.textContent = `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;
    }
}

// ═══════════ PASSO 2 — SENHA DO PERÍODO (busca e descriptografa) ═══════════
async function obterChave(senha) {
    const getUrl = `${URL_BACKEND}?action=getKeyWithPassword&password=${encodeURIComponent(senha)}&tk=${_TK}`;
    let response;
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);
        response = await fetch(getUrl, { signal: controller.signal });
        clearTimeout(timeoutId);
    } catch (e) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);
        response = await fetch(URL_BACKEND, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "getKeyWithPassword", password: senha, tk: _TK }),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
    }
    if (!response.ok) throw new Error("Erro de conexão");
    const data = await response.json();
    if (!data.ok) throw new Error("Senha inválida ou expirada");
    if (!data.chaveMestra || !data.nonce || !data.tag || !data.data) throw new Error("Dados incompletos");
    const keyBytes = Uint8Array.from(atob(data.chaveMestra), c => c.charCodeAt(0));
    if (keyBytes.length !== 32) throw new Error("Chave inválida");
    return { chaveMestra: data.chaveMestra, conteudo: { nonce: data.nonce, tag: data.tag, data: data.data } };
}

async function aesDecrypt(obj, keyB64) {
    const keyBytes = Uint8Array.from(atob(keyB64), c => c.charCodeAt(0));
    const cryptoKey = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    const iv = Uint8Array.from(atob(obj.nonce), c => c.charCodeAt(0));
    const tag = Uint8Array.from(atob(obj.tag), c => c.charCodeAt(0));
    const data = Uint8Array.from(atob(obj.data), c => c.charCodeAt(0));
    return await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv, tagLength: 128 }, cryptoKey, new Uint8Array([...data, ...tag]));
}

function exibirConteudo(html) {
    const txt = html.trim();
    if (txt.toLowerCase().startsWith("<!doctype") || txt.startsWith("<html")) {
        const iframe = document.createElement("iframe");
        iframe.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999";
        iframe.srcdoc = txt;
        document.body.innerHTML = "";
        document.body.appendChild(iframe);
    } else {
        const div = document.createElement("div");
        div.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#0a121c;overflow:auto";
        const pre = document.createElement("pre");
        pre.textContent = txt;
        pre.style.cssText = "padding:1rem;margin:0;color:#0ff;font-family:monospace;font-size:.9rem;white-space:pre-wrap";
        div.appendChild(pre);
        document.body.innerHTML = "";
        document.body.appendChild(div);
    }
}

// ═══════════ RASTREIO DE ACESSO ═══════════
async function registrarAcessoNoDrive() {
    if (!emailUsuario) return;
    try {
        const fp = await fingerprint();
        const payload = {
            tk: _TK,
            action: "registrarAcesso",
            tipo: tipoAcesso,
            email: emailUsuario,
            licenca_id: "",
            cupom: "",
            fingerprint: fp,
            extra: "Acesso via Karaokê Fluxo (rota simplificada)"
        };
        const response = await fetch(URL_BACKEND, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (data.ok) console.log("📡 Rastreio OK.");
        else console.error("❌ Erro no rastreio:", data.error);
    } catch (error) {
        console.error("Erro crítico no rastreio:", error);
    }
}

// ═══════════ BOTÃO PRINCIPAL (digitação manual) ═══════════
document.getElementById("btnDesbloquear").onclick = async () => {
    if (isProcessing) return;
    const senha = document.getElementById("senha").value.trim().toUpperCase();
    if (!senha) { mostrarErro(erroSenha, "Digite a senha do período."); return; }

    isProcessing = true;
    const btn = document.getElementById("btnDesbloquear");
    btn.innerText = "🔐 VERIFICANDO";
    btn.disabled = true;

    try {
        const { chaveMestra, conteudo } = await obterChave(senha);
        const buf = await aesDecrypt(conteudo, chaveMestra);
        exibirConteudo(new TextDecoder().decode(buf));
        await registrarAcessoNoDrive();
    } catch (e) {
        mostrarErro(erroSenha, e.message);
        btn.innerText = "🔓 ENTRAR NO KARAOKÊ";
        btn.disabled = false;
        isProcessing = false;
    }
};

document.getElementById("senha").addEventListener("keypress", e => {
    if (e.key === "Enter") document.getElementById("btnDesbloquear").click();
});

// ═══════════ NOVO: BOTÃO DE ATALHO — PREENCHE E ENVIA A SENHA FIXA ═══════════
document.getElementById("btnAcessoAutomatico").onclick = async () => {
    if (isProcessing) return;
    const senhaFixa = "B2-G7-G7-H8";
    // Preenche o campo de senha (opcional, mas útil para feedback visual)
    document.getElementById("senha").value = senhaFixa;
    // Dispara o clique no botão principal
    document.getElementById("btnDesbloquear").click();
};
</script>
</body>
</html>
