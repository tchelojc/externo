function cFase(dias, periodo){ return ((dias%periodo)+periodo)%periodo/periodo; }
// Data UTC sem o ajuste especial de Date.UTC para anos 0–99.
function cUtcMillis(ano, mes=0, dia=1, hora=0, minuto=0, segundo=0){
  const d=new Date(0); d.setUTCHours(hora,minuto,segundo,0); d.setUTCFullYear(ano,mes,dia); return d.getTime();
}
function cBaktun(ano){
  // Âncora operacional: 13.0.0.0.0 em 21/12/2012 (correlação GMT tradicional).
  // O resultado é uma conversão de calendário, não uma previsão física.
  const base=cUtcMillis(2012,11,21), instante=cUtcMillis(ano,0,1), dias=Math.floor((instante-base)/86400000);
  const numero=13+Math.floor(dias/144000), diasNoBaktun=((dias%144000)+144000)%144000;
  return {numero,diasNoBaktun,diasDesdeAncora:dias,ancora:'2012-12-21',nota:'Conversão aproximada da Contagem Longa; usa a âncora 13.0.0.0.0 em 21/12/2012.'};
}
function cPrecessaoLinear(ano){
  // Aproximação didática: 1 grau/72 anos a partir de J2000; não substitui efemérides.
  const graus=(ano-2000)/72;
  return {graus,normalizado:((graus%360)+360)%360,nota:'Proxy linearizado de 1°/72 anos desde J2000; não é a orientação astronômica completa do eixo.'};
}
function cAnoGalactico(){
  // Estimativa de ordem de grandeza: não há época orbital galáctica definida neste modelo.
  return {periodoMin:225000000,periodoMax:250000000,velocidadeKmS:220,raioMilAnosLuz:26, fase:null,
    nota:'Período estimado do Sol em torno do centro da Via Láctea. Sem uma época e uma posição orbital galáctica de referência, a fase percentual não é calculada.'};
}
function cAnguloSolCG(ano,mes=0,dia=1){
  // Sol geocêntrico aproximado (baixa precisão) e coordenadas equatoriais; CG em J2000.
  const jd=cUtcMillis(ano,mes,dia,0,0,0)/86400000+2440587.5, n=jd-2451545.0;
  const L=((280.460+0.9856474*n)%360+360)%360;
  const g=((357.528+0.9856003*n)%360+360)%360*Math.PI/180;
  const lambda=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*Math.PI/180;
  const eps=(23.439-0.0000004*n)*Math.PI/180;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lambda),Math.cos(lambda));
  const dec=Math.asin(Math.sin(eps)*Math.sin(lambda));
  const raCG=266.4051*Math.PI/180, decCG=-28.936175*Math.PI/180;
  const cosTheta=Math.max(-1,Math.min(1,Math.sin(dec)*Math.sin(decCG)+Math.cos(dec)*Math.cos(decCG)*Math.cos(ra-raCG)));
  return {graus:Math.acos(cosTheta)*180/Math.PI,raSol:((ra*180/Math.PI)%360+360)%360,decSol:dec*180/Math.PI,data:`${String(ano).padStart(4,'0')}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`,nota:'Estimativa de baixa precisão; separação angular aparente Sol–Centro Galáctico, não alinhamento 3D nem efeito físico especial.'};
}
function cFaseOrbitas(ano){
  // Época J2000: 2000-01-01T12:00:00Z. Para o ano selecionado,
  // a fase é avaliada em 1º de janeiro às 00:00 UTC.
  const epoch=cUtcMillis(2000,0,1,12,0,0);
  const instante=cUtcMillis(ano,0,1,0,0,0);
  const t=(instante-epoch)/86400000;
  return CICLOS_ORBITAS.map(o=>({...o, fase:cFase(t,o.dias), diasDecorridos:((t%o.dias)+o.dias)%o.dias, proximoCiclo:o.dias-(((t%o.dias)+o.dias)%o.dias), epoca:'2000-01-01T12:00:00Z', instanteCalculo:`${ano}-01-01T00:00:00Z`}));
}
function cDistFaseCircular(a,b){ const d=Math.abs(a-b)%1; return Math.min(d,1-d); }
function cAnalogiaHistorica(ano){
  // Compara parâmetros matemáticos na mesma data-calendário. O ranking é uma analogia de fases,
  // não correlação estatística entre astronomia e acontecimentos históricos.
  const futura=cFasesNaData(ano,11,21), angFuturo=cAnguloSolCG(ano,11,21).graus;
  const rows=C_HISTORICO.map(e=>{
    const f=cFasesNaData(e.ano,e.mes??0,e.dia??1), ang=cAnguloSolCG(e.ano,e.mes??0,e.dia??1).graus;
    const componentes=[
      {nome:'Terra',peso:.15,d:cDistFaseCircular(futura.terra,f.terra)/.5},
      {nome:'Mercúrio',peso:.25,d:cDistFaseCircular(futura.mercurio,f.mercurio)/.5},
      {nome:'proxy solar ~11 anos',peso:.35,d:cDistFaseCircular(futura.solar,f.solar)/.5},
      {nome:'ângulo Sol–Centro Galáctico',peso:.25,d:Math.abs(angFuturo-ang)/180}
    ];
    const distancia=componentes.reduce((sum,x)=>sum+x.peso*Math.min(1,x.d),0);
    return {e,similaridade:Math.max(0,Math.min(100,(1-distancia)*100)),dataComparada:cAnguloSolCG(e.ano,e.mes??0,e.dia??1).data,
      componentes:componentes.sort((a,b)=>a.d-b.d),f,ang,temas:e.assinatura||e.contexto||e.tipo,
      coletivo:e.massa||e.sentimentos||'Resposta coletiva ainda não detalhada nesta ficha.',
      cultura:e.musicas||e.som||'Expressões culturais ainda não detalhadas nesta ficha.'};
  });
  return rows.sort((a,b)=>b.similaridade-a.similaridade).slice(0,2);
}
function cRenderAnalogiasProjecao(ano){

function cGerarProjecoes(anoBase, horizonte, eventos){
  // Não usar o último evento conhecido como âncora: isso introduziria viés retrospectivo.
  const marco=CICLO_LONGO_ANO_REFERENCIA+CICLO_LONGO;

 {id:'renaissance_network',data:'c. 1350–1600',ano:1400,mes:0,dia:1,titulo:'Renascimento europeu: cidades, humanismo, oficinas e circulação de saber',tipo:'transformação cultural de longa duração',contexto:'O Renascimento foi uma transformação desigual, com raízes medievais e diferentes ritmos regionais. Comércio, recuperação e crises demográficas, textos clássicos, humanismo, oficinas, universidades, patronato religioso e cívico, impressão e redes de viajantes criaram condições para novas formas de arte e investigação.',massa:'O acesso à educação e aos livros era desigual por classe, gênero, religião e lugar. Artistas e estudiosos dependiam de oficinas, patronos, instituições e relações de colaboração; muitas contribuições coletivas não ficaram tão conhecidas quanto os nomes célebres.',som:'Música sacra polifônica, música de corte e dança; a impressão musical e a ampliação do patronato mudaram a circulação de repertórios. A evidência deve ser delimitada por cidade, instituição e data.',assinatura:'humanismo, patronato, urbanização, imprensa, redes de ofício, circulação de conhecimento',fontes:'The Metropolitan Museum of Art; Economic History Review',url:'https://82nd-and-fifth.metmuseum.org/toah/ht/08/eustc.html',categoria:'renascimento'},
 {id:'medici',data:'c. 1400–1494',ano:1469,mes:0,dia:1,titulo:'Florença, os Médici e o patrocínio do Renascimento',tipo:'rede de poder, finanças e patronato cultural',contexto:'Florença reuniu bancos, comércio, oficinas, universidades informais, guildas e competição entre famílias governantes. Os Médici financiaram artistas e estudiosos em fases diferentes; o Renascimento não foi obra de uma família só, nem começou de repente.',massa:'A experiência era desigual: patronos e elites financiavam obras, enquanto artesãos, aprendizes, trabalhadores, mulheres e populações rurais tinham acesso muito diferente à educação e ao poder.',som:'Música sacra polifônica, canto litúrgico e música de corte. A impressão musical ampliou a circulação de repertórios no século XVI; para canções específicas, registrar composição, local e manuscrito/edição.',assinatura:'patronato, comércio, humanismo, competição urbana, circulação de saber',fontes:'The Metropolitan Museum of Art; Economic History Review',url:'https://www.metmuseum.org/toah/ht/08/eustc.html',categoria:'renascimento'},
 {id:'portugal_navegacao',data:'1415–1498',ano:1488,mes:0,dia:1,titulo:'Portugal e a formação das rotas oceânicas',tipo:'navegação, comércio e expansão imperial',contexto:'A tomada de Ceuta em 1415, a exploração da costa africana, a passagem do Cabo da Boa Esperança por Bartolomeu Dias em 1488 e a viagem de Vasco da Gama à Índia em 1497–1499 conectaram navegação, comércio, guerra e missão religiosa.',massa:'Na corte, as viagens podiam representar prestígio e oportunidade; para marinheiros, comerciantes e comunidades costeiras, havia riscos e trabalho; povos africanos e asiáticos enfrentaram comércio coercivo, conquista e expansão da escravidão.',som:'Música de corte e religiosa portuguesa coexistiu com tradições africanas, asiáticas e atlânticas. Não atribuir um único repertório às expedições sem fonte de bordo, partitura, crônica ou estudo regional.',assinatura:'rotas comerciais, cartografia, risco marítimo, império, encontro e coerção',fontes:'Smithsonian National Museum of Asian Art; The Mariners’ Museum',url:'https://asia.si.edu/whats-on/exhibitions/encompassing-the-globe-portugal-and-the-world-in-the-16th-and-17th-centuries/',categoria:'navegação'},
 {id:'gutenberg',data:'c. 1450–1500',ano:1454,mes:0,dia:1,titulo:'Imprensa de tipos móveis e circulação de ideias',tipo:'mudança tecnológica e cultural',contexto:'A impressão europeia de tipos móveis reduziu o custo e o tempo de reprodução de textos em comparação com a cópia manual e acelerou a circulação de livros, panfletos, mapas e debates. O processo dependeu de papel, oficinas, comércio, leitores e redes urbanas.',massa:'Mais textos passaram a circular, mas alfabetização, censura, preço e acesso continuaram desiguais. A imprensa também ampliou disputas religiosas e políticas.',som:'A impressão musical começou a ganhar escala no início do século XVI; o livro musical impresso de Petrucci de 1501 é um marco documentado. Antes disso, manuscritos e aprendizagem oral predominavam.',assinatura:'reprodução, alfabetização, debate, padronização, redes de conhecimento',fontes:'The Metropolitan Museum of Art — Music in the Renaissance; UCLA Library',url:'https://www.metmuseum.org/pt/essays/music-in-the-renaissance',categoria:'tecnologia cultural'},
 {id:'leonardo',data:'1452–1519',ano:1452,mes:3,dia:15,titulo:'Leonardo da Vinci: arte, observação e engenharia',tipo:'perfil intelectual no Renascimento',contexto:'Leonardo formou-se em oficinas, trabalhou para patronos e cortes e investigou pintura, anatomia, mecânica, água e voo. Seu percurso dependeu de aprendizagem artesanal, desenho, observação, encomendas e competição entre centros italianos; seus cadernos não equivalem a uma ciência moderna institucionalizada.',massa:'A figura do artista-engenheiro ganhou espaço em ambientes de patronato e competição política. O acesso a oficinas, materiais e patronos condicionava quais projetos podiam ser realizados.',som:'A música fazia parte da vida de corte e da formação humanista, mas não existe uma “trilha sonora de Leonardo” que explique suas descobertas. Investigar instrumentos, festas e repertórios de cada corte em fontes específicas.',assinatura:'observação, desenho, oficina, patronato, interdisciplinaridade',fontes:'The Metropolitan Museum of Art; UCLA Library — fontes primárias do Renascimento',url:'https://www.metmuseum.org/toah/ht/08/eustc.html',categoria:'gênese intelectual'},
 {id:'michelangelo',data:'1475–1564',ano:1475,mes:2,dia:6,titulo:'Michelangelo: encomendas, religião e poder',tipo:'arte, religião e política',contexto:'Michelangelo trabalhou em Florença e Roma sob patronos civis e papais. Escultura, pintura e arquitetura estavam ligadas a devoção, prestígio dinástico, disputas políticas e à disponibilidade de oficinas, mármore, financiamento e trabalho especializado.',massa:'Obras monumentais tornavam visível o poder de patronos e instituições religiosas; os artistas podiam negociar autonomia, reputação e condições de trabalho dentro de hierarquias rígidas.',som:'Música litúrgica e polifonia eram parte do ambiente religioso e cortesão. A associação entre uma obra específica e uma composição requer documentação contemporânea, não apenas semelhança estética moderna.',assinatura:'religião, patronato, reputação, trabalho especializado, monumentalidade',fontes:'The Metropolitan Museum of Art — Florence and Central Italy, 1400–1600',url:'https://82nd-and-fifth.metmuseum.org/toah/ht/08/eustc.html',categoria:'gênese intelectual'},
 {id:'colombo',data:'1492–século XVI',ano:1492,mes:9,dia:12,titulo:'Espanha, Colombo e a expansão atlântica',tipo:'navegação, conquista e colonização',contexto:'A viagem de Colombo em 1492 foi financiada pela monarquia castelhana num contexto de competição por rotas comerciais, expansão dinástica e objetivos religiosos. A chegada europeia iniciou processos de conquista, colonização, epidemias, trabalho forçado e transformação profunda das sociedades indígenas.',massa:'Na Europa, circularam expectativas de riqueza e expansão; nas Américas, povos indígenas tiveram experiências diversas de diplomacia, resistência, perda territorial, violência e reorganização social. O relato europeu não representa a perspectiva indígena.',som:'Crônicas, música religiosa, repertórios indígenas e práticas africanas trazidas à força fazem parte de histórias culturais diferentes. Evitar atribuir uma canção única ao “descobrimento”; localizar comunidade, língua e documento.',assinatura:'monarquia, comércio, conquista, colonialismo, escravização, troca biológica',fontes:'Library of Congress — Spanish and Portuguese Exploration in the Americas; Oxford Cabinet',url:'https://www.loc.gov/classroom-materials/spanish-and-portuguese-exploration-in-the-americas/',categoria:'navegação / colonização'},
 {id:'reforma',data:'1517–1648',ano:1517,mes:9,dia:31,titulo:'Reforma, Contrarreforma e disputa pela autoridade',tipo:'transformação religiosa, política e midiática',contexto:'A Reforma protestante, a resposta católica, a impressão de textos religiosos e as disputas entre príncipes e instituições remodelaram a Europa. As consequências variaram por território e incluíram reformas de culto, censura, guerras e novas relações entre religião e Estado.',massa:'Convicção religiosa, conflito comunitário, medo de perseguição, novas identidades confessionais e negociação cotidiana coexistiram. Não houve uma reação uniforme em toda a Europa.',som:'Hinos congregacionais e corais protestantes cresceram em alguns territórios; música sacra católica e práticas locais continuaram ou foram reformadas noutros. Comparar partituras e hinários datados por região.',assinatura:'imprensa, religião, autoridade, identidade, conflito e reforma',fontes:'The Metropolitan Museum of Art — Music in the Renaissance; British Library — coleções históricas',url:'https://www.metmuseum.org/pt/essays/music-in-the-renaissance',categoria:'religião / cultura'},
 {id:'shakespeare',data:'1564–1616',ano:1599,mes:0,dia:1,titulo:'William Shakespeare e o teatro elisabetano',tipo:'literatura, cidade e mercado cultural',contexto:'A produção de Shakespeare cresceu num Londres em expansão, com companhias teatrais, patrocínio aristocrático, público pagante, imprensa e mudanças religiosas e políticas. As peças combinam tradições clássicas, crônicas, cultura popular e experimentação dramática.',massa:'O teatro reunia públicos socialmente diversos, mas o acesso e as convenções eram regulados por classe, gênero, censura e autoridade política. O sucesso dependia também de companhias, atores, patronos e espaços comerciais.',som:'Baladas, música de teatro, dança e instrumentos aparecem em peças e na cultura urbana. O repertório exato deve ser associado à peça, edição, encenação ou fonte musical específica.',assinatura:'urbanização, impressão, patronato, público, língua vernacular, censura',fontes:'Folger Shakespeare Library; British Library — Shakespeare',url:'https://www.folger.edu/explore/shakespeares-works/',categoria:'gênese intelectual'},
 {id:'inglaterra_navegacao',data:'1497–1607',ano:1588,mes:6,dia:29,titulo:'Inglaterra: navegação atlântica, corsários, companhias e expansão',tipo:'poder marítimo, comércio e colonização',contexto:'A viagem de John Cabot em 1497, as expedições de Francis Drake, a derrota da Armada Espanhola em 1588 e o desenvolvimento de companhias comerciais integraram a Inglaterra às rivalidades marítimas europeias. A expansão envolveu comércio, guerra, colonização e reivindicações territoriais.',massa:'A narrativa de prestígio marítimo conviveu com riscos de tripulação, conflitos religiosos, violência colonial e experiências indígenas distintas. Os relatos oficiais frequentemente privilegiam a perspectiva inglesa.',som:'Baladas marítimas, música de corte e canções populares podem ajudar a reconstituir a cultura da época, desde que se confirme a data e a circulação de cada repertório.',assinatura:'rivalidade imperial, comércio, navegação, guerra, colonização, propaganda',fontes:'University of Southampton — Age of Discovery; Oxford Cabinet',url:'https://www.southampton.ac.uk/courses/2026-27/modules/hist2215',categoria:'navegação / império'},
 {id:'holanda_voc',data:'1602–século XVII',ano:1602,mes:2,dia:20,titulo:'Holanda, VOC e a economia marítima global',tipo:'companhias comerciais, finanças e império',contexto:'A Companhia Holandesa das Índias Orientais (VOC), criada em 1602, articulou capital de investidores, ações, frota, força militar e monopólios comerciais. A ascensão holandesa ocorreu dentro de rivalidades com Portugal, Espanha e depois Inglaterra, com violência colonial e exploração de trabalhadores.',massa:'Mercadores e investidores podiam obter oportunidades, enquanto marinheiros e trabalhadores enfrentavam riscos; comunidades colonizadas sofreram coerção, monopólio e deslocamento. Prosperidade comercial não foi distribuída igualmente.',som:'Música urbana, calvinista, cortesã e de teatro coexistiu com repertórios de marinheiros e culturas coloniais. Para vincular uma obra ao comércio da VOC, exigir evidência local e datada.',assinatura:'capital, ações, navegação, monopólio, império, trabalho',fontes:'Rijksmuseum; University of Southampton — Age of Discovery',url:'https://www.southampton.ac.uk/courses/2026-27/modules/hist2215',categoria:'economia marítima'},
 {id:'revolucao_cientifica',data:'1543–1687',ano:1687,mes:0,dia:1,titulo:'Revolução Científica: Copérnico, Kepler, Galileu, Bacon e Descartes',tipo:'transformação dos métodos de conhecimento',contexto:'A publicação de obras sobre heliocentrismo, observação telescópica, leis do movimento planetário e novos métodos de investigação ocorreu por redes transnacionais de cartas, patronato, universidades, oficinas, impressão e disputas religiosas e filosóficas. Não foi uma marcha linear nem um consenso instantâneo.',massa:'Novas teorias geraram entusiasmo, controvérsia e resistências em comunidades específicas. Instrumentos, matemática, observação e debate público alteraram gradualmente critérios de evidência.',som:'Música de corte e igreja, teoria musical matemática e novas práticas instrumentais coexistiram. Não há uma emoção coletiva única que explique a transformação científica.',assinatura:'instrumentos, matemática, impressão, patronato, observação, controvérsia',fontes:'Stanford Encyclopedia of Philosophy — Newton; The Metropolitan Museum of Art',url:'https://plato.sydney.edu.au/entries/newton/',categoria:'ciência'},
 {id:'newton',data:'1642–1727',ano:1687,mes:6,dia:5,titulo:'Isaac Newton e a síntese matemática da natureza',tipo:'perfil intelectual na Revolução Científica',contexto:'Newton trabalhou num ambiente de sociedades científicas, circulação de correspondência, astronomia, óptica e matemática. Os Principia (1687) sistematizaram leis do movimento e gravitação; sua pesquisa também incluiu alquimia e teologia, mostrando que as fronteiras disciplinares do período eram diferentes das atuais.',massa:'A confiança na capacidade de explicar a natureza por leis matemáticas cresceu ao longo do tempo, mas a aceitação das ideias de Newton foi debatida e variou entre comunidades científicas.',som:'Não há repertório musical específico demonstrado como causa da obra de Newton. A cultura de corte, igreja e sociedades científicas pode ser estudada como ambiente, não como explicação direta de suas teorias.',assinatura:'matemática, instrumentos, redes científicas, publicação, controvérsia',fontes:'Stanford Encyclopedia of Philosophy — Isaac Newton; Royal Society',url:'https://plato.sydney.edu.au/entries/newton/',categoria:'gênese intelectual'},
 {id:'iluminismo',data:'c. 1680–1789',ano:1750,mes:0,dia:1,titulo:'Iluminismo: Voltaire, Rousseau, Diderot, Montesquieu e redes de debate',tipo:'filosofia política, ciência e esfera pública',contexto:'Salões, academias, cafés, editoras, enciclopédias, correspondência e sociedades científicas ampliaram debates sobre autoridade, tolerância, educação, leis e governo. Os pensadores discordavam entre si e escreviam dentro de limites de censura, privilégios e exclusões sociais.',massa:'Leitores, artesãos, mulheres de salão, religiosos, elites e autoridades participaram de formas desiguais. As ideias circulavam em redes e podiam ser apropriadas para projetos políticos distintos.',som:'Ópera, música de salão, concerto público e música instrumental acompanharam mudanças de patronato e mercado cultural. Não atribuir um único estilo musical ao Iluminismo inteiro.',assinatura:'esfera pública, crítica da autoridade, educação, ciência, direitos e exclusão',fontes:'Assemblée nationale — documentos da Revolução Francesa; The National Archives UK',url:'https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/reunion-des-etats-generaux-les-cahiers-de-doleances',categoria:'gênese intelectual'},
 {id:'revolucao_industrial',data:'c. 1760–1840',ano:1800,mes:0,dia:1,titulo:'Revolução Industrial e a transformação do trabalho',tipo:'mudança tecnológica, urbana e econômica',contexto:'Mecanização têxtil, energia a vapor, mineração, fábricas, ferrovias posteriores e expansão de mercados transformaram produção e urbanização, inicialmente sobretudo na Grã-Bretanha. O processo foi desigual e ligado ao comércio global, à escravidão e à extração colonial.',massa:'Migração para cidades, jornadas longas, insegurança, novas organizações de trabalhadores, conflitos de classe e oportunidades empresariais. Experiências variavam por região, gênero, idade e ocupação.',som:'Canções de trabalho, baladas urbanas, música de salão e tradições populares acompanharam a mudança social. Identificar repertório local e data antes de inferir que uma canção expressava toda a classe trabalhadora.',assinatura:'mecanização, carvão, fábrica, urbanização, classe, comércio global',fontes:'Economic History Review; British Library — industrial history',url:'https://www.bl.uk/romantics-and-victorians/articles/the-industrial-revolution',categoria:'economia / tecnologia'},
 {id:'revolucao_francesa',data:'1789–1799',ano:1789,mes:6,dia:14,titulo:'Revolução Francesa: crise fiscal, direitos, república e conflito',tipo:'revolução política e social',contexto:'Dívida estatal, desigualdade fiscal, crise de abastecimento e más colheitas juntaram-se a conflitos sobre representação e soberania. Entre os atores e correntes estão Luís XVI, Maria Antonieta, Mirabeau, Sieyès, Lafayette, Condorcet, Olympe de Gouges, Danton, Marat, Robespierre, Saint-Just, Brissot, Hébert e, na fase final, Napoleão Bonaparte; suas posições e influências mudaram ao longo da Revolução. Estados Gerais em 1789, queda da Bastilha, abolição de privilégios, declaração de direitos, república em 1792, execução de Luís XVI em 1793, Terror, Diretório e golpe de Bonaparte em 1799 formam uma sequência disputada e não linear.',massa:'Houve esperança, mobilização, medo, violência, participação popular, resistência e conflitos entre grupos. A experiência de mulheres, camponeses, trabalhadores urbanos, escravizados nas colônias e elites não foi igual.',som:'“La Marseillaise” surgiu em 1792 e tornou-se hino revolucionário; canções patrióticas, sátiras e cantos de rua circularam em contextos específicos. A letra e o uso político mudaram ao longo do tempo.',assinatura:'crise fiscal, pão, representação, direitos, guerra, mobilização, violência política',fontes:'Assemblée nationale — cahiers de doléances; The National Archives UK',url:'https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/reunion-des-etats-generaux-les-cahiers-de-doleances',categoria:'revolução'},
 {id:'marx',data:'1818–1883',ano:1848,mes:1,dia:21,titulo:'Karl Marx, Friedrich Engels e a crítica da sociedade industrial',tipo:'filosofia, economia política e movimento operário',contexto:'Marx desenvolveu suas ideias em meio à industrialização, à urbanização, à pobreza urbana, às revoluções de 1848, à censura e à formação de movimentos operários. O trabalho com Engels e o estudo de economistas clássicos, história e tecnologia moldaram suas análises; suas conclusões são influentes e contestadas.',massa:'Trabalhadores, sindicatos, socialistas, liberais e governos responderam de maneiras diferentes às desigualdades e às mudanças no trabalho. Não se deve tratar “a classe trabalhadora” como um grupo homogêneo.',som:'Hinos operários, canções de associação e repertórios revolucionários circularam em movimentos e países diferentes. Para uma música específica, verificar organização, língua, data e fonte documental.',assinatura:'industrialização, classe, propriedade, trabalho, revolução, imprensa',fontes:'Karl Marx House Museum / Friedrich-Ebert-Stiftung; British Library',url:'https://www.fes.de/en/museum-karl-marx-haus/education/short-biography-of-karl-marx',categoria:'gênese intelectual'},
 {id:'darwin',data:'1809–1882',ano:1859,mes:10,dia:24,titulo:'Charles Darwin e a transformação das ciências da vida',tipo:'ciência, observação e debate público',contexto:'Viagens, coleções, geologia, criação de animais, redes de naturalistas e debates sobre espécies prepararam o terreno para a publicação de On the Origin of Species em 1859. A teoria foi construída por evidências acumuladas e argumentação, em uma cultura científica em transformação.',massa:'As ideias provocaram debate científico, religioso e público, mas reações variaram por instituição e época. A teoria não surgiu isoladamente nem foi aceita instantaneamente.',som:'Não há repertório musical específico demonstrado como causa da teoria. Investigar cultura de sociedades científicas, museus, exposições e imprensa do século XIX como contexto mais amplo.',assinatura:'coleções, viagem, evidência, geologia, publicação, debate',fontes:'Darwin Correspondence Project; Natural History Museum',url:'https://www.darwinproject.ac.uk/',categoria:'gênese intelectual'},
 {id:'nietzsche',data:'1844–1900',ano:1882,mes:0,dia:1,titulo:'Friedrich Nietzsche: modernidade, moral e crise de valores',tipo:'filosofia e crítica cultural',contexto:'Nietzsche escreveu durante industrialização, nacionalismos, secularização, expansão da imprensa e mudanças nas universidades e na cultura alemã. Sua trajetória foi marcada por filologia clássica, interlocução crítica com Schopenhauer e Wagner e revisões profundas de suas próprias posições.',massa:'O trabalho intelectual circulava por universidades, editoras, periódicos e redes pessoais. A recepção inicial foi limitada e a influência posterior cresceu de forma desigual; não se deve projetar leituras posteriores sobre seu próprio contexto.',som:'Nietzsche tinha interesse profundo por música e escreveu sobre Wagner, mas isso é uma relação documentada entre sua vida intelectual e estética — não prova que uma música ou frequência tenha causado sua filosofia.',assinatura:'secularização, filologia, nacionalismo, estética, crítica moral, imprensa',fontes:'University of Illinois Press — Nietzsche’s Philosophical Context; Nietzsche Source',url:'https://www.jstor.org/stable/10.5406/j.ctt1xcr79',categoria:'gênese intelectual'},
 {id:'freud',data:'1856–1939',ano:1900,mes:0,dia:1,titulo:'Sigmund Freud e a emergência da psicanálise',tipo:'medicina, neurologia e cultura urbana',contexto:'Freud formou-se em medicina e pesquisa neurológica em Viena, estudou com Jean-Martin Charcot em Paris e desenvolveu a psicanálise em meio a novas práticas clínicas, debates sobre sexualidade, positivismo, tensões de classe e conflitos étnicos da Viena fin-de-siècle. Suas teorias foram influentes e também contestadas.',massa:'A atenção pública à vida psíquica cresceu em sociedades urbanas e médicas. Pacientes, médicos e leitores tiveram experiências distintas; os relatos clínicos não são uma amostra representativa de toda a população.',som:'Ópera, música de salão e cultura de cafés faziam parte da Viena da época; não há base para afirmar que uma música específica originou a psicanálise. A ligação deve ser feita com documentos, cartas ou testemunhos datados.',assinatura:'medicina, urbanização, sexualidade, inconsciente, clínica, secularização',fontes:'Library of Congress — Freud Papers; Freud Museum London',url:'https://www.loc.gov/exhibits/freud/freud01.html',categoria:'gênese intelectual'},
 {id:'jung',data:'1875–1961',ano:1913,mes:0,dia:1,titulo:'Carl Gustav Jung: psiquiatria, simbolismo e psicologia analítica',tipo:'psiquiatria e história das ideias',contexto:'Jung formou-se em medicina, trabalhou no hospital Burghölzli e colaborou com Freud entre 1907 e 1912 antes de divergirem sobre a natureza da psique. Sua psicologia analítica dialogou com psiquiatria, mitologia, religião, literatura e correntes intelectuais do início do século XX.',massa:'A psicologia se institucionalizava enquanto a cultura europeia discutia religião, ciência, modernidade e subjetividade. As teorias de Jung refletem esse contexto e não devem ser tratadas como descrição comprovada de todas as mentes ou culturas.',som:'Jung interessou-se por mitos, imagens e símbolos; associações entre arquétipos e músicas específicas exigem estudo cultural localizado e não constituem prova de mecanismo universal.',assinatura:'psiquiatria, simbolismo, religião, mito, crise intelectual, psicologia',fontes:'Library of Congress — The Red Book of Carl G. Jung; UCL Discovery',url:'https://wwws.loc.gov/exhibits/red-book-of-carl-jung/overview.html',categoria:'gênese intelectual'},
 {id:'currents',data:'1880–1896',ano:1893,mes:9,dia:1,titulo:'Guerra das Correntes',tipo:'disputa tecnológica / propaganda',contexto:'Disputa comercial e pública entre sistemas de corrente contínua e alternada; demonstrações, imprensa e argumentos de segurança moldaram a percepção pública.',massa:'Polarização entre defensores de tecnologias; medo de risco elétrico amplificado por campanhas públicas e demonstrações.',som:'Marchas, música urbana e repertórios de salão do fim do século XIX; a leitura sonora é contextual, não uma medição direta de “histeria”.',assinatura:'modernização, confiança no progresso, medo tecnológico',fontes:'National Park Service; Smithsonian',url:'https://www.nps.gov/articles/5-the-origins-of-hydroelectric-power.htm',categoria:'tecnologia'},

 leonardo:{cronologia:'1452: nascimento em Vinci. Década de 1460/1470: formação em oficina florentina. 1482–1499: trabalha em Milão para Ludovico Sforza. Depois atua em diferentes cortes e cidades; cadernos preservam estudos de anatomia, mecânica, água, pintura e projetos de engenharia.',musicas:'A música de corte era parte do ambiente renascentista, mas nenhuma composição isolada explica suas invenções. Procurar documentos de corte, instrumentos e registros de festas por local.',sentimentos:'Cadernos mostram curiosidade, persistência e revisão de hipóteses; são registros pessoais, não evidência de que um único evento tenha produzido sua criatividade.',economia:'O trabalho dependia de encomendas, patrocínio de cortes, oficinas, materiais e utilidade militar ou civil de alguns projetos. Muitos projetos ficaram em desenhos ou protótipos.',hemisferio:'Norte — Itália e França.',fontesPrimarias:[['UCLA Library — Renaissance Art primary sources','https://guides.library.ucla.edu/renaissance-art/primary'],['The Met — Florence and Central Italy','https://82nd-and-fifth.metmuseum.org/toah/ht/08/eustc.html']]},
 michelangelo:{cronologia:'1475: nasce em Caprese. 1490s: formação e primeiras encomendas em Florença. 1501–1504: David. 1508–1512: teto da Capela Sistina. 1536–1541: Juízo Final. Décadas finais: arquitetura de São Pedro e projetos em Roma.',musicas:'Música litúrgica e polifonia compunham o ambiente das igrejas e cortes. A relação com uma obra específica precisa de documentação de cerimônia ou instituição.',sentimentos:'Devoção, prestígio, rivalidade artística e poder papal aparecem em encomendas e correspondência. Não generalizar esses motivos para todos os habitantes.',economia:'Grandes encomendas mobilizavam financiamento e trabalho especializado, incluindo escultores, assistentes, pedreiros e fornecedores.',hemisferio:'Norte — Florença e Roma, Itália.',fontesPrimarias:[['The Met — Florence and Central Italy','https://82nd-and-fifth.metmuseum.org/toah/ht/08/eustc.html']]},
 colombo:{cronologia:'1492: primeira viagem de Colombo ao Caribe. 1494: Tratado de Tordesilhas entre Castela e Portugal. Século XVI: conquista, colonização e expansão de sistemas de trabalho coercivo; cronologias e resistências diferem por região.',musicas:'Não existe repertório único do evento. Pesquisar tradições indígenas, ibéricas e africanas com fontes e comunidades específicas, sem tratar crônicas coloniais como visão completa.',sentimentos:'Expectativas de riqueza na Europa contrastaram com experiências indígenas de diplomacia, resistência, epidemia, violência e perda territorial. Fontes europeias tendem a privilegiar o olhar dos conquistadores.',economia:'Metais preciosos, terras, trabalho compulsório, plantation e comércio transatlântico transformaram economias e sociedades; os benefícios e custos foram distribuídos de forma radicalmente desigual.',hemisferio:'Ambos os hemisférios — Caribe e Américas no Hemisfério Ocidental; financiamento e decisão política na Europa.',fontesPrimarias:[['Library of Congress — Spanish and Portuguese Exploration','https://www.loc.gov/classroom-materials/spanish-and-portuguese-exploration-in-the-americas/'],['Oxford Cabinet — An Age of Exploration','https://www.cabinet.ox.ac.uk/age-exploration-1400-1600']]},
 reforma:{cronologia:'1517: Lutero divulga suas teses. Décadas seguintes: expansão de reformas protestantes e respostas católicas. 1545–1563: Concílio de Trento. 1618–1648: Guerra dos Trinta Anos e rearranjos políticos e confessionais.',musicas:'Corais luteranos e hinos congregacionais em algumas regiões; repertórios católicos reformados e tradições locais em outras. Confirmar por hinários, partituras e datas.',sentimentos:'Fervor religioso, medo de perseguição, identidade comunitária e conflito aparecem em fontes regionais; não foram sentimentos uniformes.',economia:'Impressão e comércio de livros favoreceram circulação de ideias; guerras e confiscos afetaram regiões de maneira desigual.',hemisferio:'Norte — Europa, com efeitos posteriores nas redes coloniais de ambos os hemisférios.',fontesPrimarias:[['The Met — Music in the Renaissance','https://www.metmuseum.org/pt/essays/music-in-the-renaissance']]},
 shakespeare:{cronologia:'1564: nascimento. c. 1590–1613: carreira teatral e composição das peças. 1599: abertura aproximada do Globe Theatre. 1623: publicação do First Folio, essencial para preservar muitas peças.',musicas:'Canções e danças aparecem em peças como Twelfth Night e The Tempest; as reconstruções musicais dependem de fontes da peça e práticas teatrais da época.',sentimentos:'Comédias, tragédias e crônicas exploram ambição, amor, ciúme, poder, luto e conflito; são construções dramáticas, não uma pesquisa direta sobre emoções da população.',economia:'Teatro comercial urbano, companhias, patronato e impressão ajudaram a sustentar a carreira. Censura e licenciamento influenciavam o palco.',hemisferio:'Norte — Inglaterra; peças e repertório difundiram-se globalmente depois.',fontesPrimarias:[['Folger Shakespeare Library','https://www.folger.edu/explore/shakespeares-works/']]},
 inglaterra_navegacao:{cronologia:'1497: viagem de John Cabot pelo Atlântico Norte. 1577–1580: circunavegação de Francis Drake. 1588: derrota da Armada Espanhola. Fim do século XVI e início do XVII: expansão de companhias mercantis e projetos coloniais.',musicas:'Baladas marítimas e música de corte são pistas de pesquisa, não uma trilha única da expansão. Verificar datas, versões e circulação por meio de coleções de baladas, crônicas e registros navais.',sentimentos:'Prestígio e expectativa de lucro coexistiam com risco de navegação, conflito religioso, violência imperial e resistência das populações atingidas. Fontes oficiais frequentemente expressam o ponto de vista inglês.',economia:'Comércio atlântico, corso, companhias mercantis, guerra naval e colonização ampliaram a participação inglesa em circuitos globais, com custos humanos e coloniais.',hemisferio:'Norte — Inglaterra; rotas e colônias alcançaram as Américas e outros territórios em ambos os hemisférios.',fontesPrimarias:[['University of Southampton — Age of Discovery','https://www.southampton.ac.uk/courses/2026-27/modules/hist2215'],['Oxford Cabinet — An Age of Exploration, 1400–1600','https://www.cabinet.ox.ac.uk/age-exploration-1400-1600']]},
 holanda_voc:{cronologia:'1602: criação da VOC. Século XVII: expansão de rotas, entrepostos e conflitos comerciais. A companhia negociou e também empregou força coerciva para sustentar monopólios em regiões asiáticas.',musicas:'A cultura musical holandesa incluía repertórios religiosos, urbanos e de corte; repertórios coloniais eram diversos. Não presumir que uma canção específica represente a VOC sem fonte.',sentimentos:'Orgulho mercantil e expectativa de lucro coexistiam com risco marítimo, disciplina laboral e violência colonial. Fontes de investidores não representam as comunidades submetidas ao sistema.',economia:'Companhia por ações, capital de investidores, comércio de especiarias, monopólios e guerra naval. A riqueza mercantil teve custos humanos e coloniais.',hemisferio:'Norte — República Holandesa; operações e colônias em África, Ásia e outros territórios, atravessando hemisférios.',fontesPrimarias:[['University of Southampton — Age of Discovery','https://www.southampton.ac.uk/courses/2026-27/modules/hist2215']]},
 revolucao_cientifica:{cronologia:'1543: obras de Copérnico e Vesálio. Séculos XVI–XVII: observações de Galileu, leis de Kepler, novos métodos de Bacon e Descartes e formação de sociedades científicas. 1687: publicação dos Principia de Newton.',musicas:'Música de corte e igreja coexistiu com a nova cultura científica; a música não é uma variável causal estabelecida para as descobertas.',sentimentos:'Curiosidade, controvérsia e resistência institucional podem ser observadas em cartas, publicações e processos, mas variavam por pessoa e instituição.',economia:'Patronato, universidades, impressão, instrumentos e redes de correspondência eram condições materiais importantes; ciência dependia de financiamento e trabalho especializado.',hemisferio:'Norte — centros europeus; conhecimento e instrumentos circulavam por redes mais amplas.',fontesPrimarias:[['Stanford Encyclopedia of Philosophy — Newton','https://plato.sydney.edu.au/entries/newton/']]},
 newton:{cronologia:'1660s: trabalhos iniciais em cálculo, óptica e gravitação. 1672: comunica pesquisas sobre luz à Royal Society. 1687: publica Principia. 1704: publica Opticks. Em paralelo, dedicou esforço a teologia e alquimia.',musicas:'Não há evidência de música específica como causa da teoria da gravitação. Estudar instrumentos, livros, sociedades e correspondência oferece contexto mais robusto.',sentimentos:'A cultura científica valorizava demonstração e debate, mas Newton também enfrentou controvérsias e rivalidades intelectuais.',economia:'Universidade, patronato, impressão e Royal Society ajudaram a tornar o trabalho científico possível. O prestígio científico também se ligava a instituições e Estado.',hemisferio:'Norte — Inglaterra e redes científicas europeias.',fontesPrimarias:[['Stanford Encyclopedia of Philosophy — Isaac Newton','https://plato.sydney.edu.au/entries/newton/']]},
 iluminismo:{cronologia:'Século XVIII: crescimento de periódicos, enciclopédias, salões e sociedades. 1748: O Espírito das Leis, Montesquieu; 1751–1772: publicação da Encyclopédie; 1762: obras políticas de Rousseau; 1789: crise revolucionária francesa.',musicas:'Ópera, concerto público, música instrumental e música de salão refletem a expansão de públicos e mercados culturais. Não há estilo único do Iluminismo.',sentimentos:'Crítica à autoridade, confiança em razão e educação, temor de censura e debates sobre tolerância aparecem em textos e cartas; pensadores divergiam profundamente.',economia:'Mercado editorial, patronato aristocrático, academias e comércio urbano apoiaram a circulação das ideias. Censura e desigualdade limitavam acesso.',hemisferio:'Norte — Europa, com influência em debates atlânticos nas Américas.',fontesPrimarias:[['Assemblée nationale — cahiers de doléances','https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/reunion-des-etats-generaux-les-cahiers-de-doleances']]},
 revolucao_industrial:{cronologia:'Segunda metade do século XVIII: mecanização têxtil e uso crescente de carvão e vapor na Grã-Bretanha. Início do século XIX: expansão fabril e urbana; ritmos e tecnologias variaram por região.',musicas:'Canções de trabalho e baladas locais são fontes possíveis, mas precisam ser datadas e relacionadas a ocupações e comunidades concretas.',sentimentos:'Fontes registram preocupação com condições de trabalho, esperança de mobilidade, resistência a máquinas e organização coletiva, em contextos distintos.',economia:'Aumento de produção e produtividade em alguns setores, urbanização, trabalho assalariado e desigualdade. Comércio imperial e escravidão também compunham a economia atlântica.',hemisferio:'Norte — começa sobretudo na Grã-Bretanha; cadeias comerciais conectavam territórios dos dois hemisférios.',fontesPrimarias:[['Economic History Review — Italy in Renaissance economy (contexto comparativo)','https://onlinelibrary.wiley.com/doi/10.1111/ehr.12650']]},
 revolucao_francesa:{cronologia:'1788–1789: crise fiscal, colheitas e preço do pão; maio de 1789: Estados Gerais; 14 de julho: Bastilha; agosto: declaração dos direitos; 1792: república; janeiro de 1793: execução de Luís XVI; 1793–1794: Terror; 1795: Diretório; 1799: golpe de Bonaparte.',musicas:'“La Marseillaise”, composta por Claude Joseph Rouget de Lisle em 1792, foi adotada como canto revolucionário e posteriormente como hino nacional. Hinos, sátiras e cantos de rua mudaram de função ao longo das fases políticas.',sentimentos:'Esperança de direitos, fome, indignação, medo, patriotismo, rivalidade e violência política coexistiram. Mulheres, camponeses, trabalhadores urbanos, elites e populações colonizadas não viveram o processo do mesmo modo.',economia:'A dívida da monarquia, desigualdade fiscal, más colheitas e alta do pão contribuíram para a crise. Guerra e instabilidade alteraram produção, comércio e finanças durante a década.',hemisferio:'Norte — França e Europa; os conflitos revolucionários tiveram efeitos coloniais e atlânticos, inclusive no Caribe.',fontesPrimarias:[['Assemblée nationale — cahiers de doléances de 1789','https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/revolution-francaise/reunion-des-etats-generaux-les-cahiers-de-doleances'],['The National Archives UK — French Revolution','https://www.nationalarchives.gov.uk/education/teaching-resources/french-revolution/']]},
 marx:{cronologia:'1843–1848: Marx vive em Paris e Bruxelas, conhece Engels e publica trabalhos políticos. 1848: Manifesto do Partido Comunista. 1867: primeiro volume de O Capital. Passa grande parte da vida adulta em Londres, estudando no British Museum/British Library.',musicas:'Hinos e canções operárias surgiram em movimentos específicos; é necessário vincular a música a sindicatos, partidos, países e datas documentados.',sentimentos:'Indignação com desigualdade, solidariedade, conflito de classe e esperança revolucionária aparecem em textos e movimentos, mas não representam todas as pessoas trabalhadoras.',economia:'Industrialização, trabalho assalariado, crises, urbanização e movimentos operários foram centrais para as perguntas de Marx. Suas interpretações são influentes e debatidas.',hemisferio:'Norte — Prússia, França, Bélgica e Reino Unido; influência posterior global.',fontesPrimarias:[['Karl Marx House Museum / Friedrich-Ebert-Stiftung','https://www.fes.de/en/museum-karl-marx-haus/education/short-biography-of-karl-marx']]},
 darwin:{cronologia:'1831–1836: viagem no Beagle. Décadas seguintes: recolha e comparação de evidências. 1859: publicação de On the Origin of Species. A recepção científica e pública desenvolveu-se em etapas.',musicas:'Não há repertório musical específico que explique a teoria. Contexto cultural deve ser documentado separadamente.',sentimentos:'Curiosidade científica, controvérsia e conflitos de interpretação são visíveis em correspondência e imprensa; não houve reação única.',economia:'Museus, sociedades científicas, publicação e redes de naturalistas sustentaram a investigação; o império marítimo britânico facilitou viagens e coleções, com assimetrias de poder.',hemisferio:'Norte — Reino Unido; observações e espécimes coletados em diferentes regiões do mundo.',fontesPrimarias:[['Darwin Correspondence Project','https://www.darwinproject.ac.uk/']]},
 nietzsche:{cronologia:'1869: assume cátedra em Basileia. 1872: publica O Nascimento da Tragédia. 1870s–1880s: reformula suas posições, rompe intelectualmente com Wagner e publica obras cada vez mais críticas da moral e da cultura europeia.',musicas:'A relação com Wagner é documentada por escritos, amizade e ruptura; estudar a correspondência e os textos de Nietzsche é mais sólido que atribuir uma música como causa de sua filosofia.',sentimentos:'Seus escritos articulam crítica, ironia, solidão e conflito intelectual, mas não devem ser lidos como medição psicológica geral de sua época.',economia:'Universidades, editoras, imprensa e filologia profissional constituíam o ambiente material; a recepção de suas obras foi inicialmente limitada e mudou após sua morte.',hemisferio:'Norte — territórios de língua alemã e Suíça.',fontesPrimarias:[['University of Illinois Press — Nietzsche’s Philosophical Context','https://www.jstor.org/stable/10.5406/j.ctt1xcr79']]},
 freud:{cronologia:'1873: inicia estudos universitários em Viena. 1885: estuda com Charcot em Paris. 1890s: desenvolve método psicanalítico com colaboradores e pacientes. 1900: A Interpretação dos Sonhos. 1938: foge da Áustria após anexação nazista e vai para Londres.',musicas:'A cultura de cafés, ópera e música de Viena contextualiza a época, mas não prova influência causal específica. Usar cartas e documentos pessoais para ligações pontuais.',sentimentos:'Casos clínicos e escritos de Freud registram sofrimento e conflito de pacientes selecionados; não podem ser generalizados para toda a sociedade vienense.',economia:'Medicina universitária, consultório privado e publicação sustentaram o trabalho. A posição social, o antissemitismo e as barreiras profissionais afetavam as oportunidades de Freud.',hemisferio:'Norte — Viena, Paris e Londres.',fontesPrimarias:[['Library of Congress — Freud: Conflict & Culture','https://www.loc.gov/exhibits/freud/freud01.html'],['Library of Congress — Freud Papers timeline','https://www.loc.gov/collections/sigmund-freud-papers/articles-and-essays/timeline/']]},
 jung:{cronologia:'1900: inicia trabalho no Burghölzli em Zurique. 1907–1912: colaboração com Freud. Após a ruptura, desenvolve psicologia analítica; durante a década de 1910 compõe o material que viria a ser conhecido como Livro Vermelho.',musicas:'Jung estudou símbolos e mitos, mas a universalidade de interpretações simbólicas é debatida. Relações entre música e conceitos junguianos devem ser tratadas como hipóteses culturais, não como causalidade estabelecida.',sentimentos:'Seus diários e escritos refletem processo pessoal e intelectual, não uma amostra da população. O contexto inclui debates entre psiquiatria, religião, ciência e arte.',economia:'Clínicas, universidades, editoras e associações profissionais deram suporte ao campo emergente da psicologia. A consolidação institucional ocorreu ao longo do século XX.',hemisferio:'Norte — Suíça e redes europeias e internacionais.',fontesPrimarias:[['Library of Congress — The Red Book of Carl G. Jung','https://wwws.loc.gov/exhibits/red-book-of-carl-jung/overview.html'],['UCL Discovery — C. G. Jung and modern psychology','https://discovery.ucl.ac.uk/id/eprint/10109258/']]},
 currents:{
  cronologia:'1882: a estação Pearl Street, de Edison, inicia fornecimento centralizado de eletricidade em Nova York. Fim dos anos 1880–1890: sistemas de corrente alternada ganham escala; a disputa comercial envolve patentes, segurança pública e propaganda. 1893: iluminação da Exposição Mundial de Chicago fortalece a visibilidade da corrente alternada. Não foi uma guerra militar, mas uma disputa industrial e tecnológica.',
  musicas:'Não foi identificada uma canção contemporânea canônica que represente diretamente a disputa. Para o cotidiano cultural, pesquisar partituras e gravações de salão, ragtime, marchas e música popular urbana dos EUA nos anos 1880–1890; não atribuir uma música específica ao conflito sem documento de época.',
  sentimentos:'Discursos empresariais e demonstrações públicas exploraram segurança, confiança, medo de choque elétrico e promessa de modernização. Isso descreve estratégias de comunicação e controvérsia pública, não o sentimento uniforme da população.',
  economia:'Estados Unidos em rápida industrialização e urbanização: expansão de redes elétricas, iluminação comercial, transporte e mercado de equipamentos. A competição por contratos, infraestrutura, patentes e padrões técnicos era central; não há um único indicador econômico que resuma a disputa.',
  hemisferio:'Hemisfério Norte — principalmente Estados Unidos (Nova York e Chicago).',
  fontesPrimarias:[['U.S. Department of Energy — história do setor elétrico','https://www.energy.gov/oe/history-electricity'],['National Park Service — origens da energia hidrelétrica','https://www.nps.gov/articles/5-the-origins-of-hydroelectric-power.htm'],['Thomas A. Edison Papers — Rutgers University','https://edisondigital.rutgers.edu/']]
 },
 ww1:{
  cronologia:'28 jun. 1914: assassinato do arquiduque Francisco Ferdinando. Jul.–ago. 1914: crise diplomática e mobilização de alianças. 1914–1918: guerra industrial, trincheiras e bloqueios. 1917: entrada dos EUA na guerra. 11 nov. 1918: armistício; os tratados de paz e as consequências políticas se estenderam pelo pós-guerra.',
  musicas:'Exemplos documentados sobretudo no repertório britânico e norte-americano: “It’s a Long, Long Way to Tipperary” (associada à saudade e à marcha); “Keep the Home Fires Burning” (famílias e espera); “Over There” (mobilização norte-americana, 1917); “I Didn’t Raise My Boy to Be a Soldier” (pacifismo nos EUA, 1915). São perspectivas diferentes, não consenso social.',
  sentimentos:'Fontes musicais e impressos registram patriotismo, recrutamento, pacifismo, humor, saudade, luto e apoio à guerra. A posição mudou conforme país e data; os EUA foram oficialmente neutros até 1917.',
  economia:'Europa mobilizou economias para a guerra: produção militar, financiamento estatal, bloqueios, escassez e inflação em vários países. Os EUA inicialmente forneceram bens e crédito aos Aliados e entraram diretamente em 1917. A experiência econômica variou muito por país e classe.',
  hemisferio:'Principalmente Hemisfério Norte (Europa, América do Norte e Ásia). A guerra teve alcance imperial/global e participação de territórios e populações dos dois hemisférios.',
  fontesPrimarias:[['Library of Congress — coleção de partituras da Primeira Guerra','https://www.loc.gov/collections/world-war-i-sheet-music/'],['Library of Congress — canções e atitudes durante a guerra','https://www.loc.gov/collections/songs-of-america/articles-and-essays/historical-topics/world-war-i/'],['Imperial War Museums — história da Primeira Guerra','https://www.iwm.org.uk/history']]
 },
 ww2:{
  cronologia:'1939: invasão alemã da Polônia e declaração de guerra de Reino Unido e França. 1941: invasão alemã da URSS e ataque a Pearl Harbor; os EUA entram na guerra. 1942–1945: guerra total, genocídio, bombardeios e mobilização industrial. Maio de 1945: rendição alemã. Agosto–setembro de 1945: bombas atômicas, entrada soviética na guerra contra o Japão e rendição japonesa.',
  musicas:'Exemplos do repertório norte-americano documentado: “I’ll Walk Alone” (separação e espera); “When the Lights Go On Again All Over the World” (esperança de paz e fim dos apagões); “Der Führer’s Face” (sátira antinazista); arranjos swing de marchas como “American Patrol”. Outros países tiveram canções de resistência, propaganda, exílio e luto próprias.',
  sentimentos:'O repertório documenta patriotismo, humor, saudade, ansiedade, esperança de paz e mobilização. Propaganda e censura moldaram o que circulava; vítimas, ocupados, soldados e civis tiveram experiências distintas. Não reduzir o período a uma emoção coletiva.',
  economia:'Economias beligerantes converteram indústria civil em produção militar, aplicaram racionamento e controles de preços e ampliaram gastos públicos. Europa e partes da Ásia sofreram destruição de infraestrutura; o pós-guerra incluiu reconstrução e reorganização monetária e comercial.',
  hemisferio:'Guerra global nos Hemisférios Norte e Sul, com teatros centrais na Europa, Norte da África, Ásia-Pacífico e Atlântico; o peso dos combates e da destruição variou por região.',
  fontesPrimarias:[['Library of Congress — canções de guerra e conflito','https://www.loc.gov/collections/songs-of-america/articles-and-essays/historical-topics/war-and-conflict/'],['Library of Congress — National Jukebox (gravações históricas)','https://www.loc.gov/collections/national-jukebox/'],['U.S. National Archives — documentos da Segunda Guerra','https://www.archives.gov/research/military/ww2']]
 },
 coldwar:{
  cronologia:'1945–1949: tensões do pós-guerra, Doutrina Truman, Plano Marshall e formação de alianças. 1948–1949: bloqueio de Berlim e ponte aérea. 1950–1953: Guerra da Coreia. 1962: Crise dos Mísseis de Cuba. Décadas de 1960–1980: corrida armamentista, guerras por procuração, protestos e competição cultural. 1989: queda do Muro de Berlim. 1991: dissolução da URSS.',
  musicas:'Não existe repertório único da Guerra Fria. Exemplos situados: “Give Peace a Chance” (protesto pacifista, 1969); “Eve of Destruction” (Barry McGuire, 1965, ansiedade nuclear e conflito); jazz em programas de diplomacia cultural dos EUA; canções oficiais e de protesto nos países do bloco soviético. Verificar país, censura, data e circulação de cada obra.',
  sentimentos:'Registros culturais e políticos mostram medo nuclear, lealdade ideológica, esperança de distensão, protestos antiguerra, dissidência e orgulho tecnológico. A intensidade e a expressão desses sentimentos variaram entre regimes e gerações.',
  economia:'Competição entre sistemas econômicos, corrida armamentista e espacial, reconstrução europeia, ajuda externa, comércio e gastos militares. O Plano Marshall financiou recuperação da Europa Ocidental; a URSS e seus aliados seguiram outros mecanismos de planejamento e integração. Não houve uma conjuntura econômica única por 45 anos.',
  hemisferio:'Ambos os hemisférios. Os centros de poder estavam no Norte, mas conflitos, golpes, guerras por procuração e movimentos de alinhamento ocorreram também na América Latina, África e Ásia.',
  fontesPrimarias:[['U.S. Office of the Historian — Plano Marshall','https://history.state.gov/milestones/1945-1952/marshall-plan'],['Wilson Center Digital Archive — documentos da Guerra Fria','https://digitalarchive.wilsoncenter.org/'],['Library of Congress — canções políticas','https://www.loc.gov/exhibits/hope-for-america/political-songs.html']]
 },
 brazil64:{

function cFasesNaData(ano,mes,dia){
 const instante=cUtcMillis(ano,mes,dia,12,0,0), epoch=cUtcMillis(2000,0,1,12,0,0), t=(instante-epoch)/86400000;
 return {terra:cFase(t,365.2422),mercurio:cFase(t,87.969),sinodico:cFase(t,115.88),solar:cFase(t,4017),data:`${String(ano).padStart(4,'0')}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`};
}

function cCorrelacao(xs,ys){
  const n=Math.min(xs.length,ys.length); if(n<3)return null; const a=xs.slice(0,n),b=ys.slice(0,n),ma=a.reduce((s,x)=>s+x,0)/n,mb=b.reduce((s,x)=>s+x,0)/n;
  let num=0,da=0,db=0;for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;num+=x*y;da+=x*x;db+=y*y;}return da&&db?num/Math.sqrt(da*db):null;
}

pener noreferrer">NOAA SWPC — clima espacial</a> · <a href="https://ssd.jpl.nasa.gov/horizons/" target="_blank" rel="noopener noreferrer">NASA/JPL Horizons — efemérides</a>. O USGS ressalta que não é possível prever com precisão data, local e magnitude de um grande terremoto; mapas estimam risco em regiões e períodos definidos.</div></div>`;

    body=`<div class="box"><h2>VALIDAÇÃO E LIMITES</h2>${cTestesRegressaoMarco()}<ul><li>Preserve os valores brutos: campos com nomes iguais podem representar conceitos diferentes entre arquivos.</li><li>Frequência declarada em JSON não é automaticamente frequência astronômica medida.</li><li>Vetores de impacto são tratados como dados conceituais; não são coordenadas geográficas.</li><li>“Confiança” e “probability_field” importados são exibidos como metadados, não convertidos em probabilidade estatística.</li><li>Para validar ciclos: defina a hipótese antes do teste, compare com séries de controle, considere lacunas, viés de seleção e múltiplos testes.</li><li>O marco de 1.296 anos usa âncora fixa em 2012, resultando em 3308 apenas por aritmética; não foi estimado a partir de eventos e não tem capacidade preditiva demonstrada.</li><li>Expressões interpretativas como "Lei da Catástrofe" e reduções numéricas 3-6-9 podem ser exploradas como hipóteses do ecossistema, mas não são leis físicas validadas sem definição operacional, dados independentes e testes preditivos fora da amostra.</li><li>O ano galáctico do Sol é estimado em cerca de 225–250 milhões de anos; não é o ciclo hipotético de 1.296 anos. A fase orbital galáctica não é exibida porque este painel não define uma época orbital galáctica validada.</li><li>O ângulo Sol–Centro Galáctico usa fórmula solar aproximada e coordenadas fixas do Centro Galáctico; é uma estimativa de baixa precisão, não efeméride profissional nem alinhamento 3D. Cada ficha informa a data representativa usada no cálculo, que deve ser interpretada junto ao período histórico descrito.</li><li>A precessão exibida é um proxy linear de 1°/72 anos desde J2000, não a orientação completa do eixo terrestre. Para pesquisa de precisão, substituir por efemérides validadas.</li><li>O baktun usa a âncora calendárica 13.0.0.0.0 em 21/12/2012 e a divisão por 144.000 dias; isso não implica causalidade física com eventos naturais.</li><li>Se a expressão ΔM = E·sin(θ)/432 for usada no modelo: ΔM é índice adimensional de sensibilidade contextual; E derivado de Kp não é energia em MeV; θ é um ângulo Sol–Centro Galáctico aproximado; 432 é constante de referência do ecossistema. A expressão não fornece, por si só, probabilidade nem previsão validada.</li></ul></div>`;
  }
  $('v').innerHTML=`<div class="box"><h2>OBSERVATÓRIO DE CICLOS E PADRÕES</h2><p class="lead">Um observatório integrado: compare fases matemáticas, registros históricos e dados importados; use os atalhos abaixo para cruzar a leitura com as outras abas.</p><div class="aviso">O ciclo de 1.296 anos é uma hipótese do modelo, com âncora fixa em 2012 e marco matemático em 3308; não é um ciclo histórico validado nem uma previsão. Fases orbitais abaixo são aproximações matemáticas e não equivalem a alinhamentos astronômicos 3D. Os registros incorporados são exemplos transcritos do documento enviado, não os JSONs completos.</div><div class="ciclos-grid"><div><label for="cAno" class="ciclos-small">Ano de análise</label><input class="in" id="cAno" type="number" step="1" value="${year}"></div><div><label for="cCiclo" class="ciclos-small">Ciclo hipotético (anos)</label><input class="in" id="cCiclo" type="number" min="1" step="1" value="${CICLO_LONGO}" disabled><p class="ciclos-small">Mantido em 1.296 nesta versão para evitar alterar silenciosamente a hipótese.</p></div></div><div class="ciclos-file"><b>Dados incorporados no Worker + importação opcional</b><p class="ciclos-small">Os exemplos disponíveis no documento enviado já são carregados do Worker. Se você conseguir obter os JSONs completos depois, pode adicioná-los aqui; os arquivos são lidos localmente no navegador e não enviados ao servidor.</p><input id="cJson" type="file" accept=".json,application/json" multiple><div class="row"><button class="p" id="cImportar">Importar/Adicionar JSONs</button><button id="cLimpar">Limpar dados importados</button><button id="cExportar">Exportar normalizado CSV</button></div><div id="cMsg" class="ciclos-small" aria-live="polite">${CICLOS.arquivos.length?`${CICLOS.arquivos.length} arquivo(s) carregado(s).`: 'Carregando dados incorporados do Worker…'}</div></div>${kpis}<div class="ciclos-subtabs" style="margin-top:12px"><button data-cvista="visao" class="${CICLOS.vista==='visao'?'on':''}">Visão geral</button><button data-cvista="eventos" class="${CICLOS.vista==='eventos'?'on':''}">Eventos</button><button data-cvista="historico" class="${CICLOS.vista==='historico'?'on':''}">História & SOMA</button><button data-cvista="padroes" class="${CICLOS.vista==='padroes'?'on':''}">Padrões</button><button data-cvista="projecoes" class="${CICLOS.vista==='projecoes'?'on':''}">Projeções</button><button data-cvista="validacao" class="${CICLOS.vista==='validacao'?'on':''}">Validação</button></div></div>${body}<div class="box"><h2>CONTINUE A INVESTIGAÇÃO</h2><p class="ciclos-small">As abas trabalham em conjunto: contexto atual → indicadores → padrões históricos → projeção → acompanhamento.</p><div class="ciclos-conexoes"><button class="ciclos-conexao" data-main-jump="jornal"><strong>📰 Jornal</strong><span>Veja o contexto e as notícias atuais.</span></button><button class="ciclos-conexao" data-main-jump="ind"><strong>🎛️ Indicadores</strong><span>Confira os dados observados e suas fontes.</span></button><button class="ciclos-conexao" data-main-jump="proj"><strong>📈 Projeção</strong><span>Compare séries e horizontes do modelo.</span></button><button class="ciclos-conexao" data-main-jump="tend"><strong>📊 Tendência</strong><span>Observe evolução e mudanças nos dados.</span></button><button class="ciclos-conexao" data-main-jump="mapa"><strong>🗺️ Mapa</strong><span>Leve a análise para a dimensão geográfica.</span></button></div></div>`;
  $('cAno').addEventListener('change',()=>{const y=Number($('cAno').value);if(Number.isInteger(y)&&y>=-9999&&y<=9999)cRender();});
  document.querySelectorAll('[data-cvista]').forEach(b=>b.onclick=()=>{CICLOS.vista=b.dataset.cvista;cRender();});
  document.querySelectorAll('[data-main-jump]').forEach(b=>b.onclick=()=>{aba=b.dataset.mainJump;render();window.scrollTo({top:0,behavior:'smooth'});});
  const histBusca=$('cHistBusca');if(histBusca)histBusca.oninput=()=>cRenderHistorico();
  const histTipo=$('cHistTipo');if(histTipo)histTipo.onchange=()=>cRenderHistorico();
  const histHorizonte=$('cHistHorizonte');if(histHorizonte)histHorizonte.onchange=()=>{CICLOS.projecaoHistorica=Number(histHorizonte.value)||10;cRender();};

  const ep=$('cExportarProjecao');if(ep)ep.onclick=()=>{const base=cGetYear(),h=Math.max(1,Math.min(100,Number(CICLOS.projecaoHorizonte)||20)),rows=cGerarProjecoes(base,h,cDadosAgregados());const cols=['ano_projetado','fase_terrestre_pct','fase_mercurio_pct','fase_ciclo_solar_pct','baktun_calendario','dias_no_baktun','precessao_linearizada_graus','angulo_aparente_sol_centro_galactico_21dez_graus','marco_hipotetico','distancia_marco_anos','analogia_historica_1','periodo_historico_1','semelhanca_de_fase_pct_1','temas_1','dinamica_coletiva_1','analogia_historica_2','periodo_historico_2','semelhanca_de_fase_pct_2','temas_2','dinamica_coletiva_2','limite_metodologico'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[cols.join(';'),...rows.flatMap(r=>{const a=r.analogias||[];return [[r.ano,r.terra,r.mercurio,r.solar,r.baktun,r.baktunDias,r.precessao,r.anguloSolCG,r.marco,r.distancia,a[0]?.e.titulo,a[0]?.e.data,a[0]?.similaridade,a[0]?.temas,a[0]?.coletivo,a[1]?.e.titulo,a[1]?.e.data,a[1]?.similaridade,a[1]?.temas,a[1]?.coletivo,'Semelhança matemática exploratória; não é previsão nem correlação estatística.']]}).map(r=>r.map(q).join(';'))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`projecao_ciclos_${base}_${base+h}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
  $('cImportar').onclick=async()=>{const files=Array.from($('cJson').files||[]);if(!files.length){$('cMsg').textContent='Selecione pelo menos um arquivo JSON.';return;}$('cImportar').disabled=true;$('cMsg').textContent='Lendo arquivos…';try{const results=await Promise.all(files.map(f=>cLerArquivo(f,f.name)));CICLOS.arquivos=CICLOS.arquivos.filter(old=>!results.some(n=>n.nome===old.nome)).concat(results);$('cMsg').textContent=`Importados ${results.length} arquivo(s); ${CICLOS.arquivos.reduce((s,f)=>s+f.regs.length,0)} registros reconhecidos.`;cRender();}catch(e){$('cMsg').textContent=e.message;}finally{const b=$('cImportar');if(b)b.disabled=false;}};
  $('cLimpar').onclick=()=>{if(confirm('Limpar os JSONs importados nesta sessão?')){CICLOS.arquivos=[];cRender();}};
  $('cExportar').onclick=()=>{const rows=cDadosAgregados();if(!rows.length){$('cMsg').textContent='Importe dados com registros antes de exportar.';return;}const cols=['ano','titulo','origem','tipo','frequencia_declarada_bruta','unidade_frequencia_declarada','fonte','confianca'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[cols.join(';'),...rows.map(e=>[e.ano,e.titulo,e.origem,e.tipo,e.frequenciaCampo||e.frequencia,e.frequenciaUnidade,e.fonte,e.confianca].map(q).join(';'))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ciclos_normalizados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
}
