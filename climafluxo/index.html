<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ALMAFLUXO · ClimaFluxo</title>
<style>
:root{color-scheme:dark;--bg:#050d1a;--bg2:#0b2347;--p:#0a1a33;--p2:#07142a;--ln:#1b4a7a;--tx:#e8f1ff;--mu:#8fa8c8;--cy:#27c8ff;--gr:#2fd48a;--rd:#ff4d57;--am:#f0a830;--vi:#aa66ff;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0,var(--bg2),var(--bg) 60%) fixed;color:var(--tx);font:14px/1.5 var(--sans);min-height:100vh;padding:12px 12px 40px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button,.in{background:#0a1d3a;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:9px 12px}
button{cursor:pointer;font-weight:600;font-family:var(--sans)}
button:hover{border-color:var(--cy)}button[disabled]{opacity:.5;cursor:not-allowed}
button.on,button.p{background:#1f7bff;border-color:var(--cy)}
.in{width:100%;margin-bottom:8px;display:block}.in:focus{border-color:var(--cy)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--ln);padding-bottom:10px}
h1{font-family:var(--sans);font-size:20px;line-height:1.2}
h1 small{display:block;color:var(--cy);font-size:12px;font-weight:500;font-family:var(--sans);margin-top:2px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;font-family:var(--sans)}
nav button{padding:7px 11px;font-size:13px}
#v{max-width:1100px;margin:0 auto}
.box{background:linear-gradient(var(--p),var(--p2));border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin-bottom:12px;line-height:1.55}
.box h2{font-size:12px;color:var(--cy);margin-bottom:10px;letter-spacing:.8px;text-transform:uppercase;font-family:var(--sans)}
.box h2 small{color:var(--mu);text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.manchete{border-left:4px solid var(--cy);padding:10px 14px;margin:10px 0;border-radius:0 8px 8px 0;background:rgba(39,200,255,.04)}
.manchete.p10{border-color:var(--rd);background:rgba(255,77,87,.06)}
.manchete.p9,.manchete.p8{border-color:var(--am);background:rgba(240,168,48,.05)}
.manchete small{display:block;color:var(--mu);font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.manchete .t{font:700 16px/1.35 var(--serif);color:var(--tx)}
h3.principal{font:700 24px/1.25 var(--serif);margin:6px 0 10px;color:#fff}
p.lead{color:#c5d8ee;font:15px/1.65 var(--serif);margin-bottom:8px}
p.lead b{color:var(--am)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:6px}
.c{border:1px solid var(--ln);border-radius:8px;padding:10px;cursor:pointer;font-family:var(--sans);background:rgba(0,0,0,.15);transition:border-color .15s}
.c:hover{border-color:#2a6aa0}.c.on{border-color:var(--cy);background:#0f3a73}
.c .lbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .val{font-size:16px;font-weight:700;margin-top:2px;color:var(--tx)}
.bar{height:8px;border-radius:4px;background:#12335a;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;transition:width .3s}
svg.graf{display:block;width:100%;height:auto;margin-top:6px}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mu);font-family:var(--sans);margin-top:8px}
.legenda b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.linhas{border-top:1px solid var(--ln)}
.linhas > div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #0e2b4d}
.linhas span{color:var(--mu)}.linhas b{color:var(--cy);font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;word-break:break-word;background:#06101f;border:1px solid var(--ln);border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:420px;overflow:auto}
.mu{color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row.between{justify-content:space-between}
#gate{max-width:360px;margin:10vh auto}
#gate h2{font-size:16px;color:#fff;text-transform:none;letter-spacing:0;margin-bottom:6px}
#gm{color:#ffb0b6;margin-top:8px;min-height:1.2em}
.aviso{background:rgba(240,168,48,.08);border:1px solid rgba(240,168,48,.35);color:#ffd9a0;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.aviso.ruim{border-color:rgba(255,77,87,.4);background:rgba(255,77,87,.08);color:#ffb0b6}
.aviso.ok{border-color:rgba(47,212,138,.4);background:rgba(47,212,138,.08);color:#b6ffd9}

/* ─── Abas dos 12 indicadores ─── */
.ind-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ind-tab{border:1px solid var(--ln);border-radius:8px;padding:7px 10px;background:#0a1d3a;color:var(--tx);cursor:pointer;font-size:12px;font-family:var(--sans);font-weight:600;display:flex;flex-direction:column;align-items:center;min-width:86px;position:relative;overflow:hidden}
.ind-tab:hover{border-color:var(--cy)}
.ind-tab.on{background:#0f3a73;border-color:var(--cy)}
.ind-tab .em{font-size:18px}
.ind-tab .nm{font-size:10px;color:var(--mu);margin-top:2px;text-align:center;line-height:1.15}
.ind-tab .vl{font-size:11px;color:var(--cy);margin-top:2px;font-variant-numeric:tabular-nums}
.ind-tab .vr{font-size:10px;margin-top:1px;font-variant-numeric:tabular-nums}
.ind-tab .vr.pos{color:var(--gr)}.ind-tab .vr.neg{color:var(--rd)}
.ind-tab .bar-mini{position:absolute;bottom:0;left:0;right:0;height:2px;background:transparent}
.ind-tab .bar-mini i{display:block;height:100%;transition:width .3s}

/* ─── Cartão "Estado da Terra" ─── */
.terra-card{
  background:linear-gradient(135deg,#041428,#0a2242,#041428);
  border:2px solid var(--cy);border-radius:12px;padding:14px 16px;margin-bottom:12px;
  box-shadow:0 0 20px rgba(39,200,255,.15);
}
.terra-card h2{font-size:13px;color:var(--cy);letter-spacing:1.5px;margin-bottom:8px;font-family:var(--sans);text-transform:uppercase}
.terra-card .terra-fase{font-size:20px;font-weight:900;font-family:var(--sans);margin:4px 0}
.terra-card .terra-resumo{color:#c5d8ee;font-size:13px;line-height:1.6;margin-top:6px}
.terra-card .terra-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:10px}
.terra-card .terra-grid > div{background:rgba(0,0,0,.3);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;text-align:center}
.terra-card .terra-grid .lbl{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.terra-card .terra-grid .val{font-size:14px;font-weight:700;margin-top:2px;color:var(--tx)}

/* ─── Tabela consolidada ─── */
.tab-cons{width:100%;border-collapse:collapse;font-size:12px}
.tab-cons th{text-align:left;padding:6px;border-bottom:1px solid var(--ln);color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tab-cons td{padding:6px;border-bottom:1px solid #0e2b4d;vertical-align:middle}
.tab-cons tr:hover{background:rgba(39,200,255,.04)}
.tab-cons .tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px}
.tab-cons .tag-alta{background:rgba(255,77,87,.2);color:var(--rd);border:1px solid rgba(255,77,87,.4)}
.tab-cons .tag-baixa{background:rgba(39,200,255,.2);color:var(--cy);border:1px solid rgba(39,200,255,.4)}
.tab-cons .tag-neutro{background:rgba(240,168,48,.2);color:var(--am);border:1px solid rgba(240,168,48,.4)}
.tab-cons .tag-real{background:rgba(47,212,138,.2);color:var(--gr);border:1px solid rgba(47,212,138,.4)}
.tab-cons .tag-sim{background:rgba(143,168,200,.2);color:var(--mu);border:1px solid rgba(143,168,200,.4)}

/* ─── Guia ─── */
.guia{background:rgba(170,102,255,.06);border-left:3px solid var(--vi);border-radius:0 6px 6px 0;padding:8px 12px;margin-top:8px;font-size:12px;color:#d8ccff;line-height:1.5}
.guia b{color:var(--vi)}

@media(max-width:600px){body{padding:10px 10px 30px}h3.principal{font-size:20px}header{gap:8px}nav{width:100%;margin-left:0}nav button{flex:1}.box table{font-size:11px}.box table th,.box table td{padding:4px !important}.ind-tab{min-width:72px}}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div id="gate" class="box" role="form" aria-labelledby="gtit">
  <h2 id="gtit">Entre no ClimaFluxo</h2>
  <p class="mu" style="margin-bottom:8px">Ferramenta gratuita. Use a mesma conta do ALMAFLUXO.</p>
  <input class="in" id="ge" type="email" placeholder="E-mail" autocomplete="email">
  <input class="in" id="gs" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="p" id="gl" style="width:100%;margin-bottom:6px">Entrar</button>
  <button id="gc" style="width:100%">Criar conta no ALMAFLUXO</button>
  <p id="gm" role="status" aria-live="polite"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>ALMAFLUXO<small>ClimaFluxo · 12 indicadores climáticos</small></h1>
    <nav id="nav" role="tablist" aria-label="Seções"></nav>
  </header>
  <div id="v" role="region" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';

const WK = 'https://almafluxo.uk';
const LS_USER = 'almafluxo_usuario';
const LS_CIDADE = 'clima_cidade';
const LS_ONI = 'clima_oni';
const LS_IND = 'clima_indicador';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));

/* ═══════════════════════════════════════════════════════════════
   12 INDICADORES — com direção, guia e unidade
   ═══════════════════════════════════════════════════════════════ */
const INDICADORES = [
  { id:'sismos',      emoji:'🌍', nome:'SISMOS',           unid:'Mag',    dec:1, dir:'subir',  guia:'Cada ponto é um terremoto ≥4,5 da USGS (últimos 7 dias). Aumento = atividade sísmica subindo.' },
  { id:'tempGlobal',  emoji:'🌡️', nome:'TEMP.GLOBAL',      unid:'°C',     dec:2, dir:'subir',  guia:'Anomalia de temperatura global (base 1970). Aumento = aquecimento. Fonte: HadCRUT/OWID.' },
  { id:'solar',       emoji:'☀️', nome:'SOLAR',            unid:'Fluxo',  dec:0, dir:'subir',  guia:'Fluxo solar 10,7 cm (NOAA SWPC). Aumento = mais atividade solar. Máximo solar ~200.' },
  { id:'furacao',     emoji:'🌀', nome:'FURAÇÕES',         unid:'Cat',    dec:1, dir:'subir',  guia:'Categoria Saffir-Simpson. Aumento = furacões mais intensos no momento.' },
  { id:'chuva',       emoji:'🌧️', nome:'CHUVAS',           unid:'mm',     dec:1, dir:'subir',  guia:'Precipitação acumulada. Aumento = mais chuva. Modelo interno baseado em ENSO.' },
  { id:'seca',        emoji:'🏜️', nome:'SECAS',            unid:'índice', dec:2, dir:'subir',  guia:'Índice 0–1. Aumento = seca mais severa. Modelo interno baseado em ENSO.' },
  { id:'vulcao',      emoji:'🌋', nome:'VULCÕES',          unid:'VEI',    dec:1, dir:'subir',  guia:'Índice de Explosividade Vulcânica. Aumento = erupções mais fortes. Modelo interno.' },
  { id:'mares',       emoji:'🌊', nome:'MARÉS',            unid:'m',      dec:2, dir:'subir',  guia:'Nível do mar (Tide Gauge). Aumento = maré mais alta. Modelo interno.' },
  { id:'elnino',      emoji:'🌊', nome:'EL NIÑO/LA NIÑA',  unid:'°C',     dec:2, dir:'bipolar',guia:'ONI: positivo = El Niño (aquecimento); negativo = La Niña (resfriamento). Fonte: NOAA CPC.' },
  { id:'geomagnetic', emoji:'🧲', nome:'CAMPO MAGNÉTICO',  unid:'Kp',     dec:1, dir:'subir',  guia:'Índice Kp 0–9. Aumento = tempestade geomagnética. Fonte: NOAA SWPC.' },
  { id:'corrente',    emoji:'🌊', nome:'CORRENTES OCEÂNICAS', unid:'índice', dec:2, dir:'bipolar', guia:'Índice PDO (Oscilação Decadal do Pacífico). Positivo = Pacífico quente; negativo = frio.' },
  { id:'mundo',       emoji:'🌍', nome:'MUNDO',            unid:'índice', dec:3, dir:'bipolar', guia:'Agregado dos 11 indicadores acima. 0 = tudo calmo; 1 = tudo em alerta. Visão integrada.' },
];

let U = null;
let aba = 'jornal';
let oniSim = null;
let cont = 'GLOBAL';
let PER = '7d';
let MET = 'chuva';
let JORNAL = null, ANALISE = null, MAPA = null, PROJ = null, PV = null, SELJ = 0;
let indAtual = 'sismos';
let indDados = {};        // cache: id -> payload
let indLoading = {};      // id -> booleano
let indPromises = {};     // id -> promise em andamento (evita race)
const LS_USER_FALLBACK = JSON.parse(localStorage.getItem(LS_USER) || 'null');

const ABAS = [
  ['jornal', '📰 Jornal'],
  ['mundo',  '🌍 Mundo'],
  ['ind',    '🎛️ Indicadores'],
  ['mapa',   '🗺️ Mapa'],
  ['proj',   '📈 Projeção'],
  ['tend',   '📊 Tendência'],
  ['atend',  '💬 Atendimento'],
];

/* ── API ── */
const post = (p, b) => fetch(WK + p, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(b || {}),
}).then(r => r.json());

async function api(rota, corpo) {
  if (!U || !U.sessionToken) { sair(); throw new Error('Entre na sua conta.'); }
  const j = await post('/api/clima/' + rota, Object.assign({
    email: U.email, sessionToken: U.sessionToken,
  }, corpo || {}));
  if (!j || typeof j !== 'object') throw new Error('Resposta inválida.');
  if (!j.ok && /entre|sess(ã|a)o|expir/i.test(j.error || '')) {
    sair(); throw new Error(j.error);
  }
  return j;
}

/* ── Sessão ── */
function carregarSessao() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_USER) || 'null');
    if (s && s.email && s.sessionToken) { U = s; return true; }
  } catch (e) {}
  U = null;
  return false;
}
function sair() {
  U = null;
  try { localStorage.removeItem(LS_USER); } catch (e) {}
  $('app').hidden = true;
  $('gate').hidden = false;
}
async function login(email, senha) {
  $('gm').textContent = '';
  email = String(email || '').trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $('gm').textContent = 'Digite um e-mail válido.'; return; }
  if (!senha) { $('gm').textContent = 'Digite a senha.'; return; }
  $('gl').disabled = true;
  $('gl').textContent = 'Entrando…';
  try {
    const d = await post('/proxy/central', { action: 'login', email, senha });
    const u = d.usuario || d;
    const tk = d.token || d.sessionToken || u.sessionToken;
    const ok = d && (d.ok === true || d.autenticado === true || d.status === 'success');
    if (!ok || !tk) throw new Error(d.error || d.message || 'E-mail ou senha incorretos.');
    U = { nome: u.nome || email.split('@')[0], email, sessionToken: tk, master: !!(d.master || u.master) };
    try { localStorage.setItem(LS_USER, JSON.stringify(U)); } catch (e) {}
    iniciar();
  } catch (e) {
    $('gm').textContent = e.message || 'Não foi possível entrar.';
  } finally {
    $('gl').disabled = false;
    $('gl').textContent = 'Entrar';
  }
}

/* ── Navegação ── */
function iniciar() {
  if (!U || !U.sessionToken) { $('gate').hidden = false; $('app').hidden = true; return; }
  $('gate').hidden = true;
  $('app').hidden = false;
  $('nav').innerHTML = ABAS.map(([k, l]) =>
    `<button role="tab" data-a="${k}" aria-selected="false">${l}</button>`
  ).join('') + '<button id="sx" title="Sair">Sair</button>';
  $('nav').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'sx') { if (confirm('Sair do ClimaFluxo?')) sair(); return; }
    aba = b.dataset.a;
    if (aba === 'jornal') JORNAL = null;
    if (aba === 'mundo') ANALISE = null;
    if (aba === 'proj') { PROJ = null; PV = null; SELJ = 0; }
    if (aba === 'mapa') MAPA = null;
    render();
  };
  const savedOni = parseFloat(localStorage.getItem(LS_ONI));
  if (isFinite(savedOni)) oniSim = savedOni;
  const savedInd = localStorage.getItem(LS_IND);
  if (savedInd && INDICADORES.some(i => i.id === savedInd)) indAtual = savedInd;
  render();
}

function render() {
  document.querySelectorAll('#nav button[data-a]').forEach(b => {
    const on = b.dataset.a === aba;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  if (aba === 'mapa') MAPA = null;
  const fn = {
    jornal: vJornal,
    mundo:  vMundo,
    ind:    vIndicadores,
    mapa:   vMapa,
    proj:   vProj,
    tend:   vTend,
    atend:  vAtend,
  }[aba];
  if (fn) fn();
}

/* ═══════════════════════════════════════════════════════════════
   SEÇÃO · INDICADORES — 12 indicadores + Estado da Terra
   ═══════════════════════════════════════════════════════════════ */
function vIndicadores() {
  $('v').innerHTML = `
    <div id="terraBox"></div>
    <div class="box">
      <h2>INDICADORES CLIMÁTICOS <small>12 leituras assíncronas</small></h2>
      <p class="lead">
        Cada indicador é consultado de forma assíncrona no worker. O retorno traz:
        <b>último valor</b>, <b>série histórica</b>, <b>análise de entropia</b>,
        <b>projeções temporais</b> (dia/semana/mês/ano) e <b>confiança</b>
        (🟢 real vs 🔵 modelo).
      </p>
      <div class="ind-tabs" id="indTabs">
        ${INDICADORES.map(ind => `
          <button class="ind-tab${ind.id === indAtual ? ' on' : ''}" data-ind="${ind.id}">
            <span class="em">${ind.emoji}</span>
            <span class="nm">${ind.nome}</span>
            <span class="vl" id="indVal_${ind.id}">—</span>
            <span class="vr" id="indVar_${ind.id}">—</span>
            <span class="bar-mini"><i id="indBar_${ind.id}" style="width:0%"></i></span>
          </button>
        `).join('')}
      </div>
      <div class="row">
        <button class="p" id="indRecarregar">↻ Recarregar todos</button>
        <span class="mu" id="indStatus">—</span>
      </div>
    </div>
    <div id="indDetalhe"></div>
    <div id="indTabela"></div>
  `;
  document.querySelectorAll('.ind-tab').forEach(btn => {
    btn.onclick = () => {
      indAtual = btn.dataset.ind;
      localStorage.setItem(LS_IND, indAtual);
      document.querySelectorAll('.ind-tab').forEach(b => b.classList.toggle('on', b === btn));
      renderIndicador(indAtual);
    };
  });
  $('indRecarregar').onclick = () => {
    indDados = {}; indPromises = {};
    carregarTodosIndicadores();
  };
  carregarTodosIndicadores();
  if (indDados[indAtual]) renderIndicador(indAtual);
  const alvo = indAtual;
  carregarIndicador(alvo).then(() => {
    if (aba === 'ind' && indAtual === alvo) renderIndicador(alvo);
  });
}

async function carregarTodosIndicadores() {
  const statusEl = $('indStatus');
  if (statusEl) statusEl.textContent = 'Carregando 12 indicadores…';
  await Promise.all(INDICADORES.map(ind => carregarIndicador(ind.id, true)));
  if (statusEl) statusEl.textContent = '✓ ' + INDICADORES.length + ' indicadores carregados';
  atualizarEstadoDaTerra();
  renderTabelaConsolidada();
}

async function carregarIndicador(id, silencioso) {
  if (indDados[id] && !silencioso) return indDados[id];
  if (indPromises[id]) return indPromises[id];
  indLoading[id] = true;
  indPromises[id] = (async () => {
    try {
      const j = await api('indicador', { tipo: id, oni: oniSim });
      if (j.ok) {
        indDados[id] = j;
        atualizarCardIndicador(id, j);
        if (id === indAtual && aba === 'ind') renderIndicador(id);
        return j;
      } else if (!silencioso) {
        $('indDetalhe').innerHTML = `<div class="box aviso ruim">${esc(j.error || 'Falha ao carregar indicador.')}</div>`;
      }
    } catch (e) {
      if (!silencioso) {
        $('indDetalhe').innerHTML = `<div class="box aviso ruim">${esc(e.message || 'Falha.')}</div>`;
      }
    } finally {
      indLoading[id] = false;
      delete indPromises[id];
      if (aba === 'ind') {
        atualizarEstadoDaTerra();
        renderTabelaConsolidada();
      }
    }
  })();
  return indPromises[id];
}

function atualizarCardIndicador(id, j) {
  const ind = INDICADORES.find(i => i.id === id);
  if (!ind) return;
  const elV = $('indVal_' + id), elR = $('indVar_' + id), elB = $('indBar_' + id);
  if (elV && j.serie && j.serie.length) {
    const last = j.serie[j.serie.length - 1];
    elV.textContent = Number(last.c).toFixed(ind.dec) + ' ' + ind.unid;
  }
  if (elR) {
    if (j.variacao != null) {
      elR.textContent = (j.variacao >= 0 ? '+' : '') + j.variacao.toFixed(2) + '%';
      elR.className = 'vr ' + (j.variacao >= 0 ? 'pos' : 'neg');
    } else {
      elR.textContent = '—';
    }
  }
  if (elB) {
    // barra mini proporcional à magnitude normalizada
    const v = j.serie && j.serie.length ? Number(j.serie[j.serie.length - 1].c) : 0;
    const alt = j.analise && j.analise.probSubida != null ? j.analise.probSubida : 0.5;
    elB.style.width = Math.round(alt * 100) + '%';
    elB.style.background = alt > 0.6 ? 'var(--gr)' : alt < 0.4 ? 'var(--rd)' : 'var(--am)';
  }
}

/* ─── Estado da Terra (agregado dos 12) ─── */
function atualizarEstadoDaTerra() {
  const box = $('terraBox');
  if (!box) return;
  const carregados = INDICADORES.map(ind => ({ ind, j: indDados[ind.id] })).filter(x => x.j);
  if (!carregados.length) {
    box.innerHTML = `<div class="terra-card"><h2>🌍 ESTADO DA TERRA</h2><p class="mu">Aguardando dados dos indicadores…</p></div>`;
    return;
  }
  // Média das probSubida dos indicadores "subir"
  let somaProb = 0, nProb = 0, nAlerta = 0, nOk = 0;
  let entropiaMedia = 0, nEntropia = 0, ipcMedio = 0, nIpc = 0;
  const alertas = [];
  carregados.forEach(({ ind, j }) => {
    const a = j.analise || {};
    if (a.probSubida != null) { somaProb += a.probSubida; nProb++; }
    if (a.entropia != null) { entropiaMedia += a.entropia; nEntropia++; }
    if (a.ipc != null) { ipcMedio += a.ipc; nIpc++; }
    const p = a.probSubida || 0.5;
    const v = j.serie && j.serie.length ? Number(j.serie[j.serie.length - 1].c) : 0;
    const alerta = (ind.dir === 'subir' && p > 0.65) ||
                   (ind.dir === 'subir' && j.variacao != null && j.variacao > 15);
    if (alerta) { nAlerta++; alertas.push(`${ind.emoji} ${ind.nome} (${Number(v).toFixed(ind.dec)} ${ind.unid})`); }
    else nOk++;
  });
  const probMedia = nProb ? somaProb / nProb : 0.5;
  const entropia = nEntropia ? entropiaMedia / nEntropia : 0;
  const ipc = nIpc ? ipcMedio / nIpc : 0;
  const fase = entropia > 0.7 ? 'CAOS CRIATIVO' : entropia > 0.5 ? 'OSCILAÇÃO' : entropia > 0.3 ? 'ORDEM' : 'ESTABILIDADE';
  const cor = entropia > 0.7 ? 'var(--rd)' : entropia > 0.5 ? 'var(--am)' : entropia > 0.3 ? 'var(--cy)' : 'var(--gr)';
  const resumo = nAlerta === 0
    ? 'Nenhum indicador em alerta. Sistema em equilíbrio.'
    : nAlerta === 1
      ? `1 indicador em alerta: ${alertas[0]}.`
      : `${nAlerta} indicadores em alerta: ${alertas.slice(0, 4).join(' · ')}${alertas.length > 4 ? '…' : ''}.`;

  box.innerHTML = `
    <div class="terra-card">
      <h2>🌍 ESTADO ATUAL DA TERRA <small class="mu" style="margin-left:8px">agregado de ${carregados.length}/${INDICADORES.length} indicadores</small></h2>
      <div class="terra-fase" style="color:${cor}">${esc(fase)}</div>
      <div class="terra-resumo">${esc(resumo)}</div>
      <div class="terra-grid">
        <div><div class="lbl">Entropia média</div><div class="val" style="color:${cor}">${entropia.toFixed(3)}</div></div>
        <div><div class="lbl">IPC médio</div><div class="val" style="color:var(--cy)">${ipc.toFixed(3)}</div></div>
        <div><div class="lbl">Prob. subida</div><div class="val" style="color:${probMedia>0.6?'var(--gr)':probMedia<0.4?'var(--rd)':'var(--am)'}">${Math.round(probMedia*100)}%</div></div>
        <div><div class="lbl">Alertas</div><div class="val" style="color:${nAlerta>0?'var(--rd)':'var(--gr)'}">${nAlerta}</div></div>
        <div><div class="lbl">Em equilíbrio</div><div class="val" style="color:var(--gr)">${nOk}</div></div>
        <div><div class="lbl">Total</div><div class="val">${carregados.length}</div></div>
      </div>
      <div class="guia">
        <b>Como ler:</b> A <b>entropia</b> mede a desorganização do sistema (0 = calmo, 1 = caótico).
        <b>IPC</b> mede a pressão (0 = neutro, alto = ponto de ruptura).
        <b>Prob. subida</b> é a média da probabilidade de subida dos 12 indicadores.
      </div>
    </div>
  `;
}

    const diaTxt = dia.alta != null ? `${Number(dia.alta).toFixed(ind.dec)} / ${Number(dia.baixa).toFixed(ind.dec)}` : '—';

/* ─── Detalhe individual ─── */
function renderIndicador(id) {
  const ind = INDICADORES.find(i => i.id === id);
  if (!ind) return;
  const j = indDados[id];
  if (!j) {
    $('indDetalhe').innerHTML = `<div class="box"><span class="mu">Carregando ${ind.nome}…</span></div>`;
    carregarIndicador(id).then(() => {
      if (aba === 'ind' && indAtual === id) renderIndicador(id);
    });
    return;
  }
  const serie = j.serie || [];
  const analise = j.analise || {};
  const proj = j.projecao || {};
  const corr = j.correlacoes || {};
  const ultimo = serie.length ? serie[serie.length - 1] : null;
  const anterior = serie.length > 1 ? serie[serie.length - 2] : ultimo;
  const varPct = anterior && anterior.c ? ((ultimo.c - anterior.c) / Math.abs(anterior.c)) * 100 : 0;
  const confianca = j.confianca || 'baixa';
  const confCor = confianca === 'alta' ? 'var(--gr)' : confianca === 'baixa' ? 'var(--rd)' : 'var(--am)';
  const confTxt = confianca === 'alta' ? '🟢 REAL' : confianca === 'baixa' ? '🔴 SIMULADO' : '🟡 MISTO';

  let html = `<div class="box">
    <h2>${ind.emoji} ${ind.nome} <small>${esc(j.fonte || '')} · ${esc(j.periodo || '')} · ${confTxt}</small></h2>
    <p class="lead">
      Último valor: <b style="color:var(--cy)">${ultimo ? Number(ultimo.c).toFixed(ind.dec) : '—'} ${ind.unid}</b>
      ${varPct ? `· variação ${varPct >= 0 ? '+' : ''}${varPct.toFixed(2)}%` : ''}
    </p>
    ${j.nota ? `<p class="mu" style="font-size:12px;margin-top:4px">${esc(j.nota)}</p>` : ''}
    <div class="guia">
      <b>📖 Como ler:</b> ${esc(ind.guia)}
    </div>
    <div class="linhas" style="margin-top:10px">
      <div><span>Série</span><b>${serie.length} pontos</b></div>
      <div><span>Fase</span><b>${esc(analise.fase || '—')}</b></div>
      <div><span>Entropia (H)</span><b>${analise.entropia != null ? Number(analise.entropia).toFixed(3) : '—'}</b></div>
      <div><span>IPC (pressão)</span><b>${analise.ipc != null ? Number(analise.ipc).toFixed(3) : '—'}</b></div>
      <div><span>Margem φ</span><b>${analise.margem != null ? Number(analise.margem).toFixed(4) : '—'}</b></div>
      <div><span>Prob. subida</span><b>${analise.probSubida != null ? Math.round(analise.probSubida * 100) + '%' : '—'}</b></div>
      <div><span>Prob. descida</span><b>${analise.probDescida != null ? Math.round(analise.probDescida * 100) + '%' : '—'}</b></div>
      <div><span>Força</span><b>${esc(analise.forca || '—')}</b></div>
      <div><span>Confiança</span><b style="color:${confCor}">${confTxt}</b></div>

  if (proj && Object.keys(proj).length) {
    html += `<div class="box">
      <h2>PROJEÇÕES TEMPORAIS <small>dia · semana · mês · ano</small></h2>
      <div class="g">
        ${['dia','semana','mes','ano'].map(p => {
          const d = proj[p];
          if (!d) return `<div class="c" style="cursor:default"><div class="lbl">${p}</div><div class="val">—</div></div>`;
          return `<div class="c" style="cursor:default">
            <div class="lbl">${p}</div>
            <div class="val" style="color:var(--gr)">▲ ${Number(d.alta).toFixed(ind.dec)}</div>
            <div class="val" style="color:var(--rd);font-size:13px">▼ ${Number(d.baixa).toFixed(ind.dec)}</div>
            <div class="mu" style="font-size:11px;margin-top:2px">prob. alta ${Math.round((d.probAlta||0)*100)}%</div>

  if (corr && Object.keys(corr).length) {
    html += `<div class="box">
      <h2>CORRELAÇÕES (Pearson) <small>com outros indicadores</small></h2>

          const [a, b] = k.split('_x_');
          const cor = Math.abs(v) > 0.7 ? 'var(--rd)' : Math.abs(v) > 0.4 ? 'var(--am)' : 'var(--mu)';
          return `<div><span>${esc(a)} × ${esc(b)}</span><b style="color:${cor}">${Number(v).toFixed(3)}</b></div>`;

    html += `<div class="box">

      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr>

              <td style="text-align:right;padding:4px 5px;border-bottom:1px solid #0e2b4d;color:${v>=0?'var(--gr)':'var(--rd)'}">${v?((v>=0?'+':'')+v.toFixed(2)+'%'):'—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }

  $('indDetalhe').innerHTML = html;
}

function graficoSérie(serie, ind) {
  if (!serie || serie.length < 2) return '';
  const vals = serie.map(p => Number(p.c));
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const W = 700, H = 180, L = 40, R = 12, T = 16, B = 28;
  const x = i => L + (W - L - R) * i / (serie.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - minV) / range);
  const pts = serie.map((p, i) => `${x(i)},${y(Number(p.c))}`).join(' ');
  const cor = '#27c8ff';
  let s = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Série ${ind.nome}">`;
  for (let k = 0; k <= 4; k++) {
    const yy = T + (H - T - B) * k / 4;
    const val = (maxV - range * k / 4).toFixed(ind.dec);
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#12335a"/>`;
    s += `<text x="2" y="${yy + 4}" fill="#8fa8c8" font-size="9">${val}</text>`;
  }
  const step = Math.max(1, Math.ceil(serie.length / 8));
  serie.forEach((p, i) => {
    if (i % step === 0 || i === serie.length - 1) {
      s += `<text x="${x(i)}" y="${H - 8}" fill="#8fa8c8" font-size="9" text-anchor="middle">${esc(String(p.data || '').slice(-5))}</text>`;
    }
  });
  s += `<polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2"/>`;
  serie.forEach((p, i) => {
    s += `<circle cx="${x(i)}" cy="${y(Number(p.c))}" r="2" fill="${cor}"/>`;
  });
  s += `</svg>`;
  return s;
}

/* ══════════════════════════════════════════════════════

function vJornal() {

      </p>
      <input class="in" id="jc" placeholder="Cidade para destaque local (ex.: Rio de Janeiro)" value="${esc(cidade)}">
      <div class="row">
        <button class="p" id="jg">Atualizar jornal</button>
        <button id="jt">Ver tendência histórica</button>

      </div>
    </div>

  `;
  $('jg').onclick = gerarJornal;

async function gerarJornal() {
  const cidade = ($('jc').value || '').trim();
  if (!cidade) { $('jr').innerHTML = '<div class="box aviso">Informe uma cidade para gerar a edição do dia.</div>'; return; }
  localStorage.setItem(LS_CIDADE, cidade);
  $('jr').innerHTML = '<div class="box"><span class="mu">Consultando fontes…</span></div>';
  try {
    const j = await api('jornal', { cidade, oni: oniSim, periodo: PER });
    if (j.ok) { JORNAL = j; renderJornal(j); return; }
  } catch (e) {}
  try {
    const [an, pv, pj] = await Promise.all([
      api('analise', { oni: oniSim }).catch(() => null),
      api('previsao', { cidade }).catch(() => null),
      api('projecao', { cidade, periodo: PER }).catch(() => null),
    ]);
    if (!an && !pv) throw new Error('Não foi possível consultar as fontes.');
    JORNAL = montarJornalFallback(an, pv, pj);
    renderJornal(JORNAL);
  } catch (e) {
    $('jr').innerHTML = `<div class="box aviso ruim">${esc(e.message || 'Falha ao gerar o jornal.')}</div>`;
  }
}

function montarJornalFallback(an, pv, pj) {
  const fase = an ? an.oni.fase : 'Indisponível';
  const oni = an ? an.oni.valor : 0;
  const manchetes = [];
  if (an) {
    if (fase === 'El Niño') manchetes.push({ titulo: `El Niño (ONI ${oni}) intensifica calor e chuva irregular`, prioridade: 9 });
    else if (fase === 'La Niña') manchetes.push({ titulo: `La Niña (ONI ${oni}) esfria o Pacífico e muda o regime de chuvas`, prioridade: 9 });
    else manchetes.push({ titulo: `Fase neutra (ONI ${oni}): padrão climático sem forçante dominante`, prioridade: 6 });
  }
  if (pv) manchetes.push({ titulo: `${pv.local}: agora ${pv.atual.temp}°C, vento ${pv.atual.ventoKmh} km/h, umidade ${pv.atual.umidade}%`, prioridade: 7 });
  if (pj && pj.ok) {
    const m = (pj.marcas || [])[0];
    if (m) manchetes.push({ titulo: `${m.icone} ${m.rot} em ${m.ini.replace('T', ' ')} (${Math.round(m.p * 100)}% dos modelos)`, prioridade: m.p >= 0.6 ? 9 : 7 });
  }
  manchetes.sort((a, b) => b.prioridade - a.prioridade);
  const corpo = [];
  if (an) corpo.push(`A fase ${fase} (ONI ${oni}) organiza o padrão global de chuvas e temperatura.`);
  if (pv) corpo.push(`Em ${pv.local}, os próximos dias trazem ${pv.dias.map(d => `${d.min}–${d.max}°C com ${d.chuvaProb}% de chuva`).slice(0, 3).join('; ')}.`);
  if (pj && pj.ok) corpo.push(`Resumo da projeção ${pj.periodo}: ${pj.resumo}`);
  corpo.push('Aviso: probabilidades são guia, não garantia. Consulte o serviço meteorológico local para decisões críticas.');
  return {
    jornal: { manchetes, corpo, fase, oni, entropia: an ? an.continentes.GLOBAL.entropia : null, ipc: an ? an.continentes.GLOBAL.ipc : null },
    local: pv ? pv.local : null,
    continente: pv ? pv.continente : null,
    indicadores: null, tendencia: null,
    projecao: pj && pj.ok ? { resumo: pj.resumo, marcas: pj.marcas, janelas: pj.janelas } : null,
    fallback: true,
  };
}

function renderJornal(j) {
  const J = j.jornal || {};
  const ind = j.indicadores;
  const ten = j.tendencia;
  const pj = j.projecao;
  const fase = J.fase || '—';
  const faseCor = fase === 'El Niño' ? 'var(--rd)' : fase === 'La Niña' ? 'var(--cy)' : 'var(--am)';
  let html = '';

  html += `<div class="box">

    <p class="lead"><b style="color:${faseCor}">${esc(fase)}</b> · ONI ${J.oni != null ? J.oni : '—'}
    ${J.entropia != null ? `· entropia ${Number(J.entropia).toFixed(2)}` : ''}
    ${J.ipc != null ? `· IPC ${Number(J.ipc).toFixed(2)}` : ''}</p>
    ${J.manchetes && J.manchetes[0] ? `<h3 class="principal">${esc(J.manchetes[0].titulo)}</h3>` : ''}
    ${Array.isArray(J.corpo) ? `<p class="lead">${J.corpo.map(p => esc(p)).join(' ')}</p>` : ''}
  </div>`;
  if (J.manchetes && J.manchetes.length > 1) {
    html += `<div class="box"><h2>OUTRAS MANCHETES</h2>`;
    J.manchetes.slice(1, 8).forEach(m => {
      const cls = 'manchete' + (m.prioridade >= 10 ? ' p10' : m.prioridade >= 8 ? ' p9' : '');
      html += `<div class="${cls}"><small>prioridade ${m.prioridade}</small><div class="t">${esc(m.titulo)}</div></div>`;
    });
    html += `</div>`;
  }
  if (ind) {
    html += `<div class="box"><h2>INDICADORES HUMANOS <small>${esc(ind.pais)}</small></h2><div class="g">`
      + cartaoInd('População estimada', fmtNum(ind.populacao_estimada) + ' hab')
      + cartaoInd('Energia por pessoa', fmtNum(ind.energia_kwh_pessoa) + ' kWh/ano')
      + cartaoInd('Consumo local', ind.consumo_local_TWh + ' TWh/ano')
      + cartaoInd('Construção', ind.construcao_pct + '% da área')
      + cartaoInd('Fertilidade do solo', ind.fertilidade_indice + '/100')
      + cartaoInd('CO₂', Number(ind.co2_ton_pessoa).toFixed(1) + ' t/pessoa/ano')
      + cartaoInd('Área agrícola', ind.area_agricola_Mha + ' Mha')
      + `</div></div>`;
  }
  if (ten) {
    html += `<div class="box"><h2>TENDÊNCIA HISTÓRICA <small>${esc(ten.periodo || '')}</small></h2>
      <div class="legenda">
        <span><b style="background:var(--cy)"></b>Temperatura (°C)</span>
        <span><b style="background:var(--am)"></b>CO₂ (ppm)</span>
        <span><b style="background:var(--rd)"></b>Fertilidade (índice)</span>
      </div>
      ${graficoTendencia(j.historico || (ten && ten.historico) || null)}
    </div>`;
  }
  if (pj && pj.janelas) {
    html += `<div class="box"><h2>PROJEÇÃO · ${esc(PER)} <small>${esc(j.local || '')}</small></h2>
      <p class="lead">${esc(pj.resumo || '')}</p>
      <div class="legenda">`;
    (pj.marcas || []).slice(0, 6).forEach(m => {
      html += `<span>${m.icone} ${esc(m.rot)} (${Math.round(m.p * 100)}%)</span>`;
    });
    html += `</div></div>`;
  }
  $('jr').innerHTML = html;
}

function cartaoInd(rot, val) {
  return `<div class="c"><div class="lbl">${esc(rot)}</div><div class="val">${esc(val)}</div></div>`;
}
function fmtNum(v) {
  const n = Number(v);
  if (!isFinite(n)) return '—';
  return n.toLocaleString('pt-BR');
}

/* ══════════════════════════════════════════════════════
   SEÇÃO · MUNDO (preservada)
   ══════════════════════════════════════════════════════ */
async function vMundo() {
  $('v').innerHTML = '<div class="box"><span class="mu">Carregando análise…</span></div>';
  try { ANALISE = await api('analise', { oni: oniSim }); }
  catch (e) { $('v').innerHTML = `<div class="box aviso ruim">${esc(e.message || 'Falha.')}</div>`; return; }
  if (!ANALISE || ANALISE.ok !== true) {
    $('v').innerHTML = `<div class="box aviso ruim">${esc((ANALISE && ANALISE.error) || 'Análise indisponível.')}</div>`;
    return;
  }
  const A = ANALISE, o = A.oni || {}, C = A.continentes || {};
  const nomes = Object.keys(C);
  const d = C[cont] || C.GLOBAL;
  if (!d) { $('v').innerHTML = '<div class="box aviso">Continente indisponível.</div>'; return; }
  const nN = (v, fb) => (typeof v === 'number' && isFinite(v)) ? v : (fb == null ? 0 : fb);
  const faseCor = o.fase === 'El Niño' ? 'var(--rd)' : o.fase === 'La Niña' ? 'var(--cy)' : 'var(--am)';
  $('v').innerHTML = `
    <div class="box">
      <h2>ENSO · ONI <span style="color:${faseCor}">${o.valor}</span> (${esc(o.fase)})</h2>
      <small>${esc(o.periodo)} · ${esc(o.fonte)}${o.simulado ? ' · <b style="color:var(--am)">simulado</b>' : ''}</small>
      <div class="row" style="margin-top:10px">
        <input id="os" type="range" min="-3" max="3" step="0.1" value="${o.valor}" style="flex:1;min-width:200px;background:transparent;border:none" aria-label="Simular ONI">
        <button id="or">Restaurar real</button>
      </div>
    </div>
    <div class="box">
      <h2>CONTINENTES <small>tendência de alta</small></h2>
      <div class="g">
        ${nomes.map(n => {
          const x = C[n] || {};
          const probAlta = nN(x.probAlta, 50);
          const cor = probAlta >= 55 ? 'var(--rd)' : probAlta <= 45 ? 'var(--cy)' : 'var(--am)';
          return `<div class="c${n === cont ? ' on' : ''}" data-n="${esc(n)}" role="button" tabindex="0">
            <div class="lbl">${esc(n)}</div>
            <div class="val">${probAlta}%</div>
            <div class="mu" style="font-size:11px;margin-top:2px">${nN(x.t, 20).toFixed(1)}°C · H ${nN(x.entropia, 0).toFixed(2)}</div>
            <div class="bar"><i style="width:${probAlta}%;background:${cor}"></i></div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="box">
      <h2>${esc(cont)}</h2>
      <div class="linhas">
        <div><span>Temperatura-base</span><b>${nN(d.t, 20).toFixed(1)} °C</b></div>
        <div><span>Entropia</span><b>${nN(d.entropia, 0).toFixed(2)}</b></div>
        <div><span>Pressão (IPC)</span><b>${nN(d.ipc, 0).toFixed(2)}</b></div>
        <div><span>Fluxo</span><b>${nN(d.fluxo, 0).toFixed(1)}</b></div>
        <div><span>Delta</span><b>${nN(d.delta, 0).toFixed(0)}</b></div>
        <div><span>Marés</span><b>${nN(d.mares, 0).toFixed(2)} m (${esc(d.maresVar || '—')})</b></div>
        <div><span>Prob. de alta</span><b>${nN(d.probAlta, 50)}%</b></div>
        <div><span>Prob. de baixa</span><b>${nN(d.probBaixa, 50)}%</b></div>
      </div>
    </div>
    <div class="box">
      <h2>DADOS REAIS</h2>
      ${A.sismos ? `<b>Sismos ≥4,5 na semana:</b> ${A.sismos.total} (maior M${A.sismos.maxMag})
        <div class="mu" style="font-size:12px;margin-top:4px">${A.sismos.top.map(s => 'M' + s.mag + ' ' + esc(s.local)).join(' · ')}</div>`
        : '<span class="mu">Sismos indisponíveis agora.</span>'}
      <br>
      ${A.kp ? `<b>Índice Kp:</b> ${A.kp.kp}` : '<span class="mu">Kp indisponível.</span>'}
    </div>
  `;
  document.querySelectorAll('.c[data-n]').forEach(c => {
    c.onclick = () => { cont = c.dataset.n; vMundo(); };
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cont = c.dataset.n; vMundo(); } };
  });
  $('os').oninput = e => { const v = parseFloat(e.target.value); if (isFinite(v)) oniSim = Math.round(v * 10) / 10; };
  $('os').onchange = () => { if (oniSim != null) localStorage.setItem(LS_ONI, String(oniSim)); MAPA = null; indDados = {}; indPromises = {}; vMundo(); };
  $('or').onclick = () => { oniSim = null; localStorage.removeItem(LS_ONI); MAPA = null; indDados = {}; indPromises = {}; vMundo(); };
}

function vProj() {

  $('v').innerHTML = `
    <div class="box">

      <div class="ind-tab" data-tipo="tempGlobal"><span class="em">🌡️</span><span class="nm">TEMP.GLOBAL</span><span class="vl" data-v>—</span></div>

      <div class="ind-tab" data-tipo="mares"><span class="em">🌊</span><span class="nm">MARÉS</span><span class="vl" data-v>—</span></div>
      <div class="ind-tab" data-tipo="elnino"><span class="em">🌊</span><span class="nm">EL NIÑO/LA NIÑA</span><span class="vl" data-v>—</span></div>
      <div class="ind-tab" data-tipo="geomagnetic"><span class="em">🧲</span><span class="nm">CAMPO MAGNÉTICO</span><span class="vl" data-v>—</span></div>

  `;
  $('pp').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    PER = b.dataset.p;
    document.querySelectorAll('#pp button').forEach(x => x.classList.toggle('on', x === b));

    if (c) await calcProj();
  };

    const b = e.target.closest('button'); if (!b) return;

async function analisarMundo() {
  const btn = $('mundo-btn');
  const resumo = $('mundo-resumo');
  const alertas = $('mundo-alertas');
  const cidade = ($('ci')?.value || '').trim() || localStorage.getItem(LS_CIDADE) || '';
  btn.disabled = true;
  btn.textContent = 'Analisando…';
  try {
    const d = await api('alertas', { cidade, periodo: PER, oni: oniSim });
    if (!d.ok) throw new Error(d.error || 'Falha na análise.');

    // Resumo grande
    resumo.hidden = false;
    resumo.className = 'aviso ' + (d.resumo.startsWith('⚠️') ? 'ruim' : d.resumo.startsWith('👀') ? '' : 'ok');
    resumo.textContent = d.resumo;

    // Atualiza cards dos 12
    if (d.status) {
      Object.keys(d.status).forEach(tipo => {
        const s = d.status[tipo]; if (!s) return;
        const card = document.querySelector(`#grid-indicadores [data-tipo="${tipo}"]`);
        if (!card) return;
        const vl = card.querySelector('[data-v]');
        if (s.valor != null) {
          vl.textContent = s.valor + (s.unidade ? ' ' + s.unidade : '');
          vl.style.color = 'var(--cy)';
        } else {
          vl.textContent = '—';
          vl.style.color = 'var(--mu)';
        }
        card.title = s.detalhe || '';
      });
    }

    // Lista de alertas
    alertas.hidden = false;
    if (!d.alertas || !d.alertas.length) {
      alertas.innerHTML = '<div class="aviso ok">✅ Nada grave agora. O mundo está tranquilo.</div>';
      return;
    }
    alertas.innerHTML = d.alertas.map(a => {
      const cor = a.nivel === 'perigo' ? 'var(--rd)' : a.nivel === 'atencao' ? 'var(--am)' : 'var(--cy)';
      const bg  = a.nivel === 'perigo' ? 'rgba(255,77,87,.08)' : a.nivel === 'atencao' ? 'rgba(240,168,48,.06)' : 'rgba(39,200,255,.04)';
      return `<div class="manchete" style="border-color:${cor};background:${bg};margin-bottom:8px">
        <small>${esc(a.territorio)}</small>
        <div style="font-size:22px;line-height:1;margin-bottom:4px">${a.icone || '⚠️'}</div>
        <div class="t" style="color:#fff">${esc(a.titulo)}</div>
        <p class="lead" style="margin-top:6px">${esc(a.explicacao)}</p>
        ${a.dados ? `<div class="mu" style="font-size:11px;margin-top:6px">${Object.entries(a.dados).map(([k,v]) => k + ': ' + v).join(' · ')}</div>` : ''}
      </div>`;
    }).join('');
  } catch (e) {
    resumo.hidden = false;
    resumo.className = 'aviso ruim';
    resumo.textContent = 'Erro: ' + (e.message || 'Falha.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analisar o mundo';
  }
}

async function calcProj() {
  const cidade = ($('ci')?.value || '').trim();
  if (!cidade) { $('pr').innerHTML = '<div class="box aviso">Informe a cidade.</div>'; return; }
  localStorage.setItem(LS_CIDADE, cidade);
  $('pr').innerHTML = '<div class="box"><span class="mu">Calculando com os modelos de conjunto…</span></div>';
  try {
    const [pv, pj] = await Promise.all([
      api('previsao', { cidade }),
      api('projecao', { cidade, periodo: PER }),
    ]);
    if (!pj.ok) throw new Error(pj.error || 'Projeção indisponível.');
    PV = pv; PROJ = pj; SELJ = 0;
    mostraProj();
  } catch (e) {
    $('pr').innerHTML = `<div class="box aviso ruim">${esc(e.message || 'Falha.')}</div>`;
  }
}

function cartaoPrevisao(p) {
  if (!p) return '';
  return `<div class="box">
    <h2>${esc(p.local)} <small>${esc(p.continente)}</small></h2>
    Agora <b>${p.atual.temp}°C</b>, umidade ${p.atual.umidade}%, vento ${p.atual.ventoKmh} km/h
    <div class="g" style="margin-top:8px">
      ${p.dias.map(d => `<div class="c" style="cursor:default">
        <div class="lbl">${esc(String(d.data).slice(5))}</div>
        <div class="val" style="font-size:14px">${d.min}–${d.max}°C</div>
        <div class="mu" style="font-size:11px">chuva ${d.chuvaProb}% · ${d.chuvaMm} mm</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function mostraProj() {
  if (!PROJ || !PROJ.janelas || !PROJ.janelas.length) {
    $('pr').innerHTML = '<div class="box aviso">Sem dados de projeção.</div>';
    return;
  }
  const J = PROJ.janelas, n = J.length;
  if (SELJ < 0 || SELJ >= n) SELJ = 0;
  const W = 700, L = 34, R = 12, sp = (W - L - R) / n;
  const x = i => L + sp * (i + 0.5);
  const todos = J.flatMap(w => [w.t.p10, w.t.p90]);
  const lo = Math.floor(Math.min(...todos) - 1);
  const hi = Math.ceil(Math.max(...todos) + 1);
  const y = t => 26 + (hi - t) / (hi - lo || 1) * 140;
  const cor = METS[MET].cor;
  const dd = PER === '14d' || PER === '7d';
  const band = J.map((w, i) => x(i) + ',' + y(w.t.p90)).join(' ')
             + ' ' + J.slice().reverse().map((w, i) => x(n - 1 - i) + ',' + y(w.t.p10)).join(' ');
  let svg = `<svg viewBox="0 0 700 300" class="graf" role="img" aria-label="Projeção">`;
  svg += `<polygon points="${band}" fill="#27c8ff33"/>`;
  svg += `<polyline points="${J.map((w, i) => x(i) + ',' + y(w.t.p50)).join(' ')}" fill="none" stroke="#27c8ff" stroke-width="2"/>`;
  svg += J.map((w, i) => {
    const h = w.prob[MET] * 70;
    return `<rect data-i="${i}" x="${x(i) - sp * 0.4}" y="${262 - h}" width="${sp * 0.8}" height="${h}"
      fill="${cor}" opacity="${i === SELJ ? 1 : 0.55}" style="cursor:pointer"/>`
      + (n <= 14 ? `<text x="${x(i)}" y="${258 - h}" fill="#e8f1ff" font-size="9" text-anchor="middle">${Math.round(w.prob[MET] * 100)}</text>` : '');
  }).join('');
  svg += (PROJ.marcas || []).map(m =>
    `<text data-i="${m.i}" x="${x(m.i) + (m.tipo === 'forte' || m.tipo === 'vento' ? 8 : -4)}"
       y="${y(J[m.i].t.p90) - 6}" font-size="12" text-anchor="middle" style="cursor:pointer">${m.icone}</text>`
  ).join('');
  svg += J.map((w, i) => i % Math.ceil(n / 8) === 0
    ? `<text x="${x(i)}" y="290" fill="#8fa8c8" font-size="9" text-anchor="middle">${esc((dd ? w.ini.slice(5, 10) : w.ini.slice(8, 13)).replace('T', ' '))}</text>`
    : ''
  ).join('');
  svg += `<text x="2" y="${y(hi) + 8}" fill="#8fa8c8" font-size="9">${hi}°</text>`;
  svg += `<text x="2" y="${y(lo)}" fill="#8fa8c8" font-size="9">${lo}°</text>`;
  svg += `</svg>`;
  const w = J[SELJ], P = w.prob;
  const pc = k => Math.round(P[k] * 100) + '%';
  $('pr').innerHTML = cartaoPrevisao(PV) + `
    <div class="box">
      <h2>${esc(PROJ.local)} <small>${esc(PROJ.continente)} · ${PER}</small></h2>
      ${svg}
      <div class="legenda">
        <span>Faixa = 10%–90% dos modelos</span><span>Linha = mediana</span>
        <span><b style="background:${cor}"></b>Barras = ${METS[MET].label}</span>
      </div>
    </div>
    <div class="box">
      <h2>JANELA ${esc(w.ini.replace('T', ' '))} <small>confiança ${w.conf}</small></h2>
      <div class="linhas">
        <div><span>Temp (p10/p50/p90)</span><b>${w.t.p10} / ${w.t.p50} / ${w.t.p90} °C</b></div>
        ${w.tmin != null ? `<div><span>Mínima</span><b>${w.tmin} °C</b></div>` : ''}
        <div><span>Chuva (p50/p90)</span><b>${w.chuvaMm.p50}–${w.chuvaMm.p90} mm</b></div>
        <div><span>Vento (p50/p90)</span><b>${w.ventoMax.p50}–${w.ventoMax.p90} km/h</b></div>
        <div><span>Chuva</span><b>${pc('chuva')}</b></div>
        <div><span>Chuva forte</span><b>${pc('forte')}</b></div>
        <div><span>Vento ≥40</span><b>${pc('vento')}</b></div>
        <div><span>Calor ≥35°</span><b>${pc('calor')}</b></div>
        <div><span>Frio ≤5°</span><b>${pc('frio')}</b></div>
        <div><span>Membros</span><b>${w.n}</b></div>
      </div>
    </div>
    <div class="box">
      <h2>RESUMO</h2>
      <p class="lead">${esc(PROJ.resumo || '')}</p>
      ${PROJ.contexto ? `<small class="mu">ENSO: ${esc(PROJ.contexto.fase)} (ONI ${PROJ.contexto.oni}), tendência sazonal de alta ${PROJ.contexto.tendenciaAlta}%. ${esc(PROJ.contexto.nota || '')}</small>` : ''}
      <br><small class="mu">${esc(PROJ.aviso || '')}</small>
    </div>
  `;
  document.querySelectorAll('#pr svg [data-i]').forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.i, 10);
      if (isFinite(i)) { SELJ = i; mostraProj(); }
    };
  });
}

  }
}

function renderMapa(m) {
  const rk = m.ranking || [];
  if (!rk.length) { $('v').innerHTML = '<div class="box aviso">Sem países no ranking.</div>'; return; }
  const ep = rk.find(r => r.cod === m.epicentro) || rk[0] || {};
  const oniFase = m.oni.fase;
  const oniCor = oniFase === 'El Niño' ? 'var(--rd)' : oniFase === 'La Niña' ? 'var(--cy)' : 'var(--am)';
  let html = `<div class="box">
    <h2>ENSO · ${esc(oniFase)} <small>ONI ${m.oni.valor} · ${esc(m.oni.periodo)}</small></h2>
    <p class="lead"><b style="color:${oniCor}">Epicentro:</b> ${esc(ep.nome || '—')} · <b>desvio ${ep.desvio > 0 ? '+' : ''}${ep.desvio}°C</b> · ${m.totalPaises} países</p>
    <p class="mu" style="font-size:12px">${esc(m.aviso)}</p>
  </div>`;
  html += `<div class="box"><h2>PAÍSES MAIS AFETADOS</h2><div class="g">`;
  rk.slice(0, 15).forEach(r => {
    const cor = r.desvio >= 0 ? 'var(--rd)' : 'var(--cy)';
    html += `<div class="c" style="cursor:default">
      <div class="lbl">${esc(r.nome)}</div>
      <div class="val" style="color:${cor}">${r.desvio > 0 ? '+' : ''}${r.desvio}°C</div>
      <div class="mu" style="font-size:11px;margin-top:2px">base ${r.tBase}°C → ${r.tFinal}°C · ${r.vizinhos} viz.</div>
    </div>`;
  });
  html += `</div></div>`;
  const series = m.series || {}, iteracoes = m.iteracoes || [];
  if (iteracoes.length > 1) {
    const W = 700, H = 260, L = 36, R = 12, T = 18, B = 26;
    const x = i => L + (W - L - R) * i / (iteracoes.length - 1);
    let yMin = 0, yMax = 0;
    Object.values(series).forEach(arr => arr.forEach(v => { if (v < yMin) yMin = v; if (v > yMax) yMax = v; }));
    yMin = Math.min(yMin, -0.5) - 0.2; yMax = Math.max(yMax, 0.5) + 0.2;
    const y = v => T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin));
    const CORES = ['#27c8ff','#ff4d57','#2fd48a','#f0a830','#aa66ff','#00e5ff','#ffd700','#ff8060'];
    const amostra = Object.keys(series).slice(0, 8);
    let svg = `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img">`;
    for (let k = 0; k <= 4; k++) {
      const yy = T + (H - T - B) * k / 4;
      const val = (yMax - (yMax - yMin) * k / 4).toFixed(1);
      svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#12335a"/>`;
      svg += `<text x="2" y="${yy + 4}" fill="#8fa8c8" font-size="9">${val}°</text>`;
    }
    iteracoes.forEach((it, i) => {
      if (i % Math.ceil(iteracoes.length / 8) === 0)
        svg += `<text x="${x(i)}" y="${H - 8}" fill="#8fa8c8" font-size="9" text-anchor="middle">${it}</text>`;
    });
    amostra.forEach((cod, idx) => {
      const arr = series[cod] || [];
      if (arr.length < 2) return;
      const pts = arr.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${CORES[idx % CORES.length]}" stroke-width="2"/>`;
    });
    svg += `</svg>`;
    html += `<div class="box"><h2>ONDA DO DOMINÓ</h2>${svg}<div class="legenda">`;
    amostra.forEach((cod, idx) => {
      const r = rk.find(x => x.cod === cod);
      if (!r) return;
      html += `<span><b style="background:${CORES[idx % CORES.length]}"></b>${esc(r.nome)}</span>`;
    });
    html += `</div></div>`;
  }
  html += `<div class="box"><h2>TODOS OS PAÍSES <small>${m.totalPaises} no grafo</small></h2>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr>
        <th style="text-align:left;padding:6px;border-bottom:1px solid var(--ln)">País</th>
        <th style="text-align:right;padding:6px;border-bottom:1px solid var(--ln)">Base</th>
        <th style="text-align:right;padding:6px;border-bottom:1px solid var(--ln)">Alvo</th>
        <th style="text-align:right;padding:6px;border-bottom:1px solid var(--ln)">Final</th>
        <th style="text-align:right;padding:6px;border-bottom:1px solid var(--ln)">Δ</th>
      </tr></thead><tbody>`;
  rk.forEach(r => {
    const cor = r.desvio >= 0 ? 'var(--rd)' : 'var(--cy)';
    html += `<tr>
      <td style="padding:5px 6px;border-bottom:1px solid #0e2b4d">${esc(r.nome)}</td>
      <td style="text-align:right;padding:5px 6px;border-bottom:1px solid #0e2b4d">${r.tBase}</td>
      <td style="text-align:right;padding:5px 6px;border-bottom:1px solid #0e2b4d">${r.tAlvo}</td>
      <td style="text-align:right;padding:5px 6px;border-bottom:1px solid #0e2b4d"><b>${r.tFinal}</b></td>
      <td style="text-align:right;padding:5px 6px;border-bottom:1px solid #0e2b4d;color:${cor}">${r.desvio > 0 ? '+' : ''}${r.desvio}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  $('v').innerHTML = html;
}

/* ══════════════════════════════════════════════════════
   SEÇÃO · TENDÊNCIA (preservada)
   ══════════════════════════════════════════════════════ */
async function vTend() {
  $('v').innerHTML = '<div class="box"><span class="mu">Carregando tendência…</span></div>';
  try {
    const t = await api('tendencia');
    if (!t.ok) throw new Error(t.error || 'Tendência indisponível.');
    const T = t.tendencia || {};
    $('v').innerHTML = `
      <div class="box">
        <h2>TENDÊNCIA HISTÓRICA <small>${esc(T.periodo || '')}</small></h2>
        <div class="legenda">
          <span><b style="background:var(--cy)"></b>Temperatura (°C)</span>
          <span><b style="background:var(--am)"></b>CO₂ (ppm)</span>
          <span><b style="background:var(--rd)"></b>Fertilidade (índice)</span>
        </div>
        ${graficoTendencia(t.historico || null)}
      </div>
      <div class="box">
        <h2>TAXAS POR ANO</h2>
        <div class="linhas">
          ${linhaT('População', '+' + num(T.populacao_bilhoes_por_ano, 3) + ' bi/ano')}
          ${linhaT('Energia/pessoa', '+' + num(T.energia_kwh_pessoa_por_ano, 0) + ' kWh/ano')}
          ${linhaT('CO₂', '+' + num(T.co2_ppm_por_ano, 3) + ' ppm/ano')}
          ${linhaT('Temperatura', '+' + num(T.temperatura_C_por_ano, 4) + ' °C/ano')}
          ${linhaT('Área agrícola', '+' + num(T.area_agricola_Mha_por_ano, 2) + ' Mha/ano')}
          ${linhaT('Fertilidade', num(T.fertilidade_indice_por_ano, 3) + ' pts/ano')}
          ${linhaT('Construção', '+' + num(T.construcao_pct_por_ano, 2) + ' %/ano')}
          ${linhaT('Consumo total', '+' + num(T.consumo_TWh_por_ano, 0) + ' TWh/ano')}
        </div>
      </div>
      <div class="box">
        <h2>CORRELAÇÕES (Pearson)</h2>
        <div class="linhas">
          ${Object.entries(T.correlacoes || {}).map(([k, v]) => {
            const [a, b] = k.split('_x_');
            const cor = Math.abs(v) > 0.7 ? 'var(--rd)' : 'var(--am)';
            return `<div><span>${esc(a)} × ${esc(b)}</span><b style="color:${cor}">${Number(v).toFixed(2)}</b></div>`;
          }).join('')}
        </div>
      </div>
      <div class="box"><small class="mu">${esc(t.fonte || '')}</small></div>
    `;
  } catch (e) {
    $('v').innerHTML = `<div class="box aviso ruim">${esc(e.message || 'Falha.')}</div>`;
  }
}

function linhaT(rot, val) {
  return `<div><span>${esc(rot)}</span><b>${esc(val)}</b></div>`;
}
function num(v, d) {
  const n = Number(v);
  return isFinite(n) ? n.toFixed(d) : '—';
}

function graficoTendencia(historico) {
  let D;
  if (historico && typeof historico === 'object' && Object.keys(historico).length) {
    D = {};
    Object.keys(historico).forEach(ano => {
      const h = historico[ano];
      D[ano] = [Number(h.co2) || 0, Number(h.temp) || 0, Number(h.fert) || 100];
    });
  } else {
    D = {
      '1970': [325.7, 0.03, 100], '1980': [338.7, 0.27, 95],
      '1990': [354.4, 0.45, 90], '2000': [369.5, 0.61, 84],
      '2010': [389.9, 0.82, 78], '2020': [414.2, 1.08, 72],
      '2023': [421.1, 1.31, 69],
    };
  }
  const anos = Object.keys(D);
  const W = 700, H = 260, L = 40, R = 12, T = 20, B = 30;
  const x = i => L + (W - L - R) * i / (anos.length - 1);
  const yc = v => T + (H - T - B) * (1 - v / 450);
  const yt = v => T + (H - T - B) * (1 - (v + 0.2) / 1.8);
  const yf = v => T + (H - T - B) * (1 - v / 110);
  const serie = (idx, yfn) => anos.map((yr, i) => x(i) + ',' + yfn(D[yr][idx])).join(' ');
  let s = `<svg viewBox="0 0 700 260" class="graf" role="img">`;
  for (let i = 0; i <= 4; i++) {
    const yy = T + (H - T - B) * i / 4;
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#12335a"/>`;
  }
  anos.forEach((yr, i) => {
    s += `<text x="${x(i)}" y="${H - 10}" fill="#8fa8c8" font-size="10" text-anchor="middle">${yr}</text>`;
  });
  s += `<polyline points="${serie(0, yc)}" fill="none" stroke="#f0a830" stroke-width="2.2"/>`;
  s += `<polyline points="${serie(1, yt)}" fill="none" stroke="#27c8ff" stroke-width="2.2"/>`;
  s += `<polyline points="${serie(2, yf)}" fill="none" stroke="#ff4d57" stroke-width="2.2"/>`;
  anos.forEach((yr, i) => {
    s += `<circle cx="${x(i)}" cy="${yc(D[yr][0])}" r="2.5" fill="#f0a830"/>`;
    s += `<circle cx="${x(i)}" cy="${yt(D[yr][1])}" r="2.5" fill="#27c8ff"/>`;
    s += `<circle cx="${x(i)}" cy="${yf(D[yr][2])}" r="2.5" fill="#ff4d57"/>`;
  });
  s += `</svg>`;
  return s;
}

/* ══════════════════════════════════════════════════════
   SEÇÃO · ATENDIMENTO (preservada)
   ══════════════════════════════════════════════════════ */
function vAtend() {
  const cidade = localStorage.getItem(LS_CIDADE) || '';
  $('v').innerHTML = `
    <div class="box">
      <h2>PROMPT PARA O ATENDIMENTO</h2>
      <input class="in" id="ac" placeholder="Cidade do cliente" value="${esc(cidade)}">
      <input class="in" id="ap" placeholder="Pergunta do cliente (opcional)">
      <div class="row">
        <button id="ag">Gerar prompt</button>
        <button class="p" id="ae">Enviar ao atendimento</button>
        <button id="acp">Copiar</button>
      </div>
    </div>
    <div class="box"><h2>RESULTADO</h2><pre id="ar">—</pre></div>
  `;
  const corpo = () => ({ cidade: ($('ac').value || '').trim(), pergunta: ($('ap').value || '').trim(), oni: oniSim });
  $('ag').onclick = async () => {
    $('ar').textContent = 'Gerando…';
    try {
      const j = await api('prompt', corpo());
      $('ar').textContent = j.ok ? j.prompt : (j.error || 'Falha.');
    } catch (e) { $('ar').textContent = e.message; }
  };
  $('ae').onclick = async () => {
    $('ar').textContent = 'Enviando ao atendimento…';
    try {
      const j = await api('atendimento', corpo());
      $('ar').textContent = j.ok ? 'PROMPT:\n' + j.prompt + '\n\nRESPOSTA:\n' + j.resposta : (j.error || 'Falha.');
    } catch (e) { $('ar').textContent = e.message; }
  };
  $('acp').onclick = () => {
    navigator.clipboard.writeText($('ar').textContent).then(() => {
      $('acp').textContent = 'Copiado ✓';
      setTimeout(() => { $('acp').textContent = 'Copiar'; }, 1500);
    });
  };
}

$('ge').onkeydown = e => { if (e.key === 'Enter') $('gs').focus(); };
$('gc').onclick = () => { location.href = WK + '/chat/'; };

if (carregarSessao()) iniciar();
else { $('app').hidden = true; $('gate').hidden = false; }

})();
