<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALMAFLUXO · ClimaFluxo</title>
<style>:root{color-scheme:dark;--bg:#050d1a;--p:#0a1a33;--ln:#1b4a7a;--tx:#e8f1ff;--mu:#8fa8c8;--cy:#27c8ff;--gr:#2fd48a;--rd:#ff4d57;--am:#f0a830}*{box-sizing:border-box;margin:0}body{background:radial-gradient(ellipse at 50% 0,#0b2347,var(--bg) 60%);color:var(--tx);font:14px system-ui,Arial;min-height:100vh;padding:12px}
h1{font-size:19px}h1 small{display:block;color:var(--cy);font-size:12px;font-weight:500}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button,.in{background:#0a1d3a;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:9px 12px;font:inherit}button{cursor:pointer;font-weight:600}button.on,button.p{background:#1f7bff;border-color:var(--cy)}.in{width:100%;margin-bottom:8px}
.box{background:linear-gradient(#0a1a33,#07142a);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px;line-height:1.5}.box h2{font-size:13px;color:var(--cy);margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.c{border:1px solid var(--ln);border-radius:8px;padding:8px;cursor:pointer}.c.on{border-color:var(--cy);background:#0f3a73}.bar{height:8px;border-radius:4px;background:#12335a;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
small,.mu{color:var(--mu)}pre{white-space:pre-wrap;background:#06101f;border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px/1.5 ui-monospace,monospace}.row{display:flex;gap:8px;flex-wrap:wrap}#gate{max-width:320px;margin:12vh auto}</style></head><body>
<div id="gate" class="box"><h2>Entre no ClimaFluxo</h2><p class="mu" style="margin-bottom:8px">Ferramenta gratuita. Use a mesma conta do ALMAFLUXO.</p><input class="in" id="ge" type="email" placeholder="E-mail"><input class="in" id="gs" type="password" placeholder="Senha"><button class="p" id="gl" style="width:100%;margin-bottom:6px">Entrar</button><button id="gc" style="width:100%">Criar conta no ALMAFLUXO</button><p id="gm" style="color:#ffb0b6;margin-top:8px"></p></div>
<div id="app" hidden><header><h1>ALMAFLUXO<small>ClimaFluxo · Análise do clima mundial</small></h1><nav id="nav"></nav></header><div id="v"></div></div>
<script>
const WK='https://almafluxo.uk',$=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U=null;try{U=JSON.parse(localStorage.getItem('almafluxo_usuario')||'null')}catch(e){}
const post=(p,b)=>fetch(WK+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const api=(r,b)=>post('/api/clima/'+r,Object.assign({email:U.email,sessionToken:U.sessionToken},b||{})).then(j=>{if(!j.ok&&/Entre/.test(j.error||'')){sair();throw new Error(j.error)}return j});
function sair(){U=null;localStorage.removeItem('almafluxo_usuario');$('app').hidden=true;$('gate').hidden=false}
$('gl').onclick=async()=>{$('gm').textContent='';try{const d=await post('/proxy/central',{action:'login',email:$('ge').value.trim(),senha:$('gs').value}),u=d.usuario||d,tk=d.token||d.sessionToken||u.sessionToken;if(!(d.ok===true||d.autenticado===true||d.status==='success')||!tk)throw new Error(d.error||d.message||'E-mail ou senha incorretos');U={nome:u.nome||'Usuário',email:$('ge').value.trim(),sessionToken:tk};localStorage.setItem('almafluxo_usuario',JSON.stringify(U));iniciar()}catch(e){$('gm').textContent=e.message}};
$('gc').onclick=()=>location.href='__CONTA__';
let A=null,cont='GLOBAL',aba='guia',oniSim=null,PV=null;
const ABAS=[['guia','📘 Guia'],['mundo','🌍 Mundo'],['proj','📈 Projeção'],['atend','💬 Atendimento']];
function iniciar(){if(!U||!U.sessionToken)return;$('gate').hidden=true;$('app').hidden=false;$('nav').innerHTML=ABAS.map(a=>'<button data-a="'+a[0]+'">'+a[1]+'</button>').join('')+'<button id="sx">Sair</button>';$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='sx')return sair();aba=b.dataset.a;mostra()};$('v').innerHTML='';mostra()}
async function mostra(){document.querySelectorAll('#nav button[data-a]').forEach(b=>b.classList.toggle('on',b.dataset.a===aba));({guia:vGuia,mundo:vMundo,proj:vProj,atend:vAtend})[aba]()}
function vGuia(){$('v').innerHTML='<div class="box"><h2>COMO USAR</h2><ol style="padding-left:18px"><li><b>Mundo</b>: veja a fase do El Niño/La Niña (índice ONI da NOAA) e toque num continente para ler a tendência, entropia e pressão.</li><li>Use o <b>controle de simulação do ONI</b> para ver como o mundo muda num El Niño ou La Niña mais forte.</li><li><b>Projeção</b>: escolha cidade e período (24 h a 14 dias). O gráfico mostra a faixa de temperatura e a probabilidade de chuva, vento, calor ou frio por janela, com marcas nos momentos de risco; toque numa janela para os detalhes.</li><li><b>Atendimento</b>: gera o prompt da análise + previsão local, que você copia ou envia ao atendimento com IA.</li></ol><p class="mu" style="margin-top:8px">Análise didática: probabilidades e entropia são do motor ALMAFLUXO, não previsão oficial. Para decisões importantes consulte a defesa civil e o serviço meteorológico.</p></div>'}
async function vMundo(){$('v').innerHTML='<div class="box">Carregando análise…</div>';try{A=await api('analise',{oni:oniSim,periodo:PER})}catch(e){$('v').innerHTML='<div class="box">'+esc(e.message)+'</div>';return}
 const o=A.oni,C=A.continentes,nomes=Object.keys(C),d=C[cont]||C.GLOBAL;
 $('v').innerHTML='<div class="box"><h2>ENSO · ONI '+o.valor+' ('+esc(o.fase)+')</h2><small>Período '+esc(o.periodo)+' · '+esc(o.fonte)+(o.simulado?' · <b style="color:var(--am)">simulado</b>':'')+'</small><div class="row" style="margin-top:8px;align-items:center"><input id="os" type="range" min="-3" max="3" step="0.1" value="'+o.valor+'" style="flex:1"><button id="or">Real</button></div></div><div class="box"><h2>CONTINENTES (tendência de alta)</h2><div class="g">'+nomes.map(n=>'<div class="c'+(n===cont?' on':'')+'" data-n="'+esc(n)+'"><b>'+esc(n)+'</b><br><small>'+C[n].probAlta+'% alta · '+C[n].t.toFixed(1)+'°C</small><div class="bar"><i style="width:'+C[n].probAlta+'%;background:'+(C[n].probAlta>=55?'var(--rd)':C[n].probAlta<=45?'var(--cy)':'var(--am)')+'"></i></div></div>').join('')+'</div></div><div class="box"><h2>'+esc(cont)+'</h2>Temperatura-base '+d.t.toFixed(1)+'°C · entropia '+d.entropia.toFixed(2)+' · pressão (IPC) '+d.ipc.toFixed(2)+' · fluxo '+d.fluxo.toFixed(1)+' · delta '+d.delta.toFixed(0)+' · marés '+d.mares.toFixed(2)+' m ('+esc(d.maresVar)+')</div><div class="box"><h2>DADOS REAIS</h2>'+(A.sismos?'Sismos ≥4,5 na semana: <b>'+A.sismos.total+'</b> (maior M'+A.sismos.maxMag+')<br><small>'+A.sismos.top.map(s=>'M'+s.mag+' '+esc(s.local)).join(' · ')+'</small>':'<small>Sismos indisponíveis agora.</small>')+'<br>'+(A.kp?'Índice Kp (geomagnético): <b>'+A.kp.kp+'</b>':'<small>Kp indisponível.</small>')+'</div>';
 document.querySelectorAll('.c').forEach(c=>c.onclick=()=>{cont=c.dataset.n;vMundo()});$('os').onchange=e=>{oniSim=e.target.value;vMundo()};$('or').onclick=()=>{oniSim=null;vMundo()}}
function cartao(p){return '<div class="box"><h2>'+esc(p.local)+' · '+esc(p.continente)+'</h2>Agora <b>'+p.atual.temp+'°C</b>, umidade '+p.atual.umidade+'%, vento '+p.atual.ventoKmh+' km/h<div class="g" style="margin-top:8px">'+p.dias.map(d=>'<div class="c"><b>'+esc(d.data.slice(5))+'</b><br>'+d.min+'–'+d.max+'°C<br><small>chuva '+d.chuvaProb+'% · '+d.chuvaMm+' mm</small></div>').join('')+'</div></div>'}
let PER='7d',MET='chuva',PJ=null,SELJ=0;
const METS={chuva:['🌧 Chuva','#27c8ff'],forte:['⛈ Forte','#aa66ff'],vento:['💨 Vento ≥40','#f0a830'],calor:['🔥 ≥35°','#ff4d57'],frio:['❄ ≤5°','#4488ff']};
function vProj(){$('v').innerHTML='<div class="box"><h2>PROJEÇÃO POR PERÍODO</h2><input class="in" id="ci" placeholder="Cidade (ex.: Rio de Janeiro)" value="'+esc(localStorage.getItem('clima_cidade')||'')+'"><div class="row" id="pp">'+[['24h','24 horas'],['3d','3 dias'],['7d','7 dias'],['14d','14 dias']].map(p=>'<button data-p="'+p[0]+'" class="'+(p[0]===PER?'on':'')+'">'+p[1]+'</button>').join('')+'</div><div class="row" id="pm" style="margin-top:6px">'+Object.keys(METS).map(k=>'<button data-m="'+k+'" class="'+(k===MET?'on':'')+'">'+METS[k][0]+'</button>').join('')+'</div><button class="p" id="cb" style="margin-top:8px">Calcular projeção</button></div><div id="pr"></div>';
 $('pp').onclick=e=>{const b=e.target.closest('button');if(!b)return;PER=b.dataset.p;vProj();if($('ci').value.trim())calcProj()};
 $('pm').onclick=e=>{const b=e.target.closest('button');if(!b)return;MET=b.dataset.m;document.querySelectorAll('#pm button').forEach(x=>x.classList.toggle('on',x===b));if(PJ)mostraProj()};
 $('cb').onclick=calcProj;if(PJ)mostraProj()}
async function calcProj(){const c=$('ci').value.trim();if(!c)return;localStorage.setItem('clima_cidade',c);$('pr').innerHTML='<div class="box">Calculando com os modelos de conjunto…</div>';
 try{const [pv,pj]=await Promise.all([api('previsao',{cidade:c}),api('projecao',{cidade:c,periodo:PER})]);if(!pj.ok)throw new Error(pj.error||'Projeção indisponível');PV=pv;PJ=pj;SELJ=0;mostraProj()}catch(e){$('pr').innerHTML='<div class="box">'+esc(e.message)+'</div>'}}
function mostraProj(){const J=PJ.janelas,n=J.length,W=700,L=34,sp=(W-L-8)/n,x=i=>L+sp*(i+.5),ts=J.flatMap(w=>[w.t.p10,w.t.p90]),lo=Math.floor(Math.min(...ts)-1),hi=Math.ceil(Math.max(...ts)+1),y=t=>26+(hi-t)/(hi-lo||1)*140,c=METS[MET][1],dd=PER==='14d'||PER==='7d';
 const band=J.map((w,i)=>x(i)+','+y(w.t.p90)).join(' ')+' '+J.map((w,i)=>x(n-1-i)+','+y(J[n-1-i].t.p10)).join(' ');
 let s='<svg id="sv" viewBox="0 0 700 300" style="width:100%"><polygon points="'+band+'" fill="#27c8ff33"/><polyline points="'+J.map((w,i)=>x(i)+','+y(w.t.p50)).join(' ')+'" fill="none" stroke="#27c8ff" stroke-width="2"/>'
 +J.map((w,i)=>{const h=w.prob[MET]*70;return '<rect data-i="'+i+'" x="'+(x(i)-sp*.4)+'" y="'+(262-h)+'" width="'+sp*.8+'" height="'+h+'" fill="'+c+'" opacity="'+(i===SELJ?1:.55)+'"/>'+(n<=14?'<text x="'+x(i)+'" y="'+(258-h)+'" fill="#e8f1ff" font-size="9" text-anchor="middle">'+Math.round(w.prob[MET]*100)+'</text>':'')}).join('')
 +PJ.marcas.map(m=>'<text data-i="'+m.i+'" x="'+(x(m.i)+(m.tipo==='forte'||m.tipo==='vento'?8:-4))+'" y="'+(y(J[m.i].t.p90)-6)+'" font-size="12" text-anchor="middle">'+m.icone+'</text>').join('')
 +J.map((w,i)=>i%Math.ceil(n/8)===0?'<text x="'+x(i)+'" y="290" fill="#8fa8c8" font-size="9" text-anchor="middle">'+esc((dd?w.ini.slice(5,10):w.ini.slice(8,13)).replace('T',' '))+'</text>':'').join('')
 +'<text x="2" y="'+(y(hi)+8)+'" fill="#8fa8c8" font-size="9">'+hi+'°</text><text x="2" y="'+y(lo)+'" fill="#8fa8c8" font-size="9">'+lo+'°</text></svg>';
 const w=J[SELJ],P=w.prob,pc=k=>Math.round(P[k]*100)+'%';
 $('pr').innerHTML=(PV?cartao(PV):'')+'<div class="box"><h2>'+esc(PJ.local)+' · '+esc(PJ.continente)+' · '+PER+'</h2>'+s+'<small>Faixa = 10%–90% dos modelos · linha = mediana · barras = '+METS[MET][0]+'</small></div><div class="box"><h2>JANELA '+esc(w.ini.replace('T',' '))+' · confiança '+w.conf+'</h2>Temp. '+w.t.p10+' / <b>'+w.t.p50+'</b> / '+w.t.p90+'°C'+(w.tmin!=null?' (mín. '+w.tmin+'°C)':'')+' · chuva '+w.chuvaMm.p50+'–'+w.chuvaMm.p90+' mm · vento até '+w.ventoMax.p50+'–'+w.ventoMax.p90+' km/h<br>Chuva '+pc('chuva')+' · forte '+pc('forte')+' · vento≥40 '+pc('vento')+' · calor≥35° '+pc('calor')+' · frio≤5° '+pc('frio')+' <small>('+w.n+' membros)</small></div><div class="box"><h2>RESUMO</h2>'+esc(PJ.resumo)+(PJ.contexto?'<br><small>ENSO: '+esc(PJ.contexto.fase)+' (ONI '+PJ.contexto.oni+'), tendência sazonal de alta '+PJ.contexto.tendenciaAlta+'%. '+esc(PJ.contexto.nota)+'</small>':'')+'<br><small>'+esc(PJ.aviso)+'</small></div>';
 $('sv').onclick=e=>{const t=e.target.closest('[data-i]');if(t){SELJ=+t.dataset.i;mostraProj()}}}
function vAtend(){$('v').innerHTML='<div class="box"><h2>PROMPT PARA O ATENDIMENTO</h2><input class="in" id="ac" placeholder="Cidade do cliente" value="'+esc(localStorage.getItem('clima_cidade')||'')+'"><input class="in" id="ap" placeholder="Pergunta do cliente (opcional)"><div class="row"><button id="ag">Gerar prompt</button><button class="p" id="ae">Enviar ao atendimento</button><button id="acp">Copiar</button></div></div><div class="box"><h2>RESULTADO</h2><pre id="ar">—</pre></div>';
 const corpo=()=>({cidade:$('ac').value.trim(),pergunta:$('ap').value.trim(),oni:oniSim});
 $('ag').onclick=async()=>{$('ar').textContent='Gerando…';try{const j=await api('prompt',corpo());$('ar').textContent=j.prompt}catch(e){$('ar').textContent=e.message}};
 $('ae').onclick=async()=>{$('ar').textContent='Enviando ao atendimento…';try{const j=await api('atendimento',corpo());$('ar').textContent='PROMPT:\n'+j.prompt+'\n\nRESPOSTA:\n'+j.resposta}catch(e){$('ar').textContent=e.message}};
 $('acp').onclick=()=>{navigator.clipboard.writeText($('ar').textContent).then(()=>{$('acp').textContent='Copiado ✓'})}}
iniciar();
</script></body></html>
