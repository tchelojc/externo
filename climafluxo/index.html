/* ══════════════════════════════════════════════════════════════
   NOVA SEÇÃO · CICLOS / PADRÕES
   Isolada das abas existentes. Importação JSON feita no navegador.
   Ciclo de 1.296 anos é hipótese de modelo, não fato validado.
   ══════════════════════════════════════════════════════════════ */
let CICLOS = { arquivos: [], eventos: [], eras: [], ultimaAnalise: null, vista: 'visao' };
const CICLO_LONGO = 1296;
const CICLOS_ORBITAS = [
  {nome:'Ano terrestre', dias:365.2422, tipo:'orbital', nota:'Período orbital médio da Terra'},
  {nome:'Ano de Mercúrio', dias:87.969, tipo:'orbital', nota:'Período orbital de Mercúrio'},
  {nome:'Período sinódico Mercúrio–Terra', dias:115.88, tipo:'sinodico', nota:'Intervalo médio entre configurações relativas semelhantes vistos da Terra'},
  {nome:'Ciclo de atividade solar', dias:4017.0, tipo:'variavel', nota:'Aproximação de 11 anos; o ciclo real varia'}
];
function cNum(v, d=2){ const n=Number(v); return Number.isFinite(n)?n.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—'; }
function cGetYear(){ const el=document.getElementById('cAno'); const n=el?Number(el.value):new Date().getFullYear(); return Number.isFinite(n)?n:new Date().getFullYear(); }
function cExtrairArray(obj, nomes){
  if(Array.isArray(obj)) return obj;
  if(!obj || typeof obj!=='object') return [];
  for(const k of nomes){ if(Array.isArray(obj[k])) return obj[k]; if(obj[k] && typeof obj[k]==='object'){ for(const kk of ['events','eventos','eras','items','data']) if(Array.isArray(obj[k][kk])) return obj[k][kk]; } }
  for(const v of Object.values(obj)){ if(Array.isArray(v) && v.some(x=>x&&typeof x==='object')) return v; }
  return [];
}
function cNormEvento(e, origem){
  const rawYear=e.year ?? e.ano ?? e.start_year ?? e.startYear ?? e.inicio ?? e.date ?? e.data ?? null;
  let ano=null;
  if(typeof rawYear==='number') ano=rawYear;
  else if(typeof rawYear==='string'){ const m=rawYear.match(/-?\d{1,4}/); if(m) ano=Number(m[0]); }
  const freqs=e.frequencies && typeof e.frequencies==='object'?e.frequencies:{};
  const rawFreq=e.frequencia_hz ?? e.frequency_hz ?? e.frequencia ?? e.frequency ?? freqs.base ?? freqs.value ?? null;
  const freq=rawFreq===null || rawFreq==='' ? NaN : Number(rawFreq);
  return {ano, titulo:String(e.title ?? e.titulo ?? e.name ?? e.nome ?? e.event ?? 'Evento sem título'), origem,
    tipo:String(e.type ?? e.tipo ?? e.category ?? e.categoria ?? origem), frequencia:Number.isFinite(freq)?freq:null,
    frequenciaCampo: rawFreq===null?'':String(rawFreq), frequenciaUnidade:String(e.frequencia_unidade ?? e.frequency_unit ?? ((e.frequencia_hz!==undefined || e.frequency_hz!==undefined)?'Hz (nome do campo)':rawFreq!==null?'unidade não informada':'')),
    fonte:String(e.source ?? e.fonte ?? e.sources ?? ''), confianca:String(e.confidence ?? e.confianca ?? e.status ?? 'não informada'), bruto:e};
}
function cLerArquivo(file, tipo){
  return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>{try{
    const obj=JSON.parse(String(r.result||'')); const arr=cExtrairArray(obj,['events','eventos','timeline_events','historical_events','timeline_eras','eras']);
    const regs=arr.map(e=>cNormEvento(e,tipo));
    if(!regs.length && obj && typeof obj==='object' && !Array.isArray(obj)){
      const one=cNormEvento(obj,tipo); if(one.ano!==null || one.titulo!=='Evento sem título') regs.push(one);
    }
    resolve({tipo,nome:file.name,regs,raw:obj});
  }catch(e){reject(new Error(file.name+': JSON inválido ('+e.message+')'));}}; r.onerror=()=>reject(new Error('Não foi possível ler '+file.name)); r.readAsText(file); });
}
function cDadosAgregados(){ return CICLOS.arquivos.flatMap(f=>f.regs).filter(e=>e.ano!==null).sort((a,b)=>a.ano-b.ano); }
function cCicloLongo(ano, eventos){
  const refs=eventos.filter(e=>e.ano!==null).map(e=>e.ano).sort((a,b)=>a-b);
  const ultimo=refs.length?refs[refs.length-1]:null;
  const proximo=ultimo===null?null:ultimo+CICLO_LONGO;
  const dist=proximo===null?null:Math.abs(ano-proximo);
  const dentro=dist!==null && dist<=30;
  const perto=dist!==null && dist>30 && dist<=200;
  const status=dist===null?'Sem eventos datados':dentro?'Dentro da janela de ±30 anos do marco calculado':perto?'A até 200 anos do marco calculado, fora da janela de ±30 anos':'Não é marco de reset: fora da janela de ±30 anos do marco '+cNum(proximo,0);
  const porFonte=CICLOS.arquivos.map(f=>{const ys=f.regs.filter(e=>e.ano!==null).map(e=>e.ano);return {nome:f.nome||f.tipo||'fonte sem nome',ultimo:ys.length?Math.max(...ys):null};});
  return {ultimo,proximo,dist,status,porFonte};
}
function cFase(dias, periodo){ return ((dias%periodo)+periodo)%periodo/periodo; }
function cFaseOrbitas(ano){
  // Época J2000: 2000-01-01T12:00:00Z. Para o ano selecionado,
  // a fase é avaliada em 1º de janeiro às 00:00 UTC.
  const epoch=Date.UTC(2000,0,1,12,0,0);
  const instante=Date.UTC(ano,0,1,0,0,0);
  const t=(instante-epoch)/86400000;
  return CICLOS_ORBITAS.map(o=>({...o, fase:cFase(t,o.dias), diasDecorridos:((t%o.dias)+o.dias)%o.dias, proximoCiclo:o.dias-(((t%o.dias)+o.dias)%o.dias), epoca:'2000-01-01T12:00:00Z', instanteCalculo:`${ano}-01-01T00:00:00Z`}));
}
function cCorrelacao(xs,ys){
  const n=Math.min(xs.length,ys.length); if(n<3)return null; const a=xs.slice(0,n),b=ys.slice(0,n),ma=a.reduce((s,x)=>s+x,0)/n,mb=b.reduce((s,x)=>s+x,0)/n;
  let num=0,da=0,db=0;for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;num+=x*y;da+=x*x;db+=y*y;}return da&&db?num/Math.sqrt(da*db):null;
}
function cRender(){
  const year=cGetYear(), ev=cDadosAgregados(), cycle=cCicloLongo(year,ev), orbs=cFaseOrbitas(year);

  let body='';

    <div class="box"><h2>CICLO HISTÓRICO HIPOTÉTICO</h2><div class="ciclos-kpis"><div class="ciclos-kpi"><small>Ano analisado</small><strong>${year}</strong></div><div class="ciclos-kpi"><small>Último ano agregado das fontes carregadas</small><strong>${cycle.ultimo===null?'—':cNum(cycle.ultimo,0)}</strong></div><div class="ciclos-kpi"><small>Próximo marco calculado</small><strong>${cycle.proximo===null?'—':cNum(cycle.proximo,0)}</strong></div><div class="ciclos-kpi"><small>Distância ao marco</small><strong>${cycle.dist===null?'—':cNum(cycle.dist,0)+' anos'}</strong></div></div><p class="lead" style="margin-top:8px">${esc(cycle.status)}</p><div class="ciclos-small"><b>Último ano por arquivo/origem:</b>${cycle.porFonte.length?`<div class="linhas">${cycle.porFonte.map(f=>`<div><span>${esc(f.nome)}</span><b>${f.ultimo===null?'sem ano':cNum(f.ultimo,0)}</b></div>`).join('')}</div>`:' Nenhuma fonte carregada.'}</div><p class="ciclos-small">O sistema soma 1.296 anos ao evento datado mais recente agregado. Estado calculado em relação à janela de ±30 anos do marco ${cycle.proximo===null?'não calculado':cNum(cycle.proximo,0)}. A regra é exploratória, não um ciclo histórico validado nem uma previsão.</p></div>`;
  } else if(CICLOS.vista==='eventos'){
    body=`<div class="box"><h2>EVENTOS NORMALIZADOS <small>${ev.length} registros</small></h2>${ev.length?`<div class="ciclos-table-wrap"><table class="ciclos-table"><thead><tr><th>Ano</th><th>Evento</th><th>Origem</th><th>Tipo</th><th>Frequência declarada</th><th>Confiança/fonte</th></tr></thead><tbody>${ev.slice(0,500).map(e=>`<tr><td>${e.ano===null?'—':esc(String(e.ano))}</td><td>${esc(e.titulo)}</td><td>${esc(e.origem)}</td><td>${esc(e.tipo)}</td><td>${e.frequencia===null?'— (campo ausente no registro carregado)':cNum(e.frequencia,3)+' '+esc(e.frequenciaUnidade||'(valor bruto declarado)')}</td><td>${esc((e.confianca||'')+' '+(e.fonte||''))}</td></tr>`).join('')}</tbody></table></div>${ev.length>500?`<p class="ciclos-small">Exibindo os primeiros 500 registros.</p>`:''}`:'<p class="mu">Importe os JSONs para visualizar os eventos.</p>'}</div>`;
  } else if(CICLOS.vista==='padroes'){
    const byType={};ev.forEach(e=>{const k=e.tipo||e.origem;byType[k]=(byType[k]||0)+1;});
    const years=ev.filter(e=>e.ano!==null).map(e=>e.ano).sort((a,b)=>a-b);const intervals=[];for(let i=1;i<years.length;i++) intervals.push(years[i]-years[i-1]);
    const freqCounts={};ev.forEach(e=>{if(e.frequencia!==null){const k=String(e.frequencia);freqCounts[k]=(freqCounts[k]||0)+1;}});

    const mediaIntervalo=intervals.length?intervals.reduce((a,b)=>a+b,0)/intervals.length:null;

    const cvIntervalo=mediaIntervalo>0&&desvioIntervalo!==null?desvioIntervalo/mediaIntervalo*100:null;
    body=`<div class="box"><h2>AGRUPAMENTOS OBSERVADOS</h2><p class="ciclos-small">Contagens descritivas nos arquivos importados; repetição de valor ou proximidade temporal, isoladamente, não demonstra causa nem periodicidade.</p><div class="ciclos-grid"><div><h3>Registros por tipo/origem</h3><div class="linhas">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<div><span>Sem dados</span><b>—</b></div>'}</div></div><div><h3>Frequências declaradas repetidas</h3><div class="linhas">${frequent.map(([k,v])=>`<div><span>${esc(k)} (campo do arquivo)</span><b>${v}×</b></div>`).join('')||'<div><span>Sem frequências numéricas</span><b>—</b></div>'}</div></div><div><h3>Intervalos entre registros datados</h3><div class="linhas"><div><span>Intervalos calculados</span><b>${intervals.length}</b></div><div><span>Mediana</span><b>${intervals.length?cNum([...intervals].sort((a,b)=>a-b)[Math.floor(intervals.length/2)],1)+' anos':'—'}</b></div><div><span>Média</span><b>${mediaIntervalo===null?'—':cNum(mediaIntervalo,1)+' anos'}</b></div><div><span>Desvio-padrão (populacional)</span><b>${desvioIntervalo===null?'—':cNum(desvioIntervalo,1)+' anos'}</b></div><div><span>Coeficiente de variação</span><b>${cvIntervalo===null?'—':cNum(cvIntervalo,1)+'%'}</b></div></div><p class="ciclos-small">O desvio-padrão descreve a dispersão destes intervalos; o coeficiente de variação é descritivo e não prova nem refuta sozinho um ciclo causal.</p></div></div></div>`;
  } else {
    body=`<div class="box"><h2>VALIDAÇÃO E LIMITES</h2><ul><li>Preserve os valores brutos: campos com nomes iguais podem representar conceitos diferentes entre arquivos.</li><li>Frequência declarada em JSON não é automaticamente frequência astronômica medida.</li><li>Vetores de impacto são tratados como dados conceituais; não são coordenadas geográficas.</li><li>“Confiança” e “probability_field” importados são exibidos como metadados, não convertidos em probabilidade estatística.</li><li>Para validar ciclos: defina a hipótese antes do teste, compare com séries de controle, considere lacunas, viés de seleção e múltiplos testes.</li><li>Alinhamentos astronômicos físicos exigem efemérides/posições celestes com data e sistema de coordenadas; este painel ainda não afirma calculá-los.</li><li>Se a expressão ΔM = E·sin(θ)/432 for usada no modelo: ΔM é índice adimensional de sensibilidade contextual; E derivado de Kp não é energia em MeV; θ é um ângulo Sol–Centro Galáctico aproximado; 432 é constante de referência do ecossistema. A expressão não fornece, por si só, probabilidade nem previsão validada.</li></ul></div>`;
  }
  $('v').innerHTML=`<div class="box"><h2>OBSERVATÓRIO DE CICLOS E PADRÕES</h2><p class="lead">Ferramenta complementar para comparar ciclos orbitais médios, marcos históricos e padrões dos JSONs importados, sem alterar as abas existentes.</p><div class="aviso">O ciclo de 1.296 anos é uma hipótese do modelo, não um ciclo histórico validado. Fases orbitais abaixo são aproximações matemáticas e não equivalem a alinhamentos astronômicos 3D. Os registros incorporados são exemplos transcritos do documento enviado, não os JSONs completos.</div><div class="ciclos-grid"><div><label for="cAno" class="ciclos-small">Ano de análise</label><input class="in" id="cAno" type="number" step="1" value="${year}"></div><div><label for="cCiclo" class="ciclos-small">Ciclo hipotético (anos)</label><input class="in" id="cCiclo" type="number" min="1" step="1" value="${CICLO_LONGO}" disabled><p class="ciclos-small">Mantido em 1.296 nesta versão para evitar alterar silenciosamente a hipótese.</p></div></div><div class="ciclos-file"><b>Dados incorporados no Worker + importação opcional</b><p class="ciclos-small">Os exemplos disponíveis no documento enviado já são carregados do Worker. Se você conseguir obter os JSONs completos depois, pode adicioná-los aqui; os arquivos são lidos localmente no navegador e não enviados ao servidor.</p><input id="cJson" type="file" accept=".json,application/json" multiple><div class="row"><button class="p" id="cImportar">Importar/Adicionar JSONs</button><button id="cLimpar">Limpar dados importados</button><button id="cExportar">Exportar normalizado CSV</button></div><div id="cMsg" class="ciclos-small" aria-live="polite">${CICLOS.arquivos.length?`${CICLOS.arquivos.length} arquivo(s) carregado(s).`: 'Carregando dados incorporados do Worker…'}</div></div>${kpis}<div class="ciclos-subtabs" style="margin-top:12px"><button data-cvista="visao" class="${CICLOS.vista==='visao'?'on':''}">Visão geral</button><button data-cvista="eventos" class="${CICLOS.vista==='eventos'?'on':''}">Eventos</button><button data-cvista="padroes" class="${CICLOS.vista==='padroes'?'on':''}">Padrões</button><button data-cvista="validacao" class="${CICLOS.vista==='validacao'?'on':''}">Validação</button></div></div>${body}`;
  $('cAno').addEventListener('change',()=>{const y=Number($('cAno').value);if(Number.isInteger(y)&&y>=-9999&&y<=9999)cRender();});

  $('cImportar').onclick=async()=>{const files=Array.from($('cJson').files||[]);if(!files.length){$('cMsg').textContent='Selecione pelo menos um arquivo JSON.';return;}$('cImportar').disabled=true;$('cMsg').textContent='Lendo arquivos…';try{const results=await Promise.all(files.map(f=>cLerArquivo(f,f.name)));CICLOS.arquivos=CICLOS.arquivos.filter(old=>!results.some(n=>n.nome===old.nome)).concat(results);$('cMsg').textContent=`Importados ${results.length} arquivo(s); ${CICLOS.arquivos.reduce((s,f)=>s+f.regs.length,0)} registros reconhecidos.`;cRender();}catch(e){$('cMsg').textContent=e.message;}finally{const b=$('cImportar');if(b)b.disabled=false;}};
